services:
  fabric:
    user: root
    environment:
      OPL_FABRIC_PROVIDER: local-docker
      OPL_FABRIC_LOCAL_DOCKER_TRUSTED_WORKSPACE_IMAGES: ${OPL_WORKSPACE_IMAGE:?Set OPL_WORKSPACE_IMAGE to an immutable Workspace image digest}
      OPL_FABRIC_LOCAL_DOCKER_SECRET_ROOT: ${OPL_FABRIC_LOCAL_DOCKER_SECRET_ROOT:?Set a task-owned local Docker Secret root}
      OPL_FABRIC_LOCAL_DOCKER_GATEWAY_CONTAINER: ${OPL_FABRIC_LOCAL_DOCKER_GATEWAY_CONTAINER:?Set the task-owned Control Plane gateway container}
    volumes:
      - type: bind
        source: ${OPL_DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
      - type: bind
        source: ${OPL_FABRIC_LOCAL_DOCKER_SECRET_ROOT:?Set a task-owned local Docker Secret root}
        target: ${OPL_FABRIC_LOCAL_DOCKER_SECRET_ROOT:?Set a task-owned local Docker Secret root}

  control-plane:
    labels:
      opl.fabric.local-docker.gateway: control-plane
    environment:
      OPL_WORKSPACE_IMAGE: ${OPL_WORKSPACE_IMAGE:?Set OPL_WORKSPACE_IMAGE to an immutable Workspace image digest}
      OPL_WORKSPACE_LAUNCH_WORKER_ENABLED: "1"
      OPL_TENCENT_ZONE: local
