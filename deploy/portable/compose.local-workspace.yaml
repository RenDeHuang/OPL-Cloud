services:
  postgres:
    volumes:
      - type: bind
        source: ${OPL_POSTGRES_DATA_ROOT:?Set the customer-owned PostgreSQL data root}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false

  control-plane:
    environment:
      OPL_WORKSPACE_IMAGE: ${OPL_WORKSPACE_IMAGE:?Set OPL_WORKSPACE_IMAGE to an immutable Workspace image digest}
      OPL_WORKSPACE_LAUNCH_WORKER_ENABLED: "1"
