services:
  fabric:
    labels:
      opl.cloud.fabric-provider: tencent-tke
    environment:
      OPL_FABRIC_PROVIDER: tencent-tke
      OPL_FABRIC_TENCENT_TKE_PROVIDER_PROFILE_JSON: ${OPL_FABRIC_TENCENT_TKE_PROVIDER_PROFILE_JSON:?Set the deployment-owned Tencent/TKE provider profile JSON}
      OPL_TENCENT_ZONE: ${OPL_TENCENT_ZONE:?Set OPL_TENCENT_ZONE}
      OPL_TENCENT_REGION: ${OPL_TENCENT_REGION:?Set OPL_TENCENT_REGION}
      TENCENT_CVM_SYSTEM_DISK_TYPE: ${TENCENT_CVM_SYSTEM_DISK_TYPE:?Set TENCENT_CVM_SYSTEM_DISK_TYPE}
      TENCENT_CVM_SYSTEM_DISK_SIZE_GB: ${TENCENT_CVM_SYSTEM_DISK_SIZE_GB:?Set TENCENT_CVM_SYSTEM_DISK_SIZE_GB}
      TENCENT_CBS_DISK_TYPE: ${TENCENT_CBS_DISK_TYPE:?Set TENCENT_CBS_DISK_TYPE}

  control-plane:
    labels:
      opl.cloud.fabric-provider: tencent-tke
    environment:
      OPL_FABRIC_PROVIDER: tencent-tke
      OPL_TENCENT_ZONE: ${OPL_TENCENT_ZONE:?Set OPL_TENCENT_ZONE}
      OPL_TENCENT_REGION: ${OPL_TENCENT_REGION:?Set OPL_TENCENT_REGION}
