name: opl-cloud

x-opl-cloud-common: &opl-cloud-common
  image: ${OPL_CLOUD_IMAGE:?Set OPL_CLOUD_IMAGE to an immutable GHCR digest}
  restart: unless-stopped
  init: true
  environment: &opl-cloud-environment
    NODE_ENV: production
    PGSSLMODE: disable

services:
  postgres:
    image: postgres:16.8-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${OPL_POSTGRES_ADMIN_PASSWORD:?Set OPL_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      OPL_CONTROL_PLANE_DATABASE_PASSWORD: ${OPL_CONTROL_PLANE_DATABASE_PASSWORD:?Set OPL_CONTROL_PLANE_DATABASE_PASSWORD}
      OPL_FABRIC_DATABASE_PASSWORD: ${OPL_FABRIC_DATABASE_PASSWORD:?Set OPL_FABRIC_DATABASE_PASSWORD}
      OPL_LEDGER_DATABASE_PASSWORD: ${OPL_LEDGER_DATABASE_PASSWORD:?Set OPL_LEDGER_DATABASE_PASSWORD}
    configs:
      - source: opl-postgres-init
        target: /docker-entrypoint-initdb.d/10-opl-service-databases.sh
        mode: 0555
    volumes:
      - opl-cloud-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      opl-cloud:
        ipv4_address: ${OPL_POSTGRES_HOST:-172.30.0.10}

  ledger:
    <<: *opl-cloud-common
    command: ["/usr/local/bin/opl-ledger"]
    environment:
      <<: *opl-cloud-environment
      DATABASE_URL: postgresql://opl_ledger:${OPL_LEDGER_DATABASE_PASSWORD:?Set OPL_LEDGER_DATABASE_PASSWORD}@${OPL_POSTGRES_HOST:-172.30.0.10}:5432/opl_ledger?sslmode=disable
      LEDGER_ADDR: :8081
      OPL_INTERNAL_SERVICE_TOKEN: ${OPL_INTERNAL_SERVICE_TOKEN:?Set OPL_INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/readyz"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [opl-cloud]

  fabric:
    <<: *opl-cloud-common
    command: ["/usr/local/bin/opl-fabric"]
    environment:
      <<: *opl-cloud-environment
      DATABASE_URL: postgresql://opl_fabric:${OPL_FABRIC_DATABASE_PASSWORD:?Set OPL_FABRIC_DATABASE_PASSWORD}@${OPL_POSTGRES_HOST:-172.30.0.10}:5432/opl_fabric?sslmode=disable
      FABRIC_ADDR: :8082
      OPL_INTERNAL_SERVICE_TOKEN: ${OPL_INTERNAL_SERVICE_TOKEN:?Set OPL_INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [opl-cloud]

  control-plane:
    <<: *opl-cloud-common
    command: ["/usr/local/bin/opl-control-plane"]
    environment:
      <<: *opl-cloud-environment
      CONTROL_PLANE_ADDR: :8787
      DATABASE_URL: postgresql://opl_control_plane:${OPL_CONTROL_PLANE_DATABASE_PASSWORD:?Set OPL_CONTROL_PLANE_DATABASE_PASSWORD}@${OPL_POSTGRES_HOST:-172.30.0.10}:5432/opl_control_plane?sslmode=disable
      LEDGER_URL: http://ledger:8081
      FABRIC_URL: http://fabric:8082
      OPL_INTERNAL_SERVICE_TOKEN: ${OPL_INTERNAL_SERVICE_TOKEN:?Set OPL_INTERNAL_SERVICE_TOKEN}
      OPL_PUBLIC_URL: ${OPL_PUBLIC_URL:-http://localhost:8787}
      OPL_SUB2API_BASE_URL: ${OPL_SUB2API_BASE_URL:?Set OPL_SUB2API_BASE_URL}
      OPL_SUB2API_ADMIN_EMAIL: ${OPL_SUB2API_ADMIN_EMAIL:?Set OPL_SUB2API_ADMIN_EMAIL}
      OPL_SUB2API_ADMIN_PASSWORD: ${OPL_SUB2API_ADMIN_PASSWORD:?Set OPL_SUB2API_ADMIN_PASSWORD}
      OPL_SUB2API_REQUEST_TIMEOUT_MS: ${OPL_SUB2API_REQUEST_TIMEOUT_MS:-5000}
      OPL_AIONUI_ADMIN_PASSWORD_SEED: ${OPL_AIONUI_ADMIN_PASSWORD_SEED:?Set OPL_AIONUI_ADMIN_PASSWORD_SEED}
      OPL_MONTHLY_BILLING_WORKER_ENABLED: ${OPL_MONTHLY_BILLING_WORKER_ENABLED:-0}
      OPL_WORKSPACE_LAUNCH_WORKER_ENABLED: ${OPL_WORKSPACE_LAUNCH_WORKER_ENABLED:-0}
    ports:
      - "${OPL_BIND_ADDRESS:-127.0.0.1}:${OPL_HTTP_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
      ledger:
        condition: service_healthy
      fabric:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8787/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [opl-cloud]

volumes:
  opl-cloud-postgres:

networks:
  opl-cloud:
    ipam:
      config:
        - subnet: ${OPL_DOCKER_SUBNET:-172.30.0.0/24}

configs:
  opl-postgres-init:
    content: |
      #!/bin/sh
      set -eu

      for password in \
        "$$POSTGRES_PASSWORD" \
        "$$OPL_CONTROL_PLANE_DATABASE_PASSWORD" \
        "$$OPL_FABRIC_DATABASE_PASSWORD" \
        "$$OPL_LEDGER_DATABASE_PASSWORD"
      do
        if [ "$${#password}" -lt 32 ]; then
          echo "PostgreSQL passwords must contain at least 32 characters" >&2
          exit 1
        fi
      done
      if [ "$$POSTGRES_PASSWORD" = "$$OPL_CONTROL_PLANE_DATABASE_PASSWORD" ] || \
        [ "$$POSTGRES_PASSWORD" = "$$OPL_FABRIC_DATABASE_PASSWORD" ] || \
        [ "$$POSTGRES_PASSWORD" = "$$OPL_LEDGER_DATABASE_PASSWORD" ] || \
        [ "$$OPL_CONTROL_PLANE_DATABASE_PASSWORD" = "$$OPL_FABRIC_DATABASE_PASSWORD" ] || \
        [ "$$OPL_CONTROL_PLANE_DATABASE_PASSWORD" = "$$OPL_LEDGER_DATABASE_PASSWORD" ] || \
        [ "$$OPL_FABRIC_DATABASE_PASSWORD" = "$$OPL_LEDGER_DATABASE_PASSWORD" ]; then
        echo "PostgreSQL administrator and service passwords must be distinct" >&2
        exit 1
      fi

      psql --set=ON_ERROR_STOP=1 \
        --username "$$POSTGRES_USER" \
        --dbname "$$POSTGRES_DB" \
        --set=control_plane_password="$$OPL_CONTROL_PLANE_DATABASE_PASSWORD" \
        --set=fabric_password="$$OPL_FABRIC_DATABASE_PASSWORD" \
        --set=ledger_password="$$OPL_LEDGER_DATABASE_PASSWORD" <<'SQL'
      SELECT format('CREATE ROLE opl_control_plane LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION PASSWORD %L', :'control_plane_password')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'opl_control_plane') \gexec
      SELECT format('CREATE ROLE opl_fabric LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION PASSWORD %L', :'fabric_password')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'opl_fabric') \gexec
      SELECT format('CREATE ROLE opl_ledger LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION PASSWORD %L', :'ledger_password')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'opl_ledger') \gexec

      SELECT 'CREATE DATABASE opl_control_plane OWNER opl_control_plane'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'opl_control_plane') \gexec
      SELECT 'CREATE DATABASE opl_fabric OWNER opl_fabric'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'opl_fabric') \gexec
      SELECT 'CREATE DATABASE opl_ledger OWNER opl_ledger'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'opl_ledger') \gexec

      REVOKE CONNECT, TEMPORARY ON DATABASE postgres FROM PUBLIC;
      REVOKE CONNECT, TEMPORARY ON DATABASE opl_control_plane FROM PUBLIC;
      REVOKE CONNECT, TEMPORARY ON DATABASE opl_fabric FROM PUBLIC;
      REVOKE CONNECT, TEMPORARY ON DATABASE opl_ledger FROM PUBLIC;
      GRANT CONNECT, TEMPORARY ON DATABASE opl_control_plane TO opl_control_plane;
      GRANT CONNECT, TEMPORARY ON DATABASE opl_fabric TO opl_fabric;
      GRANT CONNECT, TEMPORARY ON DATABASE opl_ledger TO opl_ledger;
      SQL
