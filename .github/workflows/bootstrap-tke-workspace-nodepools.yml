name: Bootstrap TKE Workspace NodePools

on:
  workflow_dispatch:
    inputs:
      merged_sha:
        description: Exact full SHA currently at origin/main; mutation is rejected from every other ref or revision.
        required: true
        type: string
      mutate_missing_pools:
        description: Create only missing compliant pools after complete read-only inventory.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      migrate_package_taints:
        description: Migrate only the Basic and Pro legacy unallocated taint to the stable package taint after read-only inventory; no System pool or customer Node claim.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      mutation_confirmation:
        description: Enter CREATE_MISSING_WORKSPACE_NODEPOOLS to create only missing zero-replica pools after the read-only one-launch headroom gates pass.
        required: false
        default: ""
        type: string
      taint_migration_confirmation:
        description: Enter MIGRATE_BASIC_PRO_NODEPOOL_PACKAGE_TAINTS only for the separately approved Basic and Pro NodePool template migration.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-resource-verification
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Inventory and bootstrap dedicated Workspace NodePools
    if: ${{ github.ref == 'refs/heads/main' && github.sha == inputs.merged_sha }}
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    timeout-minutes: 20
    environment: production
    env:
      OPL_K8S_NAMESPACE: ${{ vars.OPL_K8S_NAMESPACE || 'opl-cloud' }}
      OPL_SYSTEM_COMPUTE_NODE_POOL_ID: ${{ vars.OPL_SYSTEM_COMPUTE_NODE_POOL_ID || 'np-6l4nkdto' }}
      OPL_SYSTEM_COMPUTE_MACHINE_ID: ${{ vars.OPL_SYSTEM_COMPUTE_MACHINE_ID || 'np-6l4nkdto-2cdtm' }}
      OPL_SYSTEM_COMPUTE_NODE_NAME: ${{ vars.OPL_SYSTEM_COMPUTE_NODE_NAME || '10.66.0.42' }}
      OPL_SYSTEM_COMPUTE_MACHINE_TYPE: ${{ vars.OPL_SYSTEM_COMPUTE_MACHINE_TYPE }}
      OPL_SYSTEM_COMPUTE_CVM_ID: ${{ vars.OPL_SYSTEM_COMPUTE_CVM_ID }}
      OPL_BASIC_COMPUTE_NODE_POOL_ID: ${{ vars.OPL_BASIC_COMPUTE_NODE_POOL_ID }}
      OPL_PRO_COMPUTE_NODE_POOL_ID: ${{ vars.OPL_PRO_COMPUTE_NODE_POOL_ID }}
      OPL_BASIC_COMPUTE_INSTANCE_TYPE: ${{ inputs.migrate_package_taints == 'true' && vars.OPL_BASIC_COMPUTE_INSTANCE_TYPE || '' }}
      OPL_PRO_COMPUTE_INSTANCE_TYPE: ${{ inputs.migrate_package_taints == 'true' && vars.OPL_PRO_COMPUTE_INSTANCE_TYPE || '' }}
      OPL_BASIC_COMPUTE_NODE_POOL_MAX_REPLICAS: "50"
      OPL_PRO_COMPUTE_NODE_POOL_MAX_REPLICAS: "50"
      OPL_TENCENT_ZONE: ${{ vars.OPL_TENCENT_ZONE || 'na-siliconvalley-1' }}
      TENCENT_DEPLOY_KUBECONFIG_PATH: ${{ vars.TENCENT_DEPLOY_KUBECONFIG_PATH || '/home/actions/.secrets/medopl/v22/kubeconfig-package-d-deploy' }}
      TENCENT_DEPLOY_KUBECONFIG_B64: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG_B64 }}
      TENCENT_DEPLOY_KUBECONFIG: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG }}
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENT_MUTATION_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENT_MUTATION_SECRET_KEY }}
      TENCENTCLOUD_REGION: ${{ vars.TENCENTCLOUD_REGION || vars.TENCENT_TCR_REGION || 'na-siliconvalley' }}
      TENCENT_DEPLOY_CLUSTER_ID: ${{ vars.TENCENT_DEPLOY_CLUSTER_ID }}
      TENCENT_CVM_SUBNET_ID: ${{ vars.TENCENT_CVM_SUBNET_ID }}
      TENCENT_CVM_SECURITY_GROUP_IDS: ${{ vars.TENCENT_CVM_SECURITY_GROUP_IDS }}
      TENCENT_CVM_SYSTEM_DISK_TYPE: ${{ vars.TENCENT_CVM_SYSTEM_DISK_TYPE || 'CLOUD_BSSD' }}
      TENCENT_CVM_SYSTEM_DISK_SIZE_GB: ${{ vars.TENCENT_CVM_SYSTEM_DISK_SIZE_GB || '50' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: disable
      RUN_TENCENT_CREATE_RELEASE_EXECUTION: ${{ ((inputs.mutate_missing_pools == 'true' && inputs.mutation_confirmation == 'CREATE_MISSING_WORKSPACE_NODEPOOLS') || (inputs.migrate_package_taints == 'true' && inputs.taint_migration_confirmation == 'MIGRATE_BASIC_PRO_NODEPOOL_PACKAGE_TAINTS')) && '1' || '0' }}
      RUN_TENCENT_NODE_POOL_BOOTSTRAP: ${{ inputs.mutate_missing_pools == 'true' && inputs.mutation_confirmation == 'CREATE_MISSING_WORKSPACE_NODEPOOLS' && '1' || '0' }}
      RUN_TENCENT_NODE_POOL_BOOTSTRAP_CONFIRMATION: ${{ inputs.mutation_confirmation }}
      RUN_TENCENT_NODE_POOL_TAINT_MIGRATION: ${{ inputs.migrate_package_taints == 'true' && inputs.taint_migration_confirmation == 'MIGRATE_BASIC_PRO_NODEPOOL_PACKAGE_TAINTS' && '1' || '0' }}
      RUN_TENCENT_NODE_POOL_TAINT_MIGRATION_CONFIRMATION: ${{ inputs.taint_migration_confirmation }}

    steps:
      - name: Prepare isolated source checkout
        id: prepare_source
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ "$OPL_SOURCE_CHECKOUT" != "$expected" ]; then
            echo "Isolated source checkout path mismatch." >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.opl-checkouts"
          mkdir "$OPL_SOURCE_CHECKOUT"

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          ref: ${{ inputs.merged_sha }}
          fetch-depth: 0

      - name: Verify remote branch authority
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        env:
          OPL_MERGED_SHA: ${{ inputs.merged_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$OPL_MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full merged main SHA is required." >&2
            exit 1
          fi
          mapfile -t remote_heads < <(git ls-remote --heads origin)
          if [ "${#remote_heads[@]}" -ne 1 ]; then
            printf 'Production source authority requires exactly one remote head; observed: %s\n' "${remote_heads[*]:-none}" >&2
            exit 1
          fi
          read -r remote_main_sha remote_main_ref <<< "${remote_heads[0]}"
          head_sha="$(git rev-parse HEAD)"
          if [ "$remote_main_ref" != "refs/heads/main" ] || [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_SHA" != "$head_sha" ] || [ "$head_sha" != "$OPL_MERGED_SHA" ] || [ "$remote_main_sha" != "$head_sha" ]; then
            echo "Bootstrap source is not the exact current origin/main revision." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: .opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/services/fabric/go.sum

      - name: Require one NodePool operation mode
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        env:
          MUTATE_MISSING_POOLS: ${{ inputs.mutate_missing_pools }}
          MIGRATE_PACKAGE_TAINTS: ${{ inputs.migrate_package_taints }}
        run: |
          set -euo pipefail
          if [ "$MUTATE_MISSING_POOLS" = "true" ] && [ "$MIGRATE_PACKAGE_TAINTS" = "true" ]; then
            echo "NodePool creation and taint migration are separate mutation modes." >&2
            exit 1
          fi

      - name: Prepare bootstrap workspace
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          artifact_dir="$RUNNER_TEMP/bootstrap-nodepool-report"
          mkdir -p "$artifact_dir"
          chmod 700 "$secret_dir" "$artifact_dir"
          printf '%s\n' '{"schemaVersion":1,"status":"not_started","mutationCount":0,"runnerDirectMutationCounts":{"sub2api":0,"tencent":0,"kubernetes":0,"cvm":0,"cbs":0,"scale":0,"nodePatch":0,"launch":0,"storage":0,"billing":0,"key":0}}' > "$artifact_dir/taint-migration-summary.json"
          kubeconfig="$secret_dir/kubeconfig"
          echo "OPL_BOOTSTRAP_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
          echo "OPL_BOOTSTRAP_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          if [ -f "$TENCENT_DEPLOY_KUBECONFIG_PATH" ]; then
            cp "$TENCENT_DEPLOY_KUBECONFIG_PATH" "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG_B64:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG" > "$kubeconfig"
          else
            echo "No deploy kubeconfig was provided." >&2
            exit 1
          fi
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Build current provisioner
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          cd services/fabric
          go build -o "$OPL_BOOTSTRAP_SECRET_DIR/opl-tencent-provisioner" ./cmd/opl-tencent-provisioner

      - name: Inventory and select Workspace SKUs
        if: ${{ inputs.migrate_package_taints != 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          request="$OPL_BOOTSTRAP_SECRET_DIR/sku-inventory-request.json"
          REQUEST_PATH="$request" node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.env.REQUEST_PATH, JSON.stringify({
            action: "workspace_sku_inventory",
            zone: process.env.OPL_TENCENT_ZONE,
            requiredCapacity: 1
          }));
          NODE
          set +e
          "$OPL_BOOTSTRAP_SECRET_DIR/opl-tencent-provisioner" < "$request" > "$OPL_BOOTSTRAP_ARTIFACT_DIR/sku-inventory.json"
          inventory_status=$?
          set -e
          REPORT_PATH="$OPL_BOOTSTRAP_ARTIFACT_DIR/sku-inventory.json" INVENTORY_STATUS="$inventory_status" node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
          if (process.env.INVENTORY_STATUS !== "0" || report.ok !== true || report.status !== "ready" || report.mutationCount !== 0 || report.requiredCapacity !== 1) {
            throw new Error(`workspace_sku_inventory_failed:${report.errorCode || "unknown"}`);
          }
          if (report.prepaidQuotaRemaining < 1 || report.tkeAvailableNodeCapacity < 1 || report.tkeClusterNodeLimit < report.tkeCurrentNodeCount + 1) {
            throw new Error("workspace_sku_inventory_capacity_insufficient");
          }
          if (!Array.isArray(report.subnets) || report.subnets.length < 1 || report.subnets.reduce((sum, subnet) => sum + Number(subnet.availableIpAddresses || 0), 0) < 1) {
            throw new Error("workspace_sku_inventory_subnet_capacity_insufficient");
          }
          const system = report.protectedSystem || {};
          if (system.nodePoolId !== process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID || system.machineId !== process.env.OPL_SYSTEM_COMPUTE_MACHINE_ID ||
              system.nodeName !== process.env.OPL_SYSTEM_COMPUTE_NODE_NAME || system.poolCheckStatus !== "passed" || system.machineCheckStatus !== "passed" ||
              system.nodeCheckStatus !== "passed" || !["NativeCVM", "Native", "CXM"].includes(system.machineType) ||
              (process.env.OPL_SYSTEM_COMPUTE_MACHINE_TYPE && process.env.OPL_SYSTEM_COMPUTE_MACHINE_TYPE !== system.machineType)) {
            throw new Error("workspace_sku_inventory_system_identity_mismatch");
          }
          if (system.machineType === "NativeCVM") {
            if (system.cvmApplicable !== true || system.cvmCheckStatus !== "passed" || !/^ins-[A-Za-z0-9]+$/.test(system.cvmId || "")) {
              throw new Error("workspace_sku_inventory_system_cvm_identity_mismatch");
            }
          } else if (system.cvmApplicable !== false || system.cvmCheckStatus !== "not_applicable" || system.cvmId) {
            throw new Error("workspace_sku_inventory_system_cvm_applicability_mismatch");
          }
          const selected = {};
          for (const [packageId, cpu, memoryGb] of [["basic", 2, 4], ["pro", 8, 16]]) {
            const packages = (report.skuPackages || []).filter((item) => item.packageId === packageId);
            if (packages.length !== 1) throw new Error(`workspace_sku_inventory_${packageId}_missing`);
            const current = packages[0];
            if (current.cpu !== cpu || current.memoryGb !== memoryGb || !current.recommendedInstanceType || !Array.isArray(current.candidates) || current.candidates.length < 1 ||
                current.candidates[0].instanceType !== current.recommendedInstanceType || current.candidates[0].monthlyPriceCny !== current.recommendedMonthlyPriceCny) {
              throw new Error(`workspace_sku_inventory_${packageId}_invalid`);
            }
            selected[packageId] = current.recommendedInstanceType;
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `OPL_SYSTEM_COMPUTE_MACHINE_TYPE=${system.machineType}\nOPL_SYSTEM_COMPUTE_CVM_ID=${system.cvmApplicable ? system.cvmId : ""}\nOPL_BASIC_COMPUTE_INSTANCE_TYPE=${selected.basic}\nOPL_PRO_COMPUTE_INSTANCE_TYPE=${selected.pro}\n`, { mode: 0o600 });
          const encoded = JSON.stringify(report).toLowerCase();
          for (const forbidden of ["secret", "token", "requestid", "request id", "providerrequestid", "rawresponse"]) {
            if (encoded.includes(forbidden)) throw new Error(`workspace_sku_inventory_leaked_${forbidden}`);
          }
          NODE

      - name: Revalidate selected Workspace SKUs before mutation
        if: ${{ inputs.migrate_package_taints != 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          request="$OPL_BOOTSTRAP_SECRET_DIR/pre-mutation-sku-inventory-request.json"
          REQUEST_PATH="$request" node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.env.REQUEST_PATH, JSON.stringify({
            action: "workspace_sku_inventory",
            zone: process.env.OPL_TENCENT_ZONE,
            requiredCapacity: 1
          }));
          NODE
          set +e
          "$OPL_BOOTSTRAP_SECRET_DIR/opl-tencent-provisioner" < "$request" > "$OPL_BOOTSTRAP_ARTIFACT_DIR/pre-mutation-sku-inventory.json"
          inventory_status=$?
          set -e
          REPORT_PATH="$OPL_BOOTSTRAP_ARTIFACT_DIR/pre-mutation-sku-inventory.json" INVENTORY_STATUS="$inventory_status" node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
          if (process.env.INVENTORY_STATUS !== "0" || report.ok !== true || report.mutationCount !== 0 || report.requiredCapacity !== 1) {
            throw new Error(`workspace_sku_revalidation_failed:${report.errorCode || "unknown"}`);
          }
          const system = report.protectedSystem || {};
          if (system.nodePoolId !== process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID || system.machineId !== process.env.OPL_SYSTEM_COMPUTE_MACHINE_ID ||
              system.nodeName !== process.env.OPL_SYSTEM_COMPUTE_NODE_NAME || system.machineType !== process.env.OPL_SYSTEM_COMPUTE_MACHINE_TYPE ||
              system.poolCheckStatus !== "passed" || system.machineCheckStatus !== "passed" || system.nodeCheckStatus !== "passed" ||
              (system.machineType === "NativeCVM" && (system.cvmApplicable !== true || system.cvmCheckStatus !== "passed" || system.cvmId !== process.env.OPL_SYSTEM_COMPUTE_CVM_ID)) ||
              (system.machineType !== "NativeCVM" && (system.cvmApplicable !== false || system.cvmCheckStatus !== "not_applicable" || system.cvmId))) {
            throw new Error("workspace_sku_revalidation_system_identity_failed");
          }
          for (const [packageId, selected] of [["basic", process.env.OPL_BASIC_COMPUTE_INSTANCE_TYPE], ["pro", process.env.OPL_PRO_COMPUTE_INSTANCE_TYPE]]) {
            const current = (report.skuPackages || []).find((item) => item.packageId === packageId);
            if (!current || !(current.candidates || []).some((candidate) => candidate.instanceType === selected)) {
              throw new Error(`workspace_sku_revalidation_${packageId}_failed`);
            }
          }
          NODE

      - name: Inventory and bootstrap package NodePools
        id: bootstrap_action
        if: ${{ inputs.migrate_package_taints != 'true' }}
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        env:
          MUTATE_MISSING_POOLS: ${{ inputs.mutate_missing_pools }}
        run: |
          set -euo pipefail
          request="$OPL_BOOTSTRAP_SECRET_DIR/request.json"
          MUTATE_MISSING_POOLS="$MUTATE_MISSING_POOLS" REQUEST_PATH="$request" node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.env.REQUEST_PATH, JSON.stringify({
            action: "bootstrap_compute_node_pools",
            dryRun: process.env.MUTATE_MISSING_POOLS !== "true",
            zone: process.env.OPL_TENCENT_ZONE,
            requiredCapacity: 1
          }));
          NODE
          "$OPL_BOOTSTRAP_SECRET_DIR/opl-tencent-provisioner" < "$request" > "$OPL_BOOTSTRAP_ARTIFACT_DIR/bootstrap-nodepool-report.json"

      - name: Capture package taint migration baseline
        if: ${{ inputs.migrate_package_taints == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          request="$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-baseline-request.json"
          REQUEST_PATH="$request" node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.env.REQUEST_PATH, JSON.stringify({
            action: "migrate_workspace_node_pool_taints",
            dryRun: true,
            zone: process.env.OPL_TENCENT_ZONE,
            requiredCapacity: 1
          }));
          NODE
          before_report="$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-before.json"
          targets="$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-targets.json"
          "$OPL_BOOTSTRAP_SECRET_DIR/opl-tencent-provisioner" < "$request" > "$before_report"
          REPORT_PATH="$before_report" TARGETS_PATH="$targets" node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
          const expectedPoolIds = {
            basic: (process.env.OPL_BASIC_COMPUTE_NODE_POOL_ID || "").trim(),
            pro: (process.env.OPL_PRO_COMPUTE_NODE_POOL_ID || "").trim()
          };
          const systemNodeName = (process.env.OPL_SYSTEM_COMPUTE_NODE_NAME || "").trim();
          if (report.ok !== true || report.mutationCount !== 0 || !Array.isArray(report.nodePools) || report.nodePools.length !== 2 ||
              (report.protectedSystem || {}).nodePoolId !== process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID ||
              (report.protectedSystem || {}).poolCheckStatus !== "passed" || (report.protectedSystem || {}).machineCheckStatus !== "passed" ||
              (report.protectedSystem || {}).nodeCheckStatus !== "passed") {
            throw new Error("taint_migration_baseline_authority_invalid");
          }
          const nodes = [];
          const seen = new Set();
          for (const pool of report.nodePools) {
            const affectedNodeNames = pool.affectedNodeNames ?? [];
            if (!Object.hasOwn(expectedPoolIds, pool.packageId) || pool.nodePoolId !== expectedPoolIds[pool.packageId] ||
                pool.nodePoolId === process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID || !Array.isArray(affectedNodeNames) ||
                affectedNodeNames.length !== pool.estimatedNodeCount) {
              throw new Error("taint_migration_baseline_pool_invalid");
            }
            for (const [index, nodeName] of affectedNodeNames.entries()) {
              if (typeof nodeName !== "string" || !nodeName || nodeName === systemNodeName || seen.has(nodeName)) {
                throw new Error("taint_migration_baseline_node_invalid");
              }
              seen.add(nodeName);
              nodes.push({ nodePoolId: pool.nodePoolId, packageId: pool.packageId, index, nodeName });
            }
          }
          fs.writeFileSync(process.env.TARGETS_PATH, JSON.stringify({ nodes }), { mode: 0o600 });
          NODE
          TARGETS_PATH="$targets" node <<'NODE' > "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-targets.tsv"
          const fs = require("node:fs");
          const targets = JSON.parse(fs.readFileSync(process.env.TARGETS_PATH, "utf8"));
          for (const target of targets.nodes) process.stdout.write(`${target.packageId}\t${target.index}\t${target.nodeName}\n`);
          NODE
          while IFS=$'\t' read -r package_id node_index node_name; do
            kubectl --kubeconfig "$KUBECONFIG" get node "$node_name" -o json > "$OPL_BOOTSTRAP_SECRET_DIR/baseline-$package_id-$node_index.json" 2> "$OPL_BOOTSTRAP_SECRET_DIR/baseline-$package_id-$node_index.stderr"
          done < "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-targets.tsv"
          TARGETS_PATH="$targets" SECRET_DIR="$OPL_BOOTSTRAP_SECRET_DIR" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const targets = JSON.parse(fs.readFileSync(process.env.TARGETS_PATH, "utf8"));
          const ownerKeys = ["medopl.cn/workload", "oplcloud.cn/resource-id", "oplcloud.cn/account-id", "oplcloud.cn/workspace-id"];
          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical).sort((left, right) => JSON.stringify(left).localeCompare(JSON.stringify(right)));
            if (value && typeof value === "object") return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
            return value;
          };
          const exactTargetTaint = (taints, packageId) => Array.isArray(taints) && taints.length === 1 &&
            taints[0]?.key === "oplcloud.cn/package-id" && taints[0]?.value === packageId && taints[0]?.effect === "NoSchedule";
          if (report.nodePools.some((pool) => !exactTargetTaint(pool.taintsAfter, pool.packageId))) {
            throw new Error("taint_migration_baseline_target_taint_invalid");
          }
          const snapshots = targets.nodes.map((target) => {
            const node = JSON.parse(fs.readFileSync(path.join(process.env.SECRET_DIR, `baseline-${target.packageId}-${target.index}.json`), "utf8"));
            if (node?.metadata?.name !== target.nodeName || typeof node?.metadata?.uid !== "string" || !node.metadata.uid ||
                typeof node?.metadata?.resourceVersion !== "string" || !node.metadata.resourceVersion || !Array.isArray(node?.spec?.taints || [])) {
              throw new Error("taint_migration_baseline_node_get_invalid");
            }
            const internalIPs = (node.status?.addresses || []).filter((address) => address?.type === "InternalIP").map((address) => address.address);
            if (internalIPs.length !== 1 || typeof internalIPs[0] !== "string" || !internalIPs[0]) {
              throw new Error("taint_migration_baseline_node_ip_invalid");
            }
            const labels = node.metadata.labels || {};
            return {
              nodePoolId: target.nodePoolId,
              packageId: target.packageId,
              index: target.index,
              nodeName: target.nodeName,
              internalIp: internalIPs[0],
              uid: node.metadata.uid,
              resourceVersion: node.metadata.resourceVersion,
              workspaceLabels: Object.fromEntries(ownerKeys.map((key) => [key, Object.hasOwn(labels, key) ? labels[key] : null])),
              taints: canonical(node.spec.taints || [])
            };
          });
          fs.writeFileSync(path.join(process.env.SECRET_DIR, "taint-migration-baseline-nodes.json"), JSON.stringify(snapshots), { mode: 0o600 });
          const pools = report.nodePools.map((pool) => ({
            nodePoolId: pool.nodePoolId,
            packageId: pool.packageId,
            taints: canonical(pool.taintsBefore || []),
            targetTaints: canonical(pool.taintsAfter || []),
            nodes: snapshots.filter((node) => node.nodePoolId === pool.nodePoolId).map(({ resourceVersion, index, ...identity }) => identity)
          })).sort((left, right) => left.packageId.localeCompare(right.packageId));
          const mutationBindingDigest = crypto.createHash("sha256").update(JSON.stringify(canonical(pools))).digest("hex");
          fs.appendFileSync(process.env.GITHUB_ENV, `OPL_TAINT_MIGRATION_MUTATION_BINDING_DIGEST=${mutationBindingDigest}\n`, { mode: 0o600 });
          NODE

      - name: Inventory and migrate package NodePool taints
        id: taint_migration_action
        if: ${{ inputs.migrate_package_taints == 'true' }}
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        env:
          RUN_TAINT_MIGRATION: ${{ env.RUN_TENCENT_NODE_POOL_TAINT_MIGRATION }}
        run: |
          set -euo pipefail
          preflight_request="$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-pre-mutation-request.json"
          REQUEST_PATH="$preflight_request" node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.env.REQUEST_PATH, JSON.stringify({
            action: "migrate_workspace_node_pool_taints",
            dryRun: true,
            zone: process.env.OPL_TENCENT_ZONE,
            requiredCapacity: 1
          }));
          NODE
          "$OPL_BOOTSTRAP_SECRET_DIR/opl-tencent-provisioner" < "$preflight_request" > "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-pre-mutation-pools.json"
          while IFS=$'\t' read -r package_id node_index node_name; do
            kubectl --kubeconfig "$KUBECONFIG" get node "$node_name" -o json > "$OPL_BOOTSTRAP_SECRET_DIR/pre-mutation-$package_id-$node_index.json" 2> "$OPL_BOOTSTRAP_SECRET_DIR/pre-mutation-$package_id-$node_index.stderr"
          done < "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-targets.tsv"
          SECRET_DIR="$OPL_BOOTSTRAP_SECRET_DIR" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const targets = JSON.parse(fs.readFileSync(path.join(process.env.SECRET_DIR, "taint-migration-targets.json"), "utf8"));
          const report = JSON.parse(fs.readFileSync(path.join(process.env.SECRET_DIR, "taint-migration-pre-mutation-pools.json"), "utf8"));
          const ownerKeys = ["medopl.cn/workload", "oplcloud.cn/resource-id", "oplcloud.cn/account-id", "oplcloud.cn/workspace-id"];
          const expectedPoolIds = {
            basic: (process.env.OPL_BASIC_COMPUTE_NODE_POOL_ID || "").trim(),
            pro: (process.env.OPL_PRO_COMPUTE_NODE_POOL_ID || "").trim()
          };
          const systemNodeName = (process.env.OPL_SYSTEM_COMPUTE_NODE_NAME || "").trim();
          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical).sort((left, right) => JSON.stringify(left).localeCompare(JSON.stringify(right)));
            if (value && typeof value === "object") return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
            return value;
          };
          const exactTargetTaint = (taints, packageId) => Array.isArray(taints) && taints.length === 1 &&
            taints[0]?.key === "oplcloud.cn/package-id" && taints[0]?.value === packageId && taints[0]?.effect === "NoSchedule";
          if (report.ok !== true || report.mutationCount !== 0 || !Array.isArray(report.nodePools) || report.nodePools.length !== 2 ||
              (report.protectedSystem || {}).nodePoolId !== process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID ||
              (report.protectedSystem || {}).poolCheckStatus !== "passed" || (report.protectedSystem || {}).machineCheckStatus !== "passed" ||
              (report.protectedSystem || {}).nodeCheckStatus !== "passed") {
            throw new Error("taint_migration_pre_mutation_binding_drift");
          }
          const seenPackages = new Set();
          const seenNodes = new Set();
          for (const pool of report.nodePools) {
            const affectedNodeNames = pool.affectedNodeNames ?? [];
            const baselineNodeNames = targets.nodes
              .filter((target) => target.packageId === pool.packageId && target.nodePoolId === pool.nodePoolId)
              .map((target) => target.nodeName);
            const sortedAffectedNodeNames = [...affectedNodeNames].sort();
            const sortedBaselineNodeNames = [...baselineNodeNames].sort();
            if (!Object.hasOwn(expectedPoolIds, pool.packageId) || seenPackages.has(pool.packageId) ||
                pool.nodePoolId !== expectedPoolIds[pool.packageId] || pool.nodePoolId === process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID ||
                !Array.isArray(pool.taintsBefore) || !Number.isInteger(pool.estimatedNodeCount) || pool.estimatedNodeCount < 0 ||
                !exactTargetTaint(pool.taintsAfter, pool.packageId) ||
                !Array.isArray(affectedNodeNames) || affectedNodeNames.length !== pool.estimatedNodeCount ||
                JSON.stringify(affectedNodeNames) !== JSON.stringify(sortedAffectedNodeNames) ||
                JSON.stringify(baselineNodeNames) !== JSON.stringify(sortedBaselineNodeNames) ||
                JSON.stringify(affectedNodeNames) !== JSON.stringify(baselineNodeNames)) {
              throw new Error("taint_migration_pre_mutation_node_inventory_drift");
            }
            seenPackages.add(pool.packageId);
            for (const nodeName of affectedNodeNames) {
              if (typeof nodeName !== "string" || !nodeName || nodeName === systemNodeName || seenNodes.has(nodeName)) {
                throw new Error("taint_migration_pre_mutation_node_inventory_drift");
              }
              seenNodes.add(nodeName);
            }
          }
          if (seenPackages.size !== 2 || targets.nodes.length !== seenNodes.size ||
              targets.nodes.some((target) => !seenNodes.has(target.nodeName) || target.nodeName === systemNodeName)) {
            throw new Error("taint_migration_pre_mutation_node_inventory_drift");
          }
          const snapshots = targets.nodes.map((target) => {
            const node = JSON.parse(fs.readFileSync(path.join(process.env.SECRET_DIR, `pre-mutation-${target.packageId}-${target.index}.json`), "utf8"));
            const internalIPs = (node.status?.addresses || []).filter((address) => address?.type === "InternalIP").map((address) => address.address);
            if (node?.metadata?.name !== target.nodeName || typeof node?.metadata?.uid !== "string" || !node.metadata.uid ||
                typeof node?.metadata?.resourceVersion !== "string" || !node.metadata.resourceVersion || internalIPs.length !== 1 ||
                typeof internalIPs[0] !== "string" || !internalIPs[0] || !Array.isArray(node?.spec?.taints || [])) {
              throw new Error("taint_migration_pre_mutation_binding_drift");
            }
            const labels = node.metadata.labels || {};
            return {
              nodePoolId: target.nodePoolId,
              packageId: target.packageId,
              nodeName: target.nodeName,
              internalIp: internalIPs[0],
              uid: node.metadata.uid,
              workspaceLabels: Object.fromEntries(ownerKeys.map((key) => [key, Object.hasOwn(labels, key) ? labels[key] : null])),
              taints: canonical(node.spec.taints || [])
            };
          });
          const pools = report.nodePools.map((pool) => ({
            nodePoolId: pool.nodePoolId,
            packageId: pool.packageId,
            taints: canonical(pool.taintsBefore || []),
            targetTaints: canonical(pool.taintsAfter || []),
            nodes: snapshots.filter((node) => node.nodePoolId === pool.nodePoolId)
          })).sort((left, right) => left.packageId.localeCompare(right.packageId));
          const digest = crypto.createHash("sha256").update(JSON.stringify(canonical(pools))).digest("hex");
          if (digest !== process.env.OPL_TAINT_MIGRATION_MUTATION_BINDING_DIGEST) {
            throw new Error("taint_migration_pre_mutation_binding_drift");
          }
          NODE
          request="$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-request.json"
          RUN_TAINT_MIGRATION="$RUN_TAINT_MIGRATION" REQUEST_PATH="$request" node <<'NODE'
          const fs = require("node:fs");
          if (process.env.RUN_TAINT_MIGRATION === "1") {
            const summaryPath = `${process.env.OPL_BOOTSTRAP_ARTIFACT_DIR}/taint-migration-summary.json`;
            const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
            fs.writeFileSync(summaryPath, `${JSON.stringify({
              ...summary,
              status: "unknown",
              mutationCount: null,
              reasonCode: "taint_migration_action_receipt_unavailable"
            })}\n`, { mode: 0o600 });
          }
          fs.writeFileSync(process.env.REQUEST_PATH, JSON.stringify({
            action: "migrate_workspace_node_pool_taints",
            dryRun: process.env.RUN_TAINT_MIGRATION !== "1",
            zone: process.env.OPL_TENCENT_ZONE,
            requiredCapacity: 1
          }));
          NODE
          "$OPL_BOOTSTRAP_SECRET_DIR/opl-tencent-provisioner" < "$request" > "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-action.json"

      - name: Read back affected Nodes immediately
        id: taint_migration_immediate_readback
        if: always() && inputs.migrate_package_taints == 'true' && env.RUN_TENCENT_NODE_POOL_TAINT_MIGRATION == '1'
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r package_id node_index node_name; do
            kubectl --kubeconfig "$KUBECONFIG" get node "$node_name" -o json > "$OPL_BOOTSTRAP_SECRET_DIR/immediate-$package_id-$node_index.json" 2> "$OPL_BOOTSTRAP_SECRET_DIR/immediate-$package_id-$node_index.stderr"
          done < "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-targets.tsv"

      - name: Poll NodePools and affected Nodes until stable
        id: taint_migration_stable_readback
        if: always() && inputs.migrate_package_taints == 'true' && env.RUN_TENCENT_NODE_POOL_TAINT_MIGRATION == '1'
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          previous_signature=""
          consecutive=0
          for attempt in $(seq 1 12); do
            request="$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-poll-request.json"
            REQUEST_PATH="$request" node <<'NODE'
            const fs = require("node:fs");
            fs.writeFileSync(process.env.REQUEST_PATH, JSON.stringify({
              action: "migrate_workspace_node_pool_taints",
              dryRun: true,
              zone: process.env.OPL_TENCENT_ZONE,
              requiredCapacity: 1
            }));
            NODE
            "$OPL_BOOTSTRAP_SECRET_DIR/opl-tencent-provisioner" < "$request" > "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-poll-current.json"
            while IFS=$'\t' read -r package_id node_index node_name; do
              kubectl --kubeconfig "$KUBECONFIG" get node "$node_name" -o json > "$OPL_BOOTSTRAP_SECRET_DIR/poll-current-$package_id-$node_index.json" 2> "$OPL_BOOTSTRAP_SECRET_DIR/poll-current-$package_id-$node_index.stderr"
            done < "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-targets.tsv"
            signature="$(SECRET_DIR="$OPL_BOOTSTRAP_SECRET_DIR" node <<'NODE'
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const path = require("node:path");
            const report = JSON.parse(fs.readFileSync(path.join(process.env.SECRET_DIR, "taint-migration-poll-current.json"), "utf8"));
            const targets = JSON.parse(fs.readFileSync(path.join(process.env.SECRET_DIR, "taint-migration-targets.json"), "utf8"));
            const ownerKeys = ["medopl.cn/workload", "oplcloud.cn/resource-id", "oplcloud.cn/account-id", "oplcloud.cn/workspace-id"];
            const canonical = (value) => {
              if (Array.isArray(value)) return value.map(canonical).sort((left, right) => JSON.stringify(left).localeCompare(JSON.stringify(right)));
              if (value && typeof value === "object") return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
              return value;
            };
            const exactPackageTaint = (taints, packageId) => Array.isArray(taints) && taints.length === 1 &&
              taints[0]?.key === "oplcloud.cn/package-id" && taints[0]?.value === packageId && taints[0]?.effect === "NoSchedule";
            if (report.ok !== true || report.status !== "registered" || report.mutationCount !== 0 || !Array.isArray(report.nodePools) ||
                report.nodePools.length !== 2 || report.nodePools.some((pool) => pool.nodePoolId === process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID ||
                  !["basic", "pro"].includes(pool.packageId) || !exactPackageTaint(pool.taintsBefore, pool.packageId) ||
                  !exactPackageTaint(pool.taintsAfter, pool.packageId))) process.exit(0);
            const nodes = [];
            for (const target of targets.nodes) {
              const node = JSON.parse(fs.readFileSync(path.join(process.env.SECRET_DIR, `poll-current-${target.packageId}-${target.index}.json`), "utf8"));
              if (node?.metadata?.name !== target.nodeName || typeof node?.metadata?.uid !== "string" || !node.metadata.uid ||
                  typeof node?.metadata?.resourceVersion !== "string" || !node.metadata.resourceVersion ||
                  !exactPackageTaint(node?.spec?.taints || [], target.packageId)) process.exit(0);
              const labels = node.metadata.labels || {};
              nodes.push({
                nodePoolId: target.nodePoolId,
                packageId: target.packageId,
                nodeName: target.nodeName,
                uid: node.metadata.uid,
                workspaceLabels: Object.fromEntries(ownerKeys.map((key) => [key, Object.hasOwn(labels, key) ? labels[key] : null])),
                taints: canonical(node.spec.taints)
              });
            }
            const stableIdentity = {
              pools: report.nodePools.map((pool) => ({ nodePoolId: pool.nodePoolId, packageId: pool.packageId, taints: canonical(pool.taintsBefore) })),
              nodes
            };
            process.stdout.write(crypto.createHash("sha256").update(JSON.stringify(canonical(stableIdentity))).digest("hex"));
            NODE
            )"
            if [ -n "$signature" ] && [ "$signature" = "$previous_signature" ]; then
              consecutive=$((consecutive + 1))
            elif [ -n "$signature" ]; then
              consecutive=1
            else
              consecutive=0
            fi
            if [ "$consecutive" -ge 2 ]; then
              cp "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-poll-previous.json" "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-stable-first.json"
              cp "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-poll-current.json" "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-stable-second.json"
              while IFS=$'\t' read -r package_id node_index node_name; do
                cp "$OPL_BOOTSTRAP_SECRET_DIR/poll-previous-$package_id-$node_index.json" "$OPL_BOOTSTRAP_SECRET_DIR/stable-first-$package_id-$node_index.json"
                cp "$OPL_BOOTSTRAP_SECRET_DIR/poll-current-$package_id-$node_index.json" "$OPL_BOOTSTRAP_SECRET_DIR/stable-second-$package_id-$node_index.json"
              done < "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-targets.tsv"
              exit 0
            fi
            if [ -n "$signature" ]; then
              cp "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-poll-current.json" "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-poll-previous.json"
              while IFS=$'\t' read -r package_id node_index node_name; do
                cp "$OPL_BOOTSTRAP_SECRET_DIR/poll-current-$package_id-$node_index.json" "$OPL_BOOTSTRAP_SECRET_DIR/poll-previous-$package_id-$node_index.json"
              done < "$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-targets.tsv"
              previous_signature="$signature"
            else
              previous_signature=""
              consecutive=0
            fi
            sleep 10
          done
          echo "taint_migration_stability_poll_exhausted" >&2
          exit 1

      - name: Validate stable package taint migration
        if: always() && inputs.migrate_package_taints == 'true' && env.RUN_TENCENT_NODE_POOL_TAINT_MIGRATION == '1'
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        env:
          TAINT_MIGRATION_ACTION_OUTCOME: ${{ steps.taint_migration_action.outcome }}
          IMMEDIATE_READBACK_OUTCOME: ${{ steps.taint_migration_immediate_readback.outcome }}
          STABLE_READBACK_OUTCOME: ${{ steps.taint_migration_stable_readback.outcome }}
        run: |
          set -euo pipefail
          SECRET_DIR="$OPL_BOOTSTRAP_SECRET_DIR" ARTIFACT_DIR="$OPL_BOOTSTRAP_ARTIFACT_DIR" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const summaryPath = path.join(process.env.ARTIFACT_DIR, "taint-migration-summary.json");
          const baseSummary = {
            schemaVersion: 1,
            status: "unknown",
            mutationCount: null,
            runnerDirectMutationCounts: {
              sub2api: 0, tencent: 0, kubernetes: 0, cvm: 0, cbs: 0, scale: 0,
              nodePatch: 0, launch: 0, storage: 0, billing: 0, key: 0
            },
            nodePoolMutation: {
              provider: "tencent",
              action: "ModifyNodePool",
              updateExistedNode: true,
              mutationCount: null,
              affectedNodeCount: null
            },
            indirectNodeTaintEffect: {
              controller: "tke_native_node_pool",
              field: "node.spec.taints",
              directKubernetesMutation: false
            }
          };
          const writeSummary = (summary) => fs.writeFileSync(summaryPath, `${JSON.stringify(summary)}\n`, { mode: 0o600 });
          const fail = (reasonCode) => {
            writeSummary({ ...baseSummary, reasonCode });
            throw new Error(reasonCode);
          };
          const readJSON = (name) => JSON.parse(fs.readFileSync(path.join(process.env.SECRET_DIR, name), "utf8"));
          try {
            if (fs.existsSync(path.join(process.env.SECRET_DIR, "taint-migration-action.json"))) {
              const actionEvidence = readJSON("taint-migration-action.json");
              if (Number.isInteger(actionEvidence.mutationCount) && actionEvidence.mutationCount >= 0 && actionEvidence.mutationCount <= 2) {
                baseSummary.mutationCount = actionEvidence.mutationCount;
                baseSummary.nodePoolMutation.mutationCount = actionEvidence.mutationCount;
              }
            }
            if (process.env.TAINT_MIGRATION_ACTION_OUTCOME !== "success" || process.env.IMMEDIATE_READBACK_OUTCOME !== "success" ||
                process.env.STABLE_READBACK_OUTCOME !== "success") {
              fail("taint_migration_readback_step_failed");
            }
            const before = readJSON("taint-migration-before.json");
            const action = readJSON("taint-migration-action.json");
            const stableFirst = readJSON("taint-migration-stable-first.json");
            const stableSecond = readJSON("taint-migration-stable-second.json");
            const baselineNodes = readJSON("taint-migration-baseline-nodes.json");
            const targets = readJSON("taint-migration-targets.json");
            const expectedPoolIds = {
              basic: (process.env.OPL_BASIC_COMPUTE_NODE_POOL_ID || "").trim(),
              pro: (process.env.OPL_PRO_COMPUTE_NODE_POOL_ID || "").trim()
            };
            const exactTaint = (taints, key, value) => Array.isArray(taints) && taints.length === 1 &&
              taints[0]?.key === key && taints[0]?.value === value && taints[0]?.effect === "NoSchedule";
            const affectedNodeNames = (pool) => pool?.affectedNodeNames ?? [];
            const poolsByPackage = (report) => new Map((report.nodePools || []).map((pool) => [pool.packageId, pool]));
            if (before.ok !== true || before.mutationCount !== 0 || action.ok !== true || stableFirst.ok !== true || stableSecond.ok !== true ||
                stableFirst.status !== "registered" || stableSecond.status !== "registered" || stableFirst.mutationCount !== 0 ||
                stableSecond.mutationCount !== 0 || !Array.isArray(before.nodePools) || before.nodePools.length !== 2 ||
                !Array.isArray(action.nodePools) || action.nodePools.length !== 2 || !Array.isArray(stableFirst.nodePools) ||
                stableFirst.nodePools.length !== 2 || !Array.isArray(stableSecond.nodePools) || stableSecond.nodePools.length !== 2) {
              fail("taint_migration_node_pool_readback_invalid");
            }
            const beforePools = poolsByPackage(before);
            const actionPools = poolsByPackage(action);
            const stableFirstPools = poolsByPackage(stableFirst);
            const stableSecondPools = poolsByPackage(stableSecond);
            let expectedMutationCount = 0;
            for (const packageId of ["basic", "pro"]) {
              const baselinePool = beforePools.get(packageId);
              const actionPool = actionPools.get(packageId);
              const firstPool = stableFirstPools.get(packageId);
              const secondPool = stableSecondPools.get(packageId);
              const legacy = exactTaint(baselinePool?.taintsBefore, "oplcloud.cn/workspace-id", "unallocated");
              const alreadyTarget = exactTaint(baselinePool?.taintsBefore, "oplcloud.cn/package-id", packageId);
              if (!baselinePool || !actionPool || !firstPool || !secondPool || (!legacy && !alreadyTarget) || baselinePool.nodePoolId !== expectedPoolIds[packageId] ||
                  actionPool.nodePoolId !== baselinePool.nodePoolId || firstPool.nodePoolId !== baselinePool.nodePoolId || secondPool.nodePoolId !== baselinePool.nodePoolId ||
                  baselinePool.nodePoolId === process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID ||
                  JSON.stringify(affectedNodeNames(actionPool)) !== JSON.stringify(affectedNodeNames(baselinePool)) ||
                  JSON.stringify(affectedNodeNames(firstPool)) !== JSON.stringify(affectedNodeNames(baselinePool)) ||
                  JSON.stringify(affectedNodeNames(secondPool)) !== JSON.stringify(affectedNodeNames(baselinePool)) ||
                  !exactTaint(actionPool.taintsAfter, "oplcloud.cn/package-id", packageId) ||
                  !exactTaint(firstPool.taintsBefore, "oplcloud.cn/package-id", packageId) || !exactTaint(firstPool.taintsAfter, "oplcloud.cn/package-id", packageId) ||
                  !exactTaint(secondPool.taintsBefore, "oplcloud.cn/package-id", packageId) || !exactTaint(secondPool.taintsAfter, "oplcloud.cn/package-id", packageId) ||
                  firstPool.status !== "registered" || secondPool.status !== "registered") {
                fail("taint_migration_node_pool_identity_drift");
              }
              if (legacy) expectedMutationCount++;
            }
            const expectedActionStatus = expectedMutationCount === 0 ? "registered" : "migrated";
            const reconcileOnly = action.status === "reconcile_only" && action.mutationCount === 0;
            if (!reconcileOnly && (action.status !== expectedActionStatus || action.mutationCount !== expectedMutationCount ||
                action.mutationCount < 0 || action.mutationCount > 2)) {
              fail("taint_migration_mutation_count_invalid");
            }
            const snapshot = (prefix) => targets.nodes.map((target) => {
              const node = readJSON(`${prefix}-${target.packageId}-${target.index}.json`);
              if (node?.metadata?.name !== target.nodeName || typeof node?.metadata?.uid !== "string" || !node.metadata.uid ||
                  typeof node?.metadata?.resourceVersion !== "string" || !node.metadata.resourceVersion) {
                fail("taint_migration_node_get_invalid");
              }
              const labels = node.metadata.labels || {};
              const ownerKeys = ["medopl.cn/workload", "oplcloud.cn/resource-id", "oplcloud.cn/account-id", "oplcloud.cn/workspace-id"];
              return {
                packageId: target.packageId,
                nodeName: target.nodeName,
                uid: node.metadata.uid,
                workspaceLabels: Object.fromEntries(ownerKeys.map((key) => [key, Object.hasOwn(labels, key) ? labels[key] : null])),
                taints: node.spec?.taints || []
              };
            });
            const immediateNodes = snapshot("immediate");
            const stableFirstNodes = snapshot("stable-first");
            const stableSecondNodes = snapshot("stable-second");
            if (baselineNodes.length !== targets.nodes.length || immediateNodes.length !== baselineNodes.length ||
                stableFirstNodes.length !== baselineNodes.length || stableSecondNodes.length !== baselineNodes.length) {
              fail("taint_migration_node_count_drift");
            }
            for (let index = 0; index < baselineNodes.length; index++) {
              const baseline = baselineNodes[index];
              const immediate = immediateNodes[index];
              const first = stableFirstNodes[index];
              const second = stableSecondNodes[index];
              if (baseline.nodeName !== immediate.nodeName || baseline.nodeName !== first.nodeName || baseline.nodeName !== second.nodeName ||
                  baseline.uid !== immediate.uid || baseline.uid !== first.uid || baseline.uid !== second.uid) {
                fail("taint_migration_node_uid_drift");
              }
              if (JSON.stringify(baseline.workspaceLabels) !== JSON.stringify(immediate.workspaceLabels) ||
                  JSON.stringify(baseline.workspaceLabels) !== JSON.stringify(first.workspaceLabels) ||
                  JSON.stringify(first.workspaceLabels) !== JSON.stringify(second.workspaceLabels)) {
                fail("taint_migration_workspace_labels_drift");
              }
              for (const current of [first, second]) {
                const packageTaints = current.taints.filter((taint) => taint?.key === "oplcloud.cn/package-id");
                const workspaceTaints = current.taints.filter((taint) => taint?.key === "oplcloud.cn/workspace-id");
                if (packageTaints.length !== 1 || packageTaints[0]?.value !== current.packageId || packageTaints[0]?.effect !== "NoSchedule" || workspaceTaints.length !== 0) {
                  fail("taint_migration_package_taint_not_stable");
                }
              }
            }
            const mutationBindingDigest = (process.env.OPL_TAINT_MIGRATION_MUTATION_BINDING_DIGEST || "").trim();
            if (!/^[0-9a-f]{64}$/.test(mutationBindingDigest)) fail("taint_migration_binding_digest_invalid");
            writeSummary({
              ...baseSummary,
              status: "stable",
              mutationCount: action.mutationCount,
              targetPoolCount: 2,
              affectedNodeCount: targets.nodes.length,
              nodePoolReadbackRounds: 3,
              nodeReadbackRounds: 3,
              immediateNodeGetCount: immediateNodes.length,
              stableNodeGetCount: stableFirstNodes.length + stableSecondNodes.length,
              sameNodeUID: true,
              sameWorkspaceLabels: true,
              packageTaintStable: true,
              systemExcluded: true,
              mutationBindingDigest,
              nodePoolMutation: { ...baseSummary.nodePoolMutation, mutationCount: action.mutationCount, affectedNodeCount: targets.nodes.length },
              indirectNodeTaintEffect: baseSummary.indirectNodeTaintEffect
            });
          } catch (error) {
            if (!fs.existsSync(summaryPath) || JSON.parse(fs.readFileSync(summaryPath, "utf8")).status !== "unknown") {
              writeSummary({ ...baseSummary, reasonCode: "taint_migration_readback_unavailable" });
            }
            throw error;
          }
          NODE

      - name: Validate taint migration report
        if: always() && inputs.migrate_package_taints == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        env:
          TAINT_MIGRATION_ACTION_OUTCOME: ${{ steps.taint_migration_action.outcome }}
          RUN_TAINT_MIGRATION: ${{ env.RUN_TENCENT_NODE_POOL_TAINT_MIGRATION }}
        run: |
          set -euo pipefail
          report_path="$OPL_BOOTSTRAP_SECRET_DIR/taint-migration-action.json"
          if [ ! -f "$report_path" ]; then
            echo "taint_migration_report_missing" >&2
            exit 1
          fi
          REPORT_PATH="$report_path" SUMMARY_PATH="$OPL_BOOTSTRAP_ARTIFACT_DIR/taint-migration-summary.json" TAINT_MIGRATION_ACTION_OUTCOME="$TAINT_MIGRATION_ACTION_OUTCOME" RUN_TAINT_MIGRATION="$RUN_TAINT_MIGRATION" node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
          const live = process.env.RUN_TAINT_MIGRATION === "1";
          const expectedPoolIds = {
            basic: (process.env.OPL_BASIC_COMPUTE_NODE_POOL_ID || "").trim(),
            pro: (process.env.OPL_PRO_COMPUTE_NODE_POOL_ID || "").trim()
          };
          const mutationBindingDigest = (process.env.OPL_TAINT_MIGRATION_MUTATION_BINDING_DIGEST || "").trim();
          const exactTaint = (taints, key, value) => Array.isArray(taints) && taints.length === 1 &&
            taints[0]?.key === key && taints[0]?.value === value && taints[0]?.effect === "NoSchedule";
          if (process.env.TAINT_MIGRATION_ACTION_OUTCOME !== "success" || report.ok !== true ||
              !Number.isInteger(report.mutationCount) || report.mutationCount < 0 || report.mutationCount > 2 ||
              (!live && report.mutationCount !== 0) ||
              !Array.isArray(report.nodePools) || report.nodePools.length !== 2 ||
              new Set(report.nodePools.map((pool) => pool.packageId)).size !== 2 ||
              report.nodePools.some((pool) => !["basic", "pro"].includes(pool.packageId)) ||
              report.nodePools.some((pool) => !Number.isInteger(pool.estimatedNodeCount) || pool.estimatedNodeCount < 0) ||
              !/^[0-9a-f]{64}$/.test(mutationBindingDigest) ||
              Object.values(expectedPoolIds).some((id) => !/^np-[A-Za-z0-9-]+$/.test(id)) ||
              expectedPoolIds.basic === expectedPoolIds.pro ||
              report.nodePools.some((pool) => pool.nodePoolId !== expectedPoolIds[pool.packageId]) ||
              report.nodePools.some((pool) => pool.nodePoolId === process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID) ||
              (report.protectedSystem || {}).nodePoolId !== process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID ||
              (report.protectedSystem || {}).poolCheckStatus !== "passed" || (report.protectedSystem || {}).machineCheckStatus !== "passed" ||
              (report.protectedSystem || {}).nodeCheckStatus !== "passed") {
            throw new Error(`taint_migration_failed:${report.errorCode || "unknown"}`);
          }
          const reconcileOnly = live && report.status === "reconcile_only" && report.mutationCount === 0;
          let changedPools = 0;
          for (const pool of report.nodePools) {
            const legacyBefore = exactTaint(pool.taintsBefore, "oplcloud.cn/workspace-id", "unallocated");
            const packageBefore = exactTaint(pool.taintsBefore, "oplcloud.cn/package-id", pool.packageId);
            const packageAfter = exactTaint(pool.taintsAfter, "oplcloud.cn/package-id", pool.packageId);
            const expectedPoolStatus = legacyBefore ? (live && !reconcileOnly ? "migrated" : "migration_required") : "registered";
            if ((!legacyBefore && !packageBefore) || !packageAfter || pool.status !== expectedPoolStatus) {
              throw new Error(`taint_migration_pool_${pool.packageId}_invalid`);
            }
            if (legacyBefore) changedPools++;
          }
          const expectedStatus = reconcileOnly ? "reconcile_only" : changedPools === 0 ? "registered" : live ? "migrated" : "migration_required";
          const expectedMutationCount = reconcileOnly ? 0 : live ? changedPools : 0;
          if (report.status !== expectedStatus || report.mutationCount !== expectedMutationCount) {
            throw new Error("taint_migration_status_or_mutation_count_invalid");
          }
          if (!live) {
            fs.writeFileSync(process.env.SUMMARY_PATH, `${JSON.stringify({
              schemaVersion: 1,
              status: report.status,
              mutationCount: 0,
              targetPoolCount: 2,
              affectedNodeCount: report.nodePools.reduce((sum, pool) => sum + pool.estimatedNodeCount, 0),
              mutationBindingDigest,
              systemExcluded: true,
              runnerDirectMutationCounts: {
                sub2api: 0, tencent: 0, kubernetes: 0, cvm: 0, cbs: 0, scale: 0,
                nodePatch: 0, launch: 0, storage: 0, billing: 0, key: 0
              },
              nodePoolMutation: {
                provider: "tencent", action: "ModifyNodePool", updateExistedNode: true,
                mutationCount: 0, affectedNodeCount: report.nodePools.reduce((sum, pool) => sum + pool.estimatedNodeCount, 0)
              },
              indirectNodeTaintEffect: {
                controller: "tke_native_node_pool", field: "node.spec.taints", directKubernetesMutation: false
              }
            })}\n`, { mode: 0o600 });
          }
          const encoded = JSON.stringify(report).toLowerCase();
          for (const forbidden of ["secret", "token", "requestid", "providerrequestid", "rawresponse", "workspace-id\":\"ws-"]) {
            if (encoded.includes(forbidden)) throw new Error(`taint_migration_report_leaked_${forbidden}`);
          }
          NODE

      - name: Validate bootstrap report
        if: always() && inputs.migrate_package_taints != 'true'
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        env:
          BOOTSTRAP_ACTION_OUTCOME: ${{ steps.bootstrap_action.outcome }}
        run: |
          set -euo pipefail
          report_path="$OPL_BOOTSTRAP_ARTIFACT_DIR/bootstrap-nodepool-report.json"
          inventory_path="$OPL_BOOTSTRAP_ARTIFACT_DIR/sku-inventory.json"
          if [ ! -f "$report_path" ]; then
            if [ "$BOOTSTRAP_ACTION_OUTCOME" = "success" ]; then
              echo "bootstrap_nodepool_report_missing" >&2
              exit 1
            fi
            echo "Bootstrap report was not produced because an upstream step failed; preserving the upstream failure." >&2
            exit 0
          fi
          if [ ! -f "$inventory_path" ]; then
            echo "bootstrap_nodepool_inventory_report_missing" >&2
            exit 1
          fi
          REPORT_PATH="$report_path" INVENTORY_PATH="$inventory_path" node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
          const inventory = JSON.parse(fs.readFileSync(process.env.INVENTORY_PATH, "utf8"));
          if (!Array.isArray(report.nodePools) || report.nodePools.length !== 2) throw new Error("bootstrap_nodepool_report_invalid");
          if (report.mutationCount < 0 || report.mutationCount > 2) throw new Error("bootstrap_nodepool_mutation_count_invalid");
          const nodePoolInventory = report.nodePoolInventoryBeforeMutation;
          const sortedInventory = Array.isArray(nodePoolInventory) ? [...nodePoolInventory].sort() : [];
          if (!Array.isArray(nodePoolInventory) || nodePoolInventory.length < 1 || new Set(nodePoolInventory).size !== nodePoolInventory.length ||
              nodePoolInventory.some((id, index) => !/^np-[A-Za-z0-9-]+$/.test(id) || id !== sortedInventory[index]) ||
              nodePoolInventory.filter((id) => id === process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID).length !== 1) {
            throw new Error("bootstrap_nodepool_inventory_before_mutation_invalid");
          }
          const packages = report.nodePools.map((item) => item.packageId).sort().join(",");
          if (packages !== "basic,pro") throw new Error("bootstrap_nodepool_packages_invalid");
          const basic = report.nodePools.find((item) => item.packageId === "basic");
          const pro = report.nodePools.find((item) => item.packageId === "pro");
          const allowedInventory = new Set([process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID, basic?.nodePoolId, pro?.nodePoolId].filter(Boolean));
          if (nodePoolInventory.some((id) => !allowedInventory.has(id))) throw new Error("bootstrap_nodepool_inventory_before_mutation_invalid");
          function validatePool(pool, packageId, cpu, memoryGb, selected) {
            const current = (inventory.skuPackages || []).find((item) => item.packageId === packageId);
            if (!pool || pool.cpu !== cpu || pool.memoryGb !== memoryGb || pool.maxReplicas !== 50 || !current || !Array.isArray(current.candidates) ||
                !current.candidates.some((candidate) => candidate.instanceType === pool.instanceType) || (!pool.nodePoolId && pool.instanceType !== selected)) {
              throw new Error(`bootstrap_${packageId}_resolved_instance_type_invalid`);
            }
          }
          validatePool(basic, "basic", 2, 4, process.env.OPL_BASIC_COMPUTE_INSTANCE_TYPE);
          validatePool(pro, "pro", 8, 16, process.env.OPL_PRO_COMPUTE_INSTANCE_TYPE);
          const encoded = JSON.stringify(report).toLowerCase();
          for (const forbidden of ["secret", "token", "requestid", "request id", "providerrequestid", "rawresponse", "wallet", "userdata"]) {
            if (encoded.includes(forbidden)) throw new Error(`bootstrap_nodepool_report_leaked_${forbidden}`);
          }
          NODE

      - name: Upload bootstrap report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-nodepool-report
          path: ${{ runner.temp }}/bootstrap-nodepool-report
          if-no-files-found: error
          retention-days: 30

      - name: Require bootstrap action success
        if: ${{ inputs.migrate_package_taints != 'true' && steps.bootstrap_action.outcome != 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          echo "NodePool bootstrap did not complete; inspect the uploaded partial-state report." >&2
          exit 1

      - name: Remove bootstrap secrets
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="${OPL_BOOTSTRAP_SECRET_DIR:-}"
          if [ -n "$secret_dir" ] && [ -d "$secret_dir" ]; then
            find "$secret_dir" -mindepth 1 -delete
            rmdir "$secret_dir"
          fi

      - name: Remove isolated source checkout
        if: always() && steps.prepare_source.outcome == 'success'
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          source_dir="${OPL_SOURCE_CHECKOUT:-}"
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ "$source_dir" != "$expected" ] || [ -z "$source_dir" ] || [ ! -d "$source_dir" ]; then
            echo "Isolated source checkout cleanup path mismatch or directory missing." >&2
            exit 1
          fi
          find "$source_dir" -mindepth 1 -delete
          rmdir "$source_dir"
