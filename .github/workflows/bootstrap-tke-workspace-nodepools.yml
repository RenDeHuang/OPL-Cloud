name: Bootstrap TKE Workspace NodePools

on:
  workflow_dispatch:
    inputs:
      merged_sha:
        description: Exact full SHA currently at origin/main; mutation is rejected from every other ref or revision.
        required: true
        type: string
      mutate_missing_pools:
        description: Create only missing compliant pools after complete read-only inventory.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      mutation_confirmation:
        description: Enter CREATE_MISSING_WORKSPACE_NODEPOOLS to create only missing zero-replica pools after the read-only one-launch headroom gates pass.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-resource-verification
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Inventory and bootstrap dedicated Workspace NodePools
    if: ${{ github.ref == 'refs/heads/main' && github.sha == inputs.merged_sha }}
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    timeout-minutes: 20
    environment: production
    env:
      OPL_K8S_NAMESPACE: ${{ vars.OPL_K8S_NAMESPACE || 'opl-cloud' }}
      OPL_SYSTEM_COMPUTE_NODE_POOL_ID: ${{ vars.OPL_SYSTEM_COMPUTE_NODE_POOL_ID || 'np-6l4nkdto' }}
      OPL_SYSTEM_COMPUTE_MACHINE_ID: ${{ vars.OPL_SYSTEM_COMPUTE_MACHINE_ID || 'np-6l4nkdto-2cdtm' }}
      OPL_SYSTEM_COMPUTE_NODE_NAME: ${{ vars.OPL_SYSTEM_COMPUTE_NODE_NAME || '10.66.0.42' }}
      OPL_SYSTEM_COMPUTE_MACHINE_TYPE: ${{ vars.OPL_SYSTEM_COMPUTE_MACHINE_TYPE }}
      OPL_SYSTEM_COMPUTE_CVM_ID: ${{ vars.OPL_SYSTEM_COMPUTE_CVM_ID }}
      OPL_BASIC_COMPUTE_NODE_POOL_ID: ${{ vars.OPL_BASIC_COMPUTE_NODE_POOL_ID }}
      OPL_PRO_COMPUTE_NODE_POOL_ID: ${{ vars.OPL_PRO_COMPUTE_NODE_POOL_ID }}
      OPL_BASIC_COMPUTE_INSTANCE_TYPE: ""
      OPL_PRO_COMPUTE_INSTANCE_TYPE: ""
      OPL_BASIC_COMPUTE_NODE_POOL_MAX_REPLICAS: "50"
      OPL_PRO_COMPUTE_NODE_POOL_MAX_REPLICAS: "50"
      OPL_TENCENT_ZONE: ${{ vars.OPL_TENCENT_ZONE || 'na-siliconvalley-1' }}
      TENCENT_DEPLOY_KUBECONFIG_PATH: ${{ vars.TENCENT_DEPLOY_KUBECONFIG_PATH || '/home/actions/.secrets/medopl/v22/kubeconfig-package-d-deploy' }}
      TENCENT_DEPLOY_KUBECONFIG_B64: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG_B64 }}
      TENCENT_DEPLOY_KUBECONFIG: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG }}
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENT_MUTATION_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENT_MUTATION_SECRET_KEY }}
      TENCENTCLOUD_REGION: ${{ vars.TENCENTCLOUD_REGION || vars.TENCENT_TCR_REGION || 'na-siliconvalley' }}
      TENCENT_DEPLOY_CLUSTER_ID: ${{ vars.TENCENT_DEPLOY_CLUSTER_ID }}
      TENCENT_CVM_SUBNET_ID: ${{ vars.TENCENT_CVM_SUBNET_ID }}
      TENCENT_CVM_SECURITY_GROUP_IDS: ${{ vars.TENCENT_CVM_SECURITY_GROUP_IDS }}
      TENCENT_CVM_SYSTEM_DISK_TYPE: ${{ vars.TENCENT_CVM_SYSTEM_DISK_TYPE || 'CLOUD_BSSD' }}
      TENCENT_CVM_SYSTEM_DISK_SIZE_GB: ${{ vars.TENCENT_CVM_SYSTEM_DISK_SIZE_GB || '50' }}
      RUN_TENCENT_CREATE_RELEASE_EXECUTION: ${{ inputs.mutate_missing_pools == 'true' && inputs.mutation_confirmation == 'CREATE_MISSING_WORKSPACE_NODEPOOLS' && '1' || '0' }}
      RUN_TENCENT_NODE_POOL_BOOTSTRAP: ${{ inputs.mutate_missing_pools == 'true' && inputs.mutation_confirmation == 'CREATE_MISSING_WORKSPACE_NODEPOOLS' && '1' || '0' }}
      RUN_TENCENT_NODE_POOL_BOOTSTRAP_CONFIRMATION: ${{ inputs.mutation_confirmation }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merged_sha }}
          fetch-depth: 0

      - name: Verify mutation source
        shell: bash
        env:
          OPL_MERGED_SHA: ${{ inputs.merged_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$OPL_MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full merged main SHA is required." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$head_sha" != "$OPL_MERGED_SHA" ] || [ "$main_sha" != "$OPL_MERGED_SHA" ]; then
            echo "Bootstrap source is not the exact current origin/main revision." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Prepare bootstrap workspace
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          artifact_dir="$RUNNER_TEMP/bootstrap-nodepool-report"
          mkdir -p "$artifact_dir"
          chmod 700 "$secret_dir" "$artifact_dir"
          kubeconfig="$secret_dir/kubeconfig"
          echo "OPL_BOOTSTRAP_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
          echo "OPL_BOOTSTRAP_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          if [ -f "$TENCENT_DEPLOY_KUBECONFIG_PATH" ]; then
            cp "$TENCENT_DEPLOY_KUBECONFIG_PATH" "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG_B64:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG" > "$kubeconfig"
          else
            echo "No deploy kubeconfig was provided." >&2
            exit 1
          fi
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Build current provisioner
        shell: bash
        run: |
          set -euo pipefail
          cd services/fabric
          go build -o "$OPL_BOOTSTRAP_SECRET_DIR/opl-tencent-provisioner" ./cmd/opl-tencent-provisioner

      - name: Inventory and select Workspace SKUs
        shell: bash
        run: |
          set -euo pipefail
          request="$OPL_BOOTSTRAP_SECRET_DIR/sku-inventory-request.json"
          REQUEST_PATH="$request" node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.env.REQUEST_PATH, JSON.stringify({
            action: "workspace_sku_inventory",
            zone: process.env.OPL_TENCENT_ZONE,
            requiredCapacity: 1
          }));
          NODE
          set +e
          "$OPL_BOOTSTRAP_SECRET_DIR/opl-tencent-provisioner" < "$request" > "$OPL_BOOTSTRAP_ARTIFACT_DIR/sku-inventory.json"
          inventory_status=$?
          set -e
          REPORT_PATH="$OPL_BOOTSTRAP_ARTIFACT_DIR/sku-inventory.json" INVENTORY_STATUS="$inventory_status" node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
          if (process.env.INVENTORY_STATUS !== "0" || report.ok !== true || report.status !== "ready" || report.mutationCount !== 0 || report.requiredCapacity !== 1) {
            throw new Error(`workspace_sku_inventory_failed:${report.errorCode || "unknown"}`);
          }
          if (report.prepaidQuotaRemaining < 1 || report.tkeAvailableNodeCapacity < 1 || report.tkeClusterNodeLimit < report.tkeCurrentNodeCount + 1) {
            throw new Error("workspace_sku_inventory_capacity_insufficient");
          }
          if (!Array.isArray(report.subnets) || report.subnets.length < 1 || report.subnets.reduce((sum, subnet) => sum + Number(subnet.availableIpAddresses || 0), 0) < 1) {
            throw new Error("workspace_sku_inventory_subnet_capacity_insufficient");
          }
          const system = report.protectedSystem || {};
          if (system.nodePoolId !== process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID || system.machineId !== process.env.OPL_SYSTEM_COMPUTE_MACHINE_ID ||
              system.nodeName !== process.env.OPL_SYSTEM_COMPUTE_NODE_NAME || system.poolCheckStatus !== "passed" || system.machineCheckStatus !== "passed" ||
              system.nodeCheckStatus !== "passed" || !["NativeCVM", "Native", "CXM"].includes(system.machineType) ||
              (process.env.OPL_SYSTEM_COMPUTE_MACHINE_TYPE && process.env.OPL_SYSTEM_COMPUTE_MACHINE_TYPE !== system.machineType)) {
            throw new Error("workspace_sku_inventory_system_identity_mismatch");
          }
          if (system.machineType === "NativeCVM") {
            if (system.cvmApplicable !== true || system.cvmCheckStatus !== "passed" || !/^ins-[A-Za-z0-9]+$/.test(system.cvmId || "")) {
              throw new Error("workspace_sku_inventory_system_cvm_identity_mismatch");
            }
          } else if (system.cvmApplicable !== false || system.cvmCheckStatus !== "not_applicable" || system.cvmId) {
            throw new Error("workspace_sku_inventory_system_cvm_applicability_mismatch");
          }
          const selected = {};
          for (const [packageId, cpu, memoryGb] of [["basic", 2, 4], ["pro", 8, 16]]) {
            const packages = (report.skuPackages || []).filter((item) => item.packageId === packageId);
            if (packages.length !== 1) throw new Error(`workspace_sku_inventory_${packageId}_missing`);
            const current = packages[0];
            if (current.cpu !== cpu || current.memoryGb !== memoryGb || !current.recommendedInstanceType || !Array.isArray(current.candidates) || current.candidates.length < 1 ||
                current.candidates[0].instanceType !== current.recommendedInstanceType || current.candidates[0].monthlyPriceCny !== current.recommendedMonthlyPriceCny) {
              throw new Error(`workspace_sku_inventory_${packageId}_invalid`);
            }
            selected[packageId] = current.recommendedInstanceType;
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `OPL_SYSTEM_COMPUTE_MACHINE_TYPE=${system.machineType}\nOPL_SYSTEM_COMPUTE_CVM_ID=${system.cvmApplicable ? system.cvmId : ""}\nOPL_BASIC_COMPUTE_INSTANCE_TYPE=${selected.basic}\nOPL_PRO_COMPUTE_INSTANCE_TYPE=${selected.pro}\n`, { mode: 0o600 });
          const encoded = JSON.stringify(report).toLowerCase();
          for (const forbidden of ["secret", "token", "requestid", "request id", "providerrequestid", "rawresponse"]) {
            if (encoded.includes(forbidden)) throw new Error(`workspace_sku_inventory_leaked_${forbidden}`);
          }
          NODE

      - name: Revalidate selected Workspace SKUs before mutation
        shell: bash
        run: |
          set -euo pipefail
          request="$OPL_BOOTSTRAP_SECRET_DIR/pre-mutation-sku-inventory-request.json"
          REQUEST_PATH="$request" node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.env.REQUEST_PATH, JSON.stringify({
            action: "workspace_sku_inventory",
            zone: process.env.OPL_TENCENT_ZONE,
            requiredCapacity: 1
          }));
          NODE
          set +e
          "$OPL_BOOTSTRAP_SECRET_DIR/opl-tencent-provisioner" < "$request" > "$OPL_BOOTSTRAP_ARTIFACT_DIR/pre-mutation-sku-inventory.json"
          inventory_status=$?
          set -e
          REPORT_PATH="$OPL_BOOTSTRAP_ARTIFACT_DIR/pre-mutation-sku-inventory.json" INVENTORY_STATUS="$inventory_status" node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
          if (process.env.INVENTORY_STATUS !== "0" || report.ok !== true || report.mutationCount !== 0 || report.requiredCapacity !== 1) {
            throw new Error(`workspace_sku_revalidation_failed:${report.errorCode || "unknown"}`);
          }
          const system = report.protectedSystem || {};
          if (system.nodePoolId !== process.env.OPL_SYSTEM_COMPUTE_NODE_POOL_ID || system.machineId !== process.env.OPL_SYSTEM_COMPUTE_MACHINE_ID ||
              system.nodeName !== process.env.OPL_SYSTEM_COMPUTE_NODE_NAME || system.machineType !== process.env.OPL_SYSTEM_COMPUTE_MACHINE_TYPE ||
              system.poolCheckStatus !== "passed" || system.machineCheckStatus !== "passed" || system.nodeCheckStatus !== "passed" ||
              (system.machineType === "NativeCVM" && (system.cvmApplicable !== true || system.cvmCheckStatus !== "passed" || system.cvmId !== process.env.OPL_SYSTEM_COMPUTE_CVM_ID)) ||
              (system.machineType !== "NativeCVM" && (system.cvmApplicable !== false || system.cvmCheckStatus !== "not_applicable" || system.cvmId))) {
            throw new Error("workspace_sku_revalidation_system_identity_failed");
          }
          for (const [packageId, selected] of [["basic", process.env.OPL_BASIC_COMPUTE_INSTANCE_TYPE], ["pro", process.env.OPL_PRO_COMPUTE_INSTANCE_TYPE]]) {
            const current = (report.skuPackages || []).find((item) => item.packageId === packageId);
            if (!current || !(current.candidates || []).some((candidate) => candidate.instanceType === selected)) {
              throw new Error(`workspace_sku_revalidation_${packageId}_failed`);
            }
          }
          NODE

      - name: Inventory and bootstrap package NodePools
        id: bootstrap_action
        continue-on-error: true
        shell: bash
        env:
          MUTATE_MISSING_POOLS: ${{ inputs.mutate_missing_pools }}
        run: |
          set -euo pipefail
          request="$OPL_BOOTSTRAP_SECRET_DIR/request.json"
          MUTATE_MISSING_POOLS="$MUTATE_MISSING_POOLS" REQUEST_PATH="$request" node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(process.env.REQUEST_PATH, JSON.stringify({
            action: "bootstrap_compute_node_pools",
            dryRun: process.env.MUTATE_MISSING_POOLS !== "true",
            zone: process.env.OPL_TENCENT_ZONE,
            requiredCapacity: 1
          }));
          NODE
          "$OPL_BOOTSTRAP_SECRET_DIR/opl-tencent-provisioner" < "$request" > "$OPL_BOOTSTRAP_ARTIFACT_DIR/bootstrap-nodepool-report.json"

      - name: Validate bootstrap report
        if: always()
        shell: bash
        env:
          BOOTSTRAP_ACTION_OUTCOME: ${{ steps.bootstrap_action.outcome }}
        run: |
          set -euo pipefail
          report_path="$OPL_BOOTSTRAP_ARTIFACT_DIR/bootstrap-nodepool-report.json"
          inventory_path="$OPL_BOOTSTRAP_ARTIFACT_DIR/sku-inventory.json"
          if [ ! -f "$report_path" ]; then
            if [ "$BOOTSTRAP_ACTION_OUTCOME" = "success" ]; then
              echo "bootstrap_nodepool_report_missing" >&2
              exit 1
            fi
            echo "Bootstrap report was not produced because an upstream step failed; preserving the upstream failure." >&2
            exit 0
          fi
          if [ ! -f "$inventory_path" ]; then
            echo "bootstrap_nodepool_inventory_report_missing" >&2
            exit 1
          fi
          REPORT_PATH="$report_path" INVENTORY_PATH="$inventory_path" node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
          const inventory = JSON.parse(fs.readFileSync(process.env.INVENTORY_PATH, "utf8"));
          if (!Array.isArray(report.nodePools) || report.nodePools.length !== 2) throw new Error("bootstrap_nodepool_report_invalid");
          if (report.mutationCount < 0 || report.mutationCount > 2) throw new Error("bootstrap_nodepool_mutation_count_invalid");
          const packages = report.nodePools.map((item) => item.packageId).sort().join(",");
          if (packages !== "basic,pro") throw new Error("bootstrap_nodepool_packages_invalid");
          const basic = report.nodePools.find((item) => item.packageId === "basic");
          const pro = report.nodePools.find((item) => item.packageId === "pro");
          function validatePool(pool, packageId, cpu, memoryGb, selected) {
            const current = (inventory.skuPackages || []).find((item) => item.packageId === packageId);
            if (!pool || pool.cpu !== cpu || pool.memoryGb !== memoryGb || pool.maxReplicas !== 50 || !current || !Array.isArray(current.candidates) ||
                !current.candidates.some((candidate) => candidate.instanceType === pool.instanceType) || (!pool.nodePoolId && pool.instanceType !== selected)) {
              throw new Error(`bootstrap_${packageId}_resolved_instance_type_invalid`);
            }
          }
          validatePool(basic, "basic", 2, 4, process.env.OPL_BASIC_COMPUTE_INSTANCE_TYPE);
          validatePool(pro, "pro", 8, 16, process.env.OPL_PRO_COMPUTE_INSTANCE_TYPE);
          const encoded = JSON.stringify(report).toLowerCase();
          for (const forbidden of ["secret", "token", "requestid", "request id", "providerrequestid", "rawresponse", "wallet", "userdata"]) {
            if (encoded.includes(forbidden)) throw new Error(`bootstrap_nodepool_report_leaked_${forbidden}`);
          }
          NODE

      - name: Upload bootstrap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-nodepool-report
          path: ${{ runner.temp }}/bootstrap-nodepool-report
          if-no-files-found: error
          retention-days: 30

      - name: Require bootstrap action success
        if: ${{ steps.bootstrap_action.outcome != 'success' }}
        shell: bash
        run: |
          echo "NodePool bootstrap did not complete; inspect the uploaded partial-state report." >&2
          exit 1

      - name: Remove bootstrap secrets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="${OPL_BOOTSTRAP_SECRET_DIR:-}"
          if [ -n "$secret_dir" ] && [ -d "$secret_dir" ]; then
            find "$secret_dir" -mindepth 1 -delete
            rmdir "$secret_dir"
          fi
