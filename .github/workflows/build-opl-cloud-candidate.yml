name: Build OPL Cloud Candidate

on:
  workflow_dispatch:
    inputs:
      product_sha:
        description: Exact 40-character Product commit already merged into Cloud main.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: opl-cloud-candidate-${{ inputs.product_sha }}
  cancel-in-progress: false

jobs:
  candidate:
    if: ${{ github.repository == 'gaofeng21cn/one-person-lab-cloud' && github.ref == 'refs/heads/codex/candidate-7fee0ddd-bridge' && github.actor == 'RenDeHuang' && github.triggering_actor == 'RenDeHuang' && inputs.product_sha == '7fee0ddd8a6c15d9fef36dce5a90bd2aa8959c7a' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PRODUCT_REPOSITORY: ${{ github.repository }}
      PRODUCT_SHA: ${{ inputs.product_sha }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.product_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$PRODUCT_SHA" ]; then
            echo "product_sha must be the exact checked-out lowercase Product SHA." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "Candidate checkout must be clean before source validation." >&2
            exit 1
          fi
          git fetch --no-tags "https://github.com/$PRODUCT_REPOSITORY.git" main:refs/remotes/candidate-source/main
          if ! git merge-base --is-ancestor "$PRODUCT_SHA" refs/remotes/candidate-source/main; then
            echo "Product SHA is not merged into canonical main." >&2
            exit 1
          fi
          product_tree="$(git rev-parse "$PRODUCT_SHA^{tree}")"
          if ! [[ "$product_tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Product tree readback is invalid." >&2
            exit 1
          fi
          build_context="$RUNNER_TEMP/opl-cloud-candidate-source"
          mkdir "$build_context"
          git archive --format=tar "$PRODUCT_SHA" | tar -xf - -C "$build_context"
          {
            printf 'PRODUCT_TREE=%s\n' "$product_tree"
            printf 'BUILD_CONTEXT=%s\n' "$build_context"
          } >> "$GITHUB_ENV"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate portable product boundary
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run validate:product-boundary
          if ! git diff-index --quiet HEAD --; then
            echo "Candidate validation changed tracked source bytes." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        env:
          PACKAGES_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PACKAGES_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish multi-architecture candidate
        id: image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/candidate
          candidate_tag="$IMAGE_REPOSITORY:candidate-$PRODUCT_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          metadata="$RUNNER_TEMP/opl-cloud-candidate-metadata.json"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/$PRODUCT_REPOSITORY" \
            --label "org.opencontainers.image.revision=$PRODUCT_SHA" \
            --cache-from "type=gha,scope=opl-cloud-candidate" \
            --cache-to "type=gha,mode=max,scope=opl-cloud-candidate" \
            --metadata-file "$metadata" \
            --tag "$candidate_tag" \
            --push \
            "$BUILD_CONTEXT"
          digest="$(jq -r '."containerimage.digest" // empty' "$metadata")"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Candidate build did not return an immutable index digest." >&2
            exit 1
          fi
          {
            printf 'candidate_tag=%s\n' "$candidate_tag"
            printf 'digest=%s\n' "$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Read back candidate index children and revisions
        shell: bash
        env:
          CANDIDATE_TAG: ${{ steps.image.outputs.candidate_tag }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "$CANDIDATE_TAG" --format '{{json .Manifest}}')"
          observed_digest="$(jq -r '.digest // empty' <<< "$manifest")"
          if [ "$observed_digest" != "$EXPECTED_DIGEST" ]; then
            echo "Candidate registry index digest readback mismatch." >&2
            exit 1
          fi
          jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json" and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1 and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length) == 1 and
            all(.manifests[];
              (.platform.os == "linux" and
               (.platform.architecture == "amd64" or .platform.architecture == "arm64")) or
              (.platform.os == "unknown" and .platform.architecture == "unknown" and
               .annotations["vnd.docker.reference.type"] == "attestation-manifest")
            )
          ' <<< "$manifest" >/dev/null
          amd64_digest="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<< "$manifest")"
          arm64_digest="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<< "$manifest")"
          if ! [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || ! [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || [ "$amd64_digest" = "$arm64_digest" ]; then
            echo "Candidate child manifest digest readback failed." >&2
            exit 1
          fi
          amd64_image="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY@$amd64_digest" --format '{{json .Image}}')"
          arm64_image="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY@$arm64_digest" --format '{{json .Image}}')"
          jq -e --arg revision "$PRODUCT_SHA" '
            .os == "linux" and .architecture == "amd64" and
            .config.Labels["org.opencontainers.image.revision"] == $revision
          ' <<< "$amd64_image" >/dev/null
          jq -e --arg revision "$PRODUCT_SHA" '
            .os == "linux" and .architecture == "arm64" and
            .config.Labels["org.opencontainers.image.revision"] == $revision
          ' <<< "$arm64_image" >/dev/null
          {
            printf 'AMD64_DIGEST=%s\n' "$amd64_digest"
            printf 'ARM64_DIGEST=%s\n' "$arm64_digest"
          } >> "$GITHUB_ENV"

      - name: Create and validate portable candidate bundle
        id: receipt
        shell: bash
        env:
          CLOUD_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          bundle="artifacts/candidate"
          raw="$RUNNER_TEMP/opl-cloud-candidate-raw.json"
          receipt="$bundle/opl-cloud-candidate.json"
          assets="$RUNNER_TEMP/opl-cloud-candidate-assets.json"
          cp "$BUILD_CONTEXT/compose.yaml" "$bundle/compose.yaml"
          cp "$BUILD_CONTEXT/deploy/portable/compose.deployment-platform-owned.yaml" "$bundle/compose.deployment-platform-owned.yaml"
          cp "$BUILD_CONTEXT/deploy/portable/compose.deployment-managed-tke.yaml" "$bundle/compose.deployment-managed-tke.yaml"
          cp "$BUILD_CONTEXT/deploy/portable/compose.deployment-customer-owned.yaml" "$bundle/compose.deployment-customer-owned.yaml"
          cp "$BUILD_CONTEXT/deploy/portable/compose.fabric-local-docker.yaml" "$bundle/compose.fabric-local-docker.yaml"
          cp "$BUILD_CONTEXT/deploy/portable/compose.fabric-tencent-tke.yaml" "$bundle/compose.fabric-tencent-tke.yaml"
          cp "$BUILD_CONTEXT/deploy/portable/compose.local-workspace.yaml" "$bundle/compose.local-workspace.yaml"
          cp "$BUILD_CONTEXT/deploy/portable/opl-cloud.env.example" "$bundle/opl-cloud.env.example"
          (
            cd "$bundle"
            jq -n \
              --arg compose "$(sha256sum compose.yaml | cut -d ' ' -f1)" \
              --arg platformOwned "$(sha256sum compose.deployment-platform-owned.yaml | cut -d ' ' -f1)" \
              --arg managedTke "$(sha256sum compose.deployment-managed-tke.yaml | cut -d ' ' -f1)" \
              --arg customerOwned "$(sha256sum compose.deployment-customer-owned.yaml | cut -d ' ' -f1)" \
              --arg localDocker "$(sha256sum compose.fabric-local-docker.yaml | cut -d ' ' -f1)" \
              --arg tencentTke "$(sha256sum compose.fabric-tencent-tke.yaml | cut -d ' ' -f1)" \
              --arg localWorkspace "$(sha256sum compose.local-workspace.yaml | cut -d ' ' -f1)" \
              --arg environment "$(sha256sum opl-cloud.env.example | cut -d ' ' -f1)" '
              [
                {name:"compose.yaml",sha256:$compose},
                {name:"compose.deployment-platform-owned.yaml",sha256:$platformOwned},
                {name:"compose.deployment-managed-tke.yaml",sha256:$managedTke},
                {name:"compose.deployment-customer-owned.yaml",sha256:$customerOwned},
                {name:"compose.fabric-local-docker.yaml",sha256:$localDocker},
                {name:"compose.fabric-tencent-tke.yaml",sha256:$tencentTke},
                {name:"compose.local-workspace.yaml",sha256:$localWorkspace},
                {name:"opl-cloud.env.example",sha256:$environment}
              ]
            ' > "$assets"
          )
          jq -n \
            --arg productRepository "$PRODUCT_REPOSITORY" \
            --arg productSha "$PRODUCT_SHA" \
            --arg productTree "$PRODUCT_TREE" \
            --arg cloudRepository "$IMAGE_REPOSITORY" \
            --arg indexDigest "$CLOUD_IMAGE_DIGEST" \
            --arg amd64Digest "$AMD64_DIGEST" \
            --arg arm64Digest "$ARM64_DIGEST" \
            --arg workflowSha "$GITHUB_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --slurpfile assets "$assets" '
            {
              schemaVersion: 2,
              kind: "opl_cloud_candidate",
              product: {repository: $productRepository, sha: $productSha, tree: $productTree},
              cloudImage: {
                repository: $cloudRepository,
                indexRef: ($cloudRepository + "@" + $indexDigest),
                indexDigest: $indexDigest,
                revision: $productSha,
                platforms: [
                  {platform: "linux/amd64", digest: $amd64Digest},
                  {platform: "linux/arm64", digest: $arm64Digest}
                ]
              },
              assets: $assets[0],
              provenance: {
                workflowRepository: $productRepository,
                workflowSha: $workflowSha,
                workflowRunId: $workflowRunId,
                workflowRunAttempt: $workflowRunAttempt
              }
            }
          ' > "$raw"
          RAW="$raw" RECEIPT="$receipt" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { writeCandidateReceipt } from "./tools/cloud-candidate-receipt.ts";
          await writeCandidateReceipt(process.env.RECEIPT, JSON.parse(await readFile(process.env.RAW, "utf8")));
          NODE
          node tools/cloud-candidate-receipt.ts validate --receipt "$receipt"
          (
            cd "$bundle"
            sha256sum \
              compose.yaml \
              compose.deployment-platform-owned.yaml \
              compose.deployment-managed-tke.yaml \
              compose.deployment-customer-owned.yaml \
              compose.fabric-local-docker.yaml \
              compose.fabric-tencent-tke.yaml \
              compose.local-workspace.yaml \
              opl-cloud.env.example \
              opl-cloud-candidate.json \
              > SHA256SUMS
          )
          node tools/cloud-candidate-receipt.ts validate-bundle --bundle "$bundle"
          receipt_digest="$(node tools/cloud-candidate-receipt.ts digest --receipt "$receipt")"
          printf 'receipt_digest=%s\n' "$receipt_digest" >> "$GITHUB_OUTPUT"
          {
            printf '## OPL Cloud Candidate\n\n'
            printf -- '- Product SHA: `%s`\n' "$PRODUCT_SHA"
            printf -- '- Cloud image index: `%s@%s`\n' "$IMAGE_REPOSITORY" "$CLOUD_IMAGE_DIGEST"
            printf -- '- Candidate manifest: `%s`\n' "$receipt_digest"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$raw" "$assets"

      - name: Upload portable candidate bundle
        id: candidate_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opl-cloud-candidate-${{ inputs.product_sha }}-${{ github.run_attempt }}
          path: artifacts/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Log out from GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true
