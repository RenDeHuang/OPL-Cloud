name: Release OPL Cloud

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable v0.x.y release tag.
        required: true
        type: string
      ref:
        description: Exact 40-character product commit already merged into main.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: opl-cloud-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build portable product release
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.release_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.release_artifact.outputs.artifact-digest }}
      image_digest: ${{ steps.image.outputs.digest }}
    env:
      PRODUCT_REPOSITORY: ${{ github.repository }}
      PRODUCT_SHA: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.version }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be an immutable v0.x.y tag." >&2
            exit 1
          fi
          if ! [[ "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$PRODUCT_SHA" ]; then
            echo "ref must be the exact checked-out 40-character product SHA." >&2
            exit 1
          fi
          git fetch --no-tags "https://github.com/$PRODUCT_REPOSITORY.git" main:refs/remotes/release-source/main
          if ! git merge-base --is-ancestor "$PRODUCT_SHA" refs/remotes/release-source/main; then
            echo "Product SHA is not merged into main." >&2
            exit 1
          fi

      - name: Validate portable product boundary
        run: |
          npm ci --no-audit --no-fund
          npm run validate:product-boundary
          docker compose --env-file deploy/portable/opl-cloud.env.example config --quiet
          docker compose --env-file deploy/portable/opl-cloud.env.example -f compose.yaml \
            -f deploy/portable/compose.deployment-customer-owned.yaml \
            -f deploy/portable/compose.fabric-local-docker.yaml \
            -f deploy/portable/compose.local-workspace.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build multi-architecture image artifact
        id: image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/image
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/$PRODUCT_REPOSITORY" \
            --label "org.opencontainers.image.revision=$PRODUCT_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --cache-from "type=gha,scope=opl-cloud-release" \
            --cache-to "type=gha,mode=max,scope=opl-cloud-release" \
            --output "type=oci,dest=artifacts/image,tar=false,name=$IMAGE_REPOSITORY:$RELEASE_TAG" \
            .
          manifest="$(docker buildx imagetools inspect "oci-layout://$PWD/artifacts/image:$RELEASE_TAG" --format '{{json .Manifest}}')"
          digest="$(jq -r '.digest' <<< "$manifest")"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "OCI image digest readback failed." >&2
            exit 1
          fi
          jq -e '
            [.manifests[] | select(.platform.os == "linux") | (.platform.os + "/" + .platform.architecture)]
            | sort == ["linux/amd64", "linux/arm64"]
          ' <<< "$manifest" >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Create release manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          cp compose.yaml artifacts/release/compose.yaml
          cp deploy/portable/compose.deployment-platform-owned.yaml artifacts/release/compose.deployment-platform-owned.yaml
          cp deploy/portable/compose.deployment-managed-tke.yaml artifacts/release/compose.deployment-managed-tke.yaml
          cp deploy/portable/compose.deployment-customer-owned.yaml artifacts/release/compose.deployment-customer-owned.yaml
          cp deploy/portable/compose.fabric-local-docker.yaml artifacts/release/compose.fabric-local-docker.yaml
          cp deploy/portable/compose.fabric-tencent-tke.yaml artifacts/release/compose.fabric-tencent-tke.yaml
          cp deploy/portable/compose.local-workspace.yaml artifacts/release/compose.local-workspace.yaml
          cp deploy/portable/opl-cloud.env.example artifacts/release/opl-cloud.env.example
          jq -n \
            --arg repository "$PRODUCT_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$PRODUCT_SHA" \
            --arg image "$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            --arg digest "$IMAGE_DIGEST" \
            '{schemaVersion:1,product:"OPL Cloud",productRepository:$repository,releaseTag:$tag,productSha:$sha,image:{ref:$image,digest:$digest,platforms:["linux/amd64","linux/arm64"]},assets:["compose.yaml","compose.deployment-platform-owned.yaml","compose.deployment-managed-tke.yaml","compose.deployment-customer-owned.yaml","compose.fabric-local-docker.yaml","compose.fabric-tencent-tke.yaml","compose.local-workspace.yaml","opl-cloud.env.example","SHA256SUMS"]}' \
            > artifacts/release/opl-cloud-release.json
          (
            cd artifacts/release
            sha256sum \
              compose.yaml \
              compose.deployment-platform-owned.yaml \
              compose.deployment-managed-tke.yaml \
              compose.deployment-customer-owned.yaml \
              compose.fabric-local-docker.yaml \
              compose.fabric-tencent-tke.yaml \
              compose.local-workspace.yaml \
              opl-cloud.env.example \
              opl-cloud-release.json \
              > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload immutable release artifact
        id: release_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opl-cloud-release-${{ inputs.ref }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish portable product release
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    needs: build
    runs-on: ubuntu-latest
    environment: cloud-release
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      PRODUCT_REPOSITORY: ${{ github.repository }}
      PRODUCT_SHA: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.version }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
      EXPECTED_IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}

    steps:
      - name: Verify release identity and unused targets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]] || ! [[ "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release identity is invalid." >&2
            exit 1
          fi
          comparison="$(gh api --hostname github.com "repos/$PRODUCT_REPOSITORY/compare/$PRODUCT_SHA...main")"
          jq -e --arg sha "$PRODUCT_SHA" '
            (.status == "ahead" or .status == "identical") and .merge_base_commit.sha == $sha
          ' <<< "$comparison" >/dev/null
          if gh api --hostname github.com "repos/$PRODUCT_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1 || \
             gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists." >&2
            exit 1
          fi

      - name: Verify immutable build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || ! [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "build artifact identity is invalid." >&2
            exit 1
          fi
          metadata="$(gh api --hostname github.com "repos/$PRODUCT_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          jq -e \
            --arg id "$ARTIFACT_ID" \
            --arg name "opl-cloud-release-$PRODUCT_SHA" \
            --arg digest "$ARTIFACT_DIGEST" \
            --arg run_id "$GITHUB_RUN_ID" '
              (.id | tostring) == $id and .name == $name and .expired == false and
              .workflow_run.id == ($run_id | tonumber) and
              (.digest == $digest or .digest == ("sha256:" + $digest))
            ' <<< "$metadata" >/dev/null
          artifact_zip="$RUNNER_TEMP/release-artifact.zip"
          gh api --hostname github.com "repos/$PRODUCT_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$artifact_zip"
          printf '%s  %s\n' "$ARTIFACT_DIGEST" "$artifact_zip" | sha256sum --check --status
          mkdir -p artifacts
          unzip -q "$artifact_zip" -d artifacts
          test -f artifacts/image/oci-layout
          test -f artifacts/image/index.json
          for asset in compose.yaml compose.deployment-platform-owned.yaml compose.deployment-managed-tke.yaml compose.deployment-customer-owned.yaml compose.fabric-local-docker.yaml compose.fabric-tencent-tke.yaml compose.local-workspace.yaml opl-cloud.env.example opl-cloud-release.json SHA256SUMS; do
            test -f "artifacts/release/$asset"
          done
          (cd artifacts/release && sha256sum --check --strict SHA256SUMS)
          jq -e \
            --arg repository "$PRODUCT_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$PRODUCT_SHA" \
            --arg image "$IMAGE_REPOSITORY@$EXPECTED_IMAGE_DIGEST" \
            --arg digest "$EXPECTED_IMAGE_DIGEST" '
              .schemaVersion == 1 and .product == "OPL Cloud" and
              .productRepository == $repository and .releaseTag == $tag and .productSha == $sha and
              .image.ref == $image and .image.digest == $digest and
              .image.platforms == ["linux/amd64", "linux/arm64"] and
              .assets == ["compose.yaml", "compose.deployment-platform-owned.yaml", "compose.deployment-managed-tke.yaml", "compose.deployment-customer-owned.yaml", "compose.fabric-local-docker.yaml", "compose.fabric-tencent-tke.yaml", "compose.local-workspace.yaml", "opl-cloud.env.example", "SHA256SUMS"]
            ' artifacts/release/opl-cloud-release.json >/dev/null
          checksum_manifest_digest="$(sha256sum artifacts/release/SHA256SUMS | cut -d ' ' -f1)"
          jq -n \
            --arg repository "$PRODUCT_REPOSITORY" \
            --arg workflowSha "$GITHUB_SHA" \
            --arg workflowRef "$GITHUB_REF" \
            --arg productSha "$PRODUCT_SHA" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg image "$IMAGE_REPOSITORY@$EXPECTED_IMAGE_DIGEST" \
            --arg checksumManifestSha256 "$checksum_manifest_digest" \
            '{schemaVersion:1,productRepository:$repository,workflowSha:$workflowSha,workflowRef:$workflowRef,productSha:$productSha,releaseTag:$releaseTag,image:$image,checksumManifestSha256:$checksumManifestSha256}' \
            > artifacts/release-provenance.json

      - name: Attest release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            artifacts/release/compose.yaml
            artifacts/release/compose.deployment-platform-owned.yaml
            artifacts/release/compose.deployment-managed-tke.yaml
            artifacts/release/compose.deployment-customer-owned.yaml
            artifacts/release/compose.fabric-local-docker.yaml
            artifacts/release/compose.fabric-tencent-tke.yaml
            artifacts/release/compose.local-workspace.yaml
            artifacts/release/opl-cloud.env.example
            artifacts/release/opl-cloud-release.json
            artifacts/release/SHA256SUMS
          predicate-type: https://github.com/gaofeng21cn/one-person-lab-cloud/attestations/opl-cloud-release/v1
          predicate-path: artifacts/release-provenance.json

      - name: Log in to GHCR
        env:
          PACKAGES_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx version
          printf '%s' "$PACKAGES_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Verify immutable image tag is unused
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GHCR release tag already exists and will not be overwritten." >&2
            exit 1
          fi

      - name: Publish multi-architecture image
        shell: bash
        run: |
          set -euo pipefail
          local_image="oci-layout://$PWD/artifacts/image:$RELEASE_TAG"
          local_manifest="$(docker buildx imagetools inspect "$local_image" --format '{{json .Manifest}}')"
          local_digest="$(jq -r '.digest' <<< "$local_manifest")"
          if [ "$local_digest" != "$EXPECTED_IMAGE_DIGEST" ]; then
            echo "OCI artifact digest does not match the build output." >&2
            exit 1
          fi
          jq -e '
            [.manifests[] | select(.platform.os == "linux") | (.platform.os + "/" + .platform.architecture)]
            | sort == ["linux/amd64", "linux/arm64"]
          ' <<< "$local_manifest" >/dev/null
          docker buildx imagetools create --tag "$IMAGE_REPOSITORY:$RELEASE_TAG" "$local_image"
          published_digest="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_TAG" --format '{{.Manifest.Digest}}')"
          expected_digest="$EXPECTED_IMAGE_DIGEST"
          if [ "$published_digest" != "$expected_digest" ]; then
            echo "GHCR digest readback does not match the build artifact." >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$PRODUCT_REPOSITORY" \
            --target "$PRODUCT_SHA" \
            --title "OPL Cloud $RELEASE_TAG" \
            --generate-notes \
            artifacts/release/compose.yaml \
            artifacts/release/compose.deployment-platform-owned.yaml \
            artifacts/release/compose.deployment-managed-tke.yaml \
            artifacts/release/compose.deployment-customer-owned.yaml \
            artifacts/release/compose.fabric-local-docker.yaml \
            artifacts/release/compose.fabric-tencent-tke.yaml \
            artifacts/release/compose.local-workspace.yaml \
            artifacts/release/opl-cloud.env.example \
            artifacts/release/opl-cloud-release.json \
            artifacts/release/SHA256SUMS

      - name: Read back release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --json tagName,targetCommitish,assets > artifacts/release/readback.json
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$PRODUCT_SHA" '
            .tagName == $tag and .targetCommitish == $sha and
            ([.assets[].name] | sort) == (["SHA256SUMS","compose.deployment-customer-owned.yaml","compose.deployment-managed-tke.yaml","compose.deployment-platform-owned.yaml","compose.fabric-local-docker.yaml","compose.fabric-tencent-tke.yaml","compose.local-workspace.yaml","compose.yaml","opl-cloud-release.json","opl-cloud.env.example"] | sort)
          ' artifacts/release/readback.json >/dev/null
          mkdir -p artifacts/release-readback
          gh release download "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --dir artifacts/release-readback
          (cd artifacts/release-readback && sha256sum --check --strict SHA256SUMS)
          checksum_manifest_digest="$(sha256sum artifacts/release-readback/SHA256SUMS | cut -d ' ' -f1)"
          predicate_type="https://github.com/gaofeng21cn/one-person-lab-cloud/attestations/opl-cloud-release/v1"
          for asset in compose.yaml compose.deployment-platform-owned.yaml compose.deployment-managed-tke.yaml compose.deployment-customer-owned.yaml compose.fabric-local-docker.yaml compose.fabric-tencent-tke.yaml compose.local-workspace.yaml opl-cloud.env.example opl-cloud-release.json SHA256SUMS; do
            verification="$(gh attestation verify "artifacts/release-readback/$asset" \
              --repo "$PRODUCT_REPOSITORY" \
              --signer-workflow "$PRODUCT_REPOSITORY/.github/workflows/release-opl-cloud-image.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --predicate-type "$predicate_type" \
              --deny-self-hosted-runners \
              --format json)"
            jq -e \
              --arg repository "$PRODUCT_REPOSITORY" \
              --arg workflowSha "$GITHUB_SHA" \
              --arg workflowRef "$GITHUB_REF" \
              --arg productSha "$PRODUCT_SHA" \
              --arg releaseTag "$RELEASE_TAG" \
              --arg image "$IMAGE_REPOSITORY@$EXPECTED_IMAGE_DIGEST" \
              --arg checksumManifestSha256 "$checksum_manifest_digest" '
                map(select(
                  .verificationResult.statement.predicate.schemaVersion == 1 and
                  .verificationResult.statement.predicate.productRepository == $repository and
                  .verificationResult.statement.predicate.workflowSha == $workflowSha and
                  .verificationResult.statement.predicate.workflowRef == $workflowRef and
                  .verificationResult.statement.predicate.productSha == $productSha and
                  .verificationResult.statement.predicate.releaseTag == $releaseTag and
                  .verificationResult.statement.predicate.image == $image and
                  .verificationResult.statement.predicate.checksumManifestSha256 == $checksumManifestSha256
                )) | length >= 1
              ' <<< "$verification" >/dev/null
          done
          printf 'Published %s at %s\n' "$IMAGE_REPOSITORY@$EXPECTED_IMAGE_DIGEST" "$RELEASE_TAG"
