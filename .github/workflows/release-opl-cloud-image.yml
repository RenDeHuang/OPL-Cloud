name: Release OPL Cloud

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable v0.x.y release tag.
        required: true
        type: string
      ref:
        description: Exact 40-character product commit already merged into main.
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: opl-cloud-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish portable product release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_REPOSITORY: ${{ github.repository }}
      PRODUCT_SHA: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.version }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be an immutable v0.x.y tag." >&2
            exit 1
          fi
          if ! [[ "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$PRODUCT_SHA" ]; then
            echo "ref must be the exact checked-out 40-character product SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/release-source/main
          if ! git merge-base --is-ancestor "$PRODUCT_SHA" refs/remotes/release-source/main; then
            echo "Product SHA is not merged into main." >&2
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" ] || gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists." >&2
            exit 1
          fi

      - name: Validate portable product boundary
        run: |
          npm ci --no-audit --no-fund
          npm run validate:product-boundary
          docker compose --env-file deploy/portable/opl-cloud.env.example config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        shell: bash
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Verify immutable image tag is unused
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GHCR release tag already exists and will not be overwritten." >&2
            exit 1
          fi

      - name: Build and push multi-architecture image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/$PRODUCT_REPOSITORY" \
            --label "org.opencontainers.image.revision=$PRODUCT_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --tag "$IMAGE_REPOSITORY:$RELEASE_TAG" \
            --push .
          digest="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_TAG" --format '{{.Manifest.Digest}}')"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "GHCR digest readback failed." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Create release manifest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          jq -n \
            --arg repository "$PRODUCT_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$PRODUCT_SHA" \
            --arg image "$IMAGE" \
            --arg digest "$IMAGE_DIGEST" \
            '{schemaVersion:1,product:"OPL Cloud",productRepository:$repository,releaseTag:$tag,productSha:$sha,image:{ref:$image,digest:$digest,platforms:["linux/amd64","linux/arm64"]},assets:["compose.yaml","opl-cloud.env.example"]}' \
            > artifacts/release/opl-cloud-release.json

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$PRODUCT_REPOSITORY" \
            --target "$PRODUCT_SHA" \
            --title "OPL Cloud $RELEASE_TAG" \
            --generate-notes \
            compose.yaml \
            deploy/portable/opl-cloud.env.example \
            artifacts/release/opl-cloud-release.json

      - name: Read back release
        env:
          EXPECTED_IMAGE: ${{ steps.image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --json tagName,targetCommitish,assets > artifacts/release/readback.json
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$PRODUCT_SHA" '
            .tagName == $tag and .targetCommitish == $sha and
            ([.assets[].name] | sort) == (["compose.yaml","opl-cloud-release.json","opl-cloud.env.example"] | sort)
          ' artifacts/release/readback.json >/dev/null
          printf 'Published %s at %s\n' "$EXPECTED_IMAGE" "$RELEASE_TAG"
