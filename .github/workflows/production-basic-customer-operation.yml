      - name: Run Workspace identity diagnosis
        id: diagnose
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          node tools/production-live-qa.ts --workspace-identity-diagnose > "$OPL_WORKSPACE_IDENTITY_RAW_RESULT_PATH"

      - name: Generate safe Workspace identity artifact
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          let raw;
          try {
            raw = JSON.parse(await readFile(process.env.OPL_WORKSPACE_IDENTITY_RAW_RESULT_PATH, "utf8"));
          } catch {
            raw = null;
          }
          const identity = raw?.identity;
          const key = identity?.workspaceKey;
          const valid = raw?.schemaVersion === 1 && raw?.operationMode === "workspace_identity_diagnose" && raw?.status === "proven" &&
            identity?.accountId === process.env.OPL_WORKSPACE_IDENTITY_ACCOUNT_ID && identity?.workspaceId === process.env.OPL_WORKSPACE_IDENTITY_WORKSPACE_ID &&
            /^usr-[A-Za-z0-9-]+$/.test(String(identity?.ownerUserId || "")) && /^[1-9][0-9]*$/.test(String(identity?.workspaceApiKeyId || "")) &&
            /^[1-9][0-9]*$/.test(String(identity?.sub2apiUserId || "")) && /^[0-9a-f]{64}$/.test(String(identity?.customerEmailSha256 || "")) &&
            key?.id === identity?.workspaceApiKeyId && key?.kind === "workspace" && key?.status === "active" && typeof key?.name === "string" && key.name.length > 0 &&
            raw?.runnerDirectMutationCounts?.sub2api === 0 && raw?.runnerDirectMutationCounts?.tencent === 0 && raw?.runnerDirectMutationCounts?.kubernetes === 0 &&
            Number.isFinite(Date.parse(String(raw?.verifiedAt || ""))) && !/@|password|secret|token|cookie|maskedValue/i.test(JSON.stringify(raw));
          const artifact = valid ? {
            schemaVersion: 1,
            operationMode: "workspace_identity_diagnose",
            status: "proven",
            identity: {
              accountId: identity.accountId,
              ownerUserId: identity.ownerUserId,
              workspaceId: identity.workspaceId,
              workspaceApiKeyId: identity.workspaceApiKeyId,
              sub2apiUserId: identity.sub2apiUserId,
              customerEmailSha256: identity.customerEmailSha256,
              workspaceKey: { id: key.id, kind: key.kind, name: key.name, status: key.status }
            },
            runnerDirectMutationCounts: { sub2api: 0, tencent: 0, kubernetes: 0 },
            verifiedAt: raw.verifiedAt
          } : {
            schemaVersion: 1,
            operationMode: "workspace_identity_diagnose",
            status: "blocked",
            errorCode: "workspace_identity_diagnosis_failed",
            runnerDirectMutationCounts: { sub2api: 0, tencent: 0, kubernetes: 0 }
          };
          await writeFile(`${process.env.OPL_WORKSPACE_IDENTITY_ARTIFACT_DIR}/workspace-identity-diagnosis.json`, `${JSON.stringify(artifact, null, 2)}\n`, { mode: 0o600 });
          if (!valid) process.exitCode = 1;
          NODE

      - name: Upload redacted Workspace identity diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-workspace-identity-diagnosis
          path: ${{ runner.temp }}/production-workspace-identity-diagnosis
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Require Workspace identity diagnosis success
        if: ${{ steps.diagnose.outcome != 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          echo "Workspace identity diagnosis stopped; inspect the redacted artifact." >&2
          exit 1

      - name: Remove isolated source checkout
        if: always() && steps.prepare_source.outcome == 'success'
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          source_dir="${OPL_SOURCE_CHECKOUT:-}"
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ -z "$source_dir" ] || [ "$source_dir" != "$expected" ]; then
            echo "Refusing to remove unexpected source checkout path." >&2
            exit 1
          fi
          if [ -d "$source_dir" ]; then
            find "$source_dir" -mindepth 1 -delete
            rmdir "$source_dir"
          fi

