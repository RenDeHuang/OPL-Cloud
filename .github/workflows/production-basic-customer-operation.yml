name: Production Basic Customer Operation

on:
  workflow_dispatch:
    inputs:
      merged_sha:
        description: Exact full SHA currently at origin/main.
        required: true
        type: string
      approval_id:
        description: Exact approval ID for separately authorized customer or model operations; unused by Recovery Plan validation.
        required: false
        default: ""
        type: string
      operation_mode:
        description: Select a customer operation, identity readback, fresh Acceptance, server-owned Recovery Plan validation, or the isolated recovered Workspace E2E.
        required: true
        default: customer_operation
        type: choice
        options:
          - customer_operation
          - workspace_identity_diagnose
          - recovery_plan_diagnose
          - acceptance_b_fresh_order
          - compute_claim_validate
          - recovery_plan_execute
          - controlled_pilot_closed_validate
          - recovered_workspace_e2e
      funding_mode:
        description: operator_precharge performs the approved provision and recharge; operator_precharge_recovery reads one approved completed precharge before the purchase.
        required: true
        default: operator_precharge
        type: choice
        options:
          - operator_precharge
          - operator_precharge_recovery
      confirm_account_provision:
        description: "operator_precharge only: approve one real operator account provision. Must be false for operator_precharge_recovery."
        required: true
        default: false
        type: boolean
      confirm_wallet_recharge:
        description: "operator_precharge only: approve one real Sub2API wallet recharge. Must be false for operator_precharge_recovery."
        required: true
        default: false
        type: boolean
      confirm_workspace_purchase:
        description: Approve one real Basic Workspace purchase.
        required: true
        default: false
        type: boolean
      confirm_single_model_request:
        description: Approve one real model request after Runtime readiness.
        required: true
        default: false
        type: boolean
      confirm_recovery_plan_execute:
        description: Approve one exact persisted Recovery Plan continuation for the original Launch operation.
        required: true
        default: false
        type: boolean
      resume_run_id:
        description: Optional prior run ID whose redacted checkpoint should be resumed with the same approval.
        required: false
        default: ""
        type: string
      customer_email:
        description: Protected exact customer email for recovered_workspace_e2e verification.
        required: false
        default: ""
        type: string
      workspace_identity_account_id:
        description: Exact non-secret account ID for the read-only Workspace identity receipt.
        required: false
        default: ""
        type: string
      workspace_identity_workspace_id:
        description: Exact non-secret Workspace ID for the read-only Workspace identity receipt.
        required: false
        default: ""
        type: string
      recovery_plan_launch_operation_id:
        description: Exact original Launch operation ID for persisted Recovery Plan validation or recovered Workspace E2E.
        required: false
        default: ""
        type: string
      recovery_plan_id:
        description: Exact persisted Recovery Plan ID for zero-mutation validation or recovered Workspace E2E readback.
        required: false
        default: ""
        type: string
      recovery_plan_digest:
        description: Exact persisted Recovery Plan digest for zero-mutation validation or recovered Workspace E2E readback.
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-resource-verification
  cancel-in-progress: false

jobs:
  prepare-basic-customer-operation:
    name: Prepare one approved Basic customer operation in TKE VPC
    if: ${{ github.ref == 'refs/heads/main' && github.sha == inputs.merged_sha && inputs.operation_mode == 'customer_operation' && inputs.confirm_workspace_purchase && inputs.confirm_single_model_request && ((inputs.funding_mode == 'operator_precharge' && inputs.confirm_account_provision && inputs.confirm_wallet_recharge) || (inputs.funding_mode == 'operator_precharge_recovery' && !inputs.confirm_account_provision && !inputs.confirm_wallet_recharge)) }}
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    timeout-minutes: 40
    environment: production
    env:
      OPL_MERGED_SHA: ${{ inputs.merged_sha }}
      OPL_BASIC_CANARY_APPROVAL_ID: ${{ inputs.approval_id }}
      OPL_BASIC_CANARY_FUNDING_MODE: ${{ inputs.funding_mode }}
      OPL_BASIC_CANARY_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      OPL_BASIC_CANARY_APPROVAL_JSON: ${{ secrets.OPL_BASIC_CANARY_APPROVAL_JSON }}
      OPL_BASIC_CANARY_CUSTOMER_PASSWORD: ${{ secrets.OPL_BASIC_CANARY_CUSTOMER_PASSWORD }}
      OPL_BASIC_CANARY_CONFIRMATION: I_UNDERSTAND_THIS_PROVISIONS_ONE_REAL_BASIC_WORKSPACE_AND_SENDS_ONE_MODEL_REQUEST
      OPL_CONSOLE_ORIGIN: ${{ vars.OPL_CONSOLE_ORIGIN || 'https://cloud.medopl.cn' }}
      OPL_SUB2API_ADMIN_EMAIL: ${{ secrets.OPL_SUB2API_ADMIN_EMAIL }}
      OPL_SUB2API_ADMIN_PASSWORD: ${{ secrets.OPL_SUB2API_ADMIN_PASSWORD }}
      OPL_K8S_NAMESPACE: ${{ vars.OPL_K8S_NAMESPACE || 'opl-cloud' }}
      OPL_VERIFY_REQUEST_TIMEOUT_MS: ${{ vars.OPL_VERIFY_REQUEST_TIMEOUT_MS || '30000' }}
      OPL_VERIFY_LAUNCH_POLL_ATTEMPTS: ${{ vars.OPL_VERIFY_LAUNCH_POLL_ATTEMPTS || '180' }}
      OPL_VERIFY_LAUNCH_POLL_DELAY_MS: ${{ vars.OPL_VERIFY_LAUNCH_POLL_DELAY_MS || '10000' }}
      TENCENT_DEPLOY_KUBECONFIG_PATH: ${{ vars.TENCENT_DEPLOY_KUBECONFIG_PATH || '/home/actions/.secrets/medopl/v22/kubeconfig-package-d-deploy' }}
      TENCENT_DEPLOY_KUBECONFIG_B64: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG_B64 }}
      TENCENT_DEPLOY_KUBECONFIG: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG }}

    steps:
      - name: Prepare isolated source checkout
        id: prepare_source
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ "$OPL_SOURCE_CHECKOUT" != "$expected" ]; then
            echo "Isolated source checkout path mismatch." >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.opl-checkouts"
          mkdir "$OPL_SOURCE_CHECKOUT"

      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merged_sha }}
          fetch-depth: 0

          path: .opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Verify remote branch authority
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          mapfile -t remote_heads < <(git ls-remote --heads origin)
          if [ "${#remote_heads[@]}" -ne 1 ]; then
            printf 'Production source authority requires exactly one remote head; observed: %s\n' "${remote_heads[*]:-none}" >&2
            exit 1
          fi
          read -r remote_main_sha remote_main_ref <<< "${remote_heads[0]}"
          head_sha="$(git rev-parse HEAD)"
          if [ "$remote_main_ref" != "refs/heads/main" ] || [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_SHA" != "$head_sha" ] || [ "$remote_main_sha" != "$head_sha" ]; then
            printf 'Production source must be current main: ref=%s github_sha=%s checkout=%s remote_main=%s\n' \
              "$GITHUB_REF" "$GITHUB_SHA" "$head_sha" "$remote_main_sha" >&2
            exit 1
          fi

      - name: Verify exact origin main
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          if ! [[ "$OPL_MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full merged main SHA is required." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$head_sha" != "$OPL_MERGED_SHA" ] || [ "$main_sha" != "$OPL_MERGED_SHA" ]; then
            echo "Customer operation source is not the exact current origin/main revision." >&2
            exit 1
          fi

      - name: Reject recovered-precharge checkpoint resume
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          case "$OPL_BASIC_CANARY_FUNDING_MODE" in
            operator_precharge)
              ;;
            operator_precharge_recovery)
              if [ -n "$OPL_BASIC_CANARY_RESUME_RUN_ID" ]; then
                echo "Recovered precharge requires an empty resume_run_id." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported Basic canary funding mode." >&2
              exit 1
              ;;
          esac

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare redacted checkpoint and kubeconfig
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          artifact_dir="$RUNNER_TEMP/production-basic-customer-operation"
          mkdir -p "$artifact_dir"
          chmod 700 "$secret_dir" "$artifact_dir"
          kubeconfig="$secret_dir/kubeconfig"
          if [ -f "$TENCENT_DEPLOY_KUBECONFIG_PATH" ]; then
            cp "$TENCENT_DEPLOY_KUBECONFIG_PATH" "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG_B64:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG" > "$kubeconfig"
          else
            echo "No production kubeconfig was provided." >&2
            exit 1
          fi
          chmod 600 "$kubeconfig"
          echo "OPL_BASIC_CANARY_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
          echo "OPL_BASIC_CANARY_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "OPL_BASIC_CANARY_CHECKPOINT_PATH=$artifact_dir/checkpoint.json" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Download prior redacted checkpoint
        if: ${{ inputs.funding_mode == 'operator_precharge' && inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: production-basic-customer-operation
          path: ${{ runner.temp }}/production-basic-customer-operation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Prepare approved Basic customer canary
        id: canary
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          port_forward_pid=""
          cleanup_port_forward() {
            if [ -n "$port_forward_pid" ]; then
              kill "$port_forward_pid" 2>/dev/null || true
              wait "$port_forward_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_port_forward EXIT

          token_b64="$(kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get secret opl-cloud-internal-service -o jsonpath='{.data.OPL_INTERNAL_SERVICE_TOKEN}')"
          if [ -z "$token_b64" ]; then
            echo "Current internal service token is unavailable." >&2
            exit 1
          fi
          OPL_INTERNAL_SERVICE_TOKEN="$(printf '%s' "$token_b64" | base64 -d)"
          unset token_b64
          if [ -z "$OPL_INTERNAL_SERVICE_TOKEN" ]; then
            echo "Current internal service token is empty." >&2
            exit 1
          fi
          echo "::add-mask::$OPL_INTERNAL_SERVICE_TOKEN"
          export OPL_INTERNAL_SERVICE_TOKEN

          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get deployment/opl-cloud-fabric -o json > "$OPL_BASIC_CANARY_SECRET_DIR/fabric-deployment.json"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get replicasets -o json > "$OPL_BASIC_CANARY_SECRET_DIR/fabric-replicasets.json"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get pods -o json > "$OPL_BASIC_CANARY_SECRET_DIR/fabric-pods.json"
          fabric_pod="$(node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.env.OPL_BASIC_CANARY_SECRET_DIR;
          const deployment = JSON.parse(fs.readFileSync(path.join(root, "fabric-deployment.json"), "utf8"));
          const replicaSets = JSON.parse(fs.readFileSync(path.join(root, "fabric-replicasets.json"), "utf8")).items || [];
          const pods = JSON.parse(fs.readFileSync(path.join(root, "fabric-pods.json"), "utf8")).items || [];
          const revisionKey = "deployment.kubernetes.io/revision";
          const revision = deployment.metadata?.annotations?.[revisionKey];
          const deploymentUID = deployment.metadata?.uid;
          const expectedImage = deployment.spec?.template?.spec?.containers?.find((item) => item.name === "fabric")?.image;
          const ownedBy = (item, kind, name, uid) => Boolean(name && uid) && (item.metadata?.ownerReferences || []).some((owner) =>
            owner.controller === true && owner.kind === kind && owner.name === name && owner.uid === uid);
          const currentReplicaSets = replicaSets.filter((item) =>
            ownedBy(item, "Deployment", deployment.metadata?.name, deploymentUID) &&
            item.metadata?.annotations?.[revisionKey] === revision &&
            item.spec?.template?.spec?.containers?.some((container) => container.name === "fabric" && container.image === expectedImage));
          if (!deploymentUID || !revision || !expectedImage || currentReplicaSets.length !== 1) {
            throw new Error(`current_fabric_replicaset_count:${currentReplicaSets.length}`);
          }
          const replicaSet = currentReplicaSets[0];
          const readyPods = pods.filter((item) =>
            !item.metadata?.deletionTimestamp && ownedBy(item, "ReplicaSet", replicaSet.metadata?.name, replicaSet.metadata?.uid) &&
            item.status?.phase === "Running" && item.status?.conditions?.some((condition) => condition.type === "Ready" && condition.status === "True") &&
            item.spec?.containers?.some((container) => container.name === "fabric" && container.image === expectedImage));
          if (readyPods.length !== 1) throw new Error(`current_ready_fabric_pod_count:${readyPods.length}`);
          process.stdout.write(readyPods[0].metadata.name);
          NODE
          )"
          if [ -z "$fabric_pod" ]; then
            echo "Current Ready Fabric Pod is unavailable." >&2
            exit 1
          fi
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" port-forward pod/$fabric_pod 18082:8082 > "$OPL_BASIC_CANARY_SECRET_DIR/fabric-port-forward.log" 2>&1 &
          port_forward_pid=$!
          OPL_FABRIC_INTERNAL_ORIGIN=http://127.0.0.1:18082
          export OPL_FABRIC_INTERNAL_ORIGIN
          port_forward_ready=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$port_forward_pid" 2>/dev/null; then
              break
            fi
            if curl --fail --silent --show-error --max-time 1 "$OPL_FABRIC_INTERNAL_ORIGIN/healthz" >/dev/null; then
              port_forward_ready=1
              break
            fi
            sleep 1
          done
          if [ "$port_forward_ready" != "1" ]; then
            echo "Fabric localhost port-forward did not become ready." >&2
            exit 1
          fi
          case "$OPL_BASIC_CANARY_FUNDING_MODE" in
            operator_precharge)
              funding_flags=(--allow-account-provision --allow-wallet-recharge)
              ;;
            operator_precharge_recovery)
              funding_flags=(--allow-existing-precharge-recovery)
              ;;
            *)
              echo "Unsupported Basic canary funding mode." >&2
              exit 1
              ;;
          esac
          node tools/production-live-qa.ts --basic-customer-canary \
            --phase prepare \
            --funding-mode "$OPL_BASIC_CANARY_FUNDING_MODE" \
            "${funding_flags[@]}" \
            --allow-workspace-purchase \
            --allow-model-write \
            --approval-id "$OPL_BASIC_CANARY_APPROVAL_ID" \
            --run-id "$GITHUB_RUN_ID" > "$OPL_BASIC_CANARY_ARTIFACT_DIR/prepared-evidence.json"

      - name: Upload redacted Basic customer checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-basic-customer-operation
          path: ${{ runner.temp }}/production-basic-customer-operation
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Remove customer operation secrets
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="${OPL_BASIC_CANARY_SECRET_DIR:-}"
          if [ -n "$secret_dir" ] && [ -d "$secret_dir" ]; then
            find "$secret_dir" -mindepth 1 -delete
            rmdir "$secret_dir"
          fi

      - name: Require customer preparation success
        if: ${{ steps.canary.outcome != 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          echo "Basic customer preparation stopped; inspect the redacted checkpoint and evidence artifact." >&2
          exit 1

      - name: Remove isolated source checkout
        if: always() && steps.prepare_source.outcome == 'success'
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          source_dir="${OPL_SOURCE_CHECKOUT:-}"
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ -z "$source_dir" ] || [ "$source_dir" != "$expected" ]; then
            echo "Refusing to remove unexpected source checkout path." >&2
            exit 1
          fi
          if [ -d "$source_dir" ]; then
            find "$source_dir" -mindepth 1 -delete
            rmdir "$source_dir"
          fi

  complete-basic-customer-operation:
    name: Complete one approved Basic customer browser and model check
    needs: prepare-basic-customer-operation
    if: ${{ always() && needs.prepare-basic-customer-operation.result == 'success' && github.ref == 'refs/heads/main' && github.sha == inputs.merged_sha && inputs.operation_mode == 'customer_operation' && inputs.confirm_workspace_purchase && inputs.confirm_single_model_request && ((inputs.funding_mode == 'operator_precharge' && inputs.confirm_account_provision && inputs.confirm_wallet_recharge) || (inputs.funding_mode == 'operator_precharge_recovery' && !inputs.confirm_account_provision && !inputs.confirm_wallet_recharge)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      OPL_MERGED_SHA: ${{ inputs.merged_sha }}
      OPL_BASIC_CANARY_APPROVAL_ID: ${{ inputs.approval_id }}
      OPL_BASIC_CANARY_FUNDING_MODE: ${{ inputs.funding_mode }}
      OPL_BASIC_CANARY_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      OPL_BASIC_CANARY_APPROVAL_JSON: ${{ secrets.OPL_BASIC_CANARY_APPROVAL_JSON }}
      OPL_BASIC_CANARY_CUSTOMER_PASSWORD: ${{ secrets.OPL_BASIC_CANARY_CUSTOMER_PASSWORD }}
      OPL_BASIC_CANARY_CONFIRMATION: I_UNDERSTAND_THIS_PROVISIONS_ONE_REAL_BASIC_WORKSPACE_AND_SENDS_ONE_MODEL_REQUEST
      OPL_CONSOLE_ORIGIN: ${{ vars.OPL_CONSOLE_ORIGIN || 'https://cloud.medopl.cn' }}
      OPL_SUB2API_ADMIN_EMAIL: ${{ secrets.OPL_SUB2API_ADMIN_EMAIL }}
      OPL_SUB2API_ADMIN_PASSWORD: ${{ secrets.OPL_SUB2API_ADMIN_PASSWORD }}
      OPL_VERIFY_REQUEST_TIMEOUT_MS: ${{ vars.OPL_VERIFY_REQUEST_TIMEOUT_MS || '30000' }}
      OPL_VERIFY_USAGE_ATTEMPTS: ${{ vars.OPL_VERIFY_USAGE_ATTEMPTS || '24' }}
      OPL_VERIFY_USAGE_RETRY_DELAY_MS: ${{ vars.OPL_VERIFY_USAGE_RETRY_DELAY_MS || '5000' }}

    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merged_sha }}
          fetch-depth: 0

      - name: Verify exact origin main
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$OPL_MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full merged main SHA is required." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          head_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [ "$head_sha" != "$OPL_MERGED_SHA" ] || [ "$main_sha" != "$OPL_MERGED_SHA" ]; then
            echo "Customer operation source is not the exact current origin/main revision." >&2
            exit 1
          fi

      - name: Reject recovered-precharge checkpoint resume
        shell: bash
        run: |
          set -euo pipefail
          case "$OPL_BASIC_CANARY_FUNDING_MODE" in
            operator_precharge)
              ;;
            operator_precharge_recovery)
              if [ -n "$OPL_BASIC_CANARY_RESUME_RUN_ID" ]; then
                echo "Recovered precharge requires an empty resume_run_id." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported Basic canary funding mode." >&2
              exit 1
              ;;
          esac

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Download prepared customer evidence
        uses: actions/download-artifact@v4
        with:
          name: production-basic-customer-operation
          path: ${{ runner.temp }}/production-basic-customer-operation

      - name: Complete approved Basic customer canary
        id: canary
        continue-on-error: true
        shell: bash
        env:
          OPL_BASIC_CANARY_ARTIFACT_DIR: ${{ runner.temp }}/production-basic-customer-operation
          OPL_BASIC_CANARY_CHECKPOINT_PATH: ${{ runner.temp }}/production-basic-customer-operation/checkpoint.json
        run: |
          set -euo pipefail
          case "$OPL_BASIC_CANARY_FUNDING_MODE" in
            operator_precharge)
              funding_flags=(--allow-account-provision --allow-wallet-recharge)
              ;;
            operator_precharge_recovery)
              funding_flags=(--allow-existing-precharge-recovery)
              ;;
            *)
              echo "Unsupported Basic canary funding mode." >&2
              exit 1
              ;;
          esac
          node tools/production-live-qa.ts --basic-customer-canary \
            --phase complete \
            --prepared-evidence "$OPL_BASIC_CANARY_ARTIFACT_DIR/prepared-evidence.json" \
            --funding-mode "$OPL_BASIC_CANARY_FUNDING_MODE" \
            "${funding_flags[@]}" \
            --allow-workspace-purchase \
            --allow-model-write \
            --approval-id "$OPL_BASIC_CANARY_APPROVAL_ID" \
            --run-id "$GITHUB_RUN_ID" > "$OPL_BASIC_CANARY_ARTIFACT_DIR/evidence.json"

      - name: Upload redacted Basic customer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-basic-customer-operation
          path: ${{ runner.temp }}/production-basic-customer-operation
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Require customer operation success
        if: ${{ steps.canary.outcome != 'success' }}
        shell: bash
        run: |
          echo "Basic customer operation stopped; inspect the redacted checkpoint and evidence artifact." >&2
          exit 1

  workspace-identity-diagnose:
    name: Prove one Workspace owner and reserved Key identity by read-only authority
    if: ${{ github.ref == 'refs/heads/main' && github.sha == inputs.merged_sha && inputs.operation_mode == 'workspace_identity_diagnose' && inputs.workspace_identity_account_id != '' && inputs.workspace_identity_workspace_id != '' && inputs.customer_email != '' && inputs.resume_run_id == '' && !inputs.confirm_account_provision && !inputs.confirm_wallet_recharge && !inputs.confirm_workspace_purchase && !inputs.confirm_single_model_request }}
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    timeout-minutes: 15
    environment: production
    env:
      OPL_MERGED_SHA: ${{ inputs.merged_sha }}
      OPL_WORKSPACE_IDENTITY_ACCOUNT_ID: ${{ inputs.workspace_identity_account_id }}
      OPL_WORKSPACE_IDENTITY_WORKSPACE_ID: ${{ inputs.workspace_identity_workspace_id }}
      OPL_WORKSPACE_IDENTITY_CUSTOMER_EMAIL: ${{ inputs.customer_email }}
      OPL_WORKSPACE_IDENTITY_CUSTOMER_PASSWORD: ${{ secrets.OPL_BASIC_CANARY_CUSTOMER_PASSWORD }}
      OPL_CONSOLE_ORIGIN: ${{ vars.OPL_CONSOLE_ORIGIN || 'https://cloud.medopl.cn' }}
      OPL_SUB2API_ADMIN_EMAIL: ${{ secrets.OPL_SUB2API_ADMIN_EMAIL }}
      OPL_SUB2API_ADMIN_PASSWORD: ${{ secrets.OPL_SUB2API_ADMIN_PASSWORD }}
      OPL_VERIFY_REQUEST_TIMEOUT_MS: ${{ vars.OPL_VERIFY_REQUEST_TIMEOUT_MS || '30000' }}

    steps:
      - name: Prepare isolated source checkout
        id: prepare_source
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ "$OPL_SOURCE_CHECKOUT" != "$expected" ]; then
            echo "Isolated source checkout path mismatch." >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.opl-checkouts"
          mkdir "$OPL_SOURCE_CHECKOUT"

      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merged_sha }}
          fetch-depth: 0
          path: .opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Verify remote branch authority
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          mapfile -t remote_heads < <(git ls-remote --heads origin)
          if [ "${#remote_heads[@]}" -ne 1 ]; then
            printf 'Production source authority requires exactly one remote head; observed: %s\n' "${remote_heads[*]:-none}" >&2
            exit 1
          fi
          read -r remote_main_sha remote_main_ref <<< "${remote_heads[0]}"
          head_sha="$(git rev-parse HEAD)"
          if [ "$remote_main_ref" != "refs/heads/main" ] || [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_SHA" != "$head_sha" ] || [ "$remote_main_sha" != "$head_sha" ]; then
            printf 'Production source must be current main: ref=%s github_sha=%s checkout=%s remote_main=%s\n' \
              "$GITHUB_REF" "$GITHUB_SHA" "$head_sha" "$remote_main_sha" >&2
            exit 1
          fi

      - name: Verify exact identity diagnosis source
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          if ! [[ "$OPL_MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full merged main SHA is required." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$OPL_MERGED_SHA" ] || [ "$(git rev-parse refs/remotes/origin/main)" != "$OPL_MERGED_SHA" ]; then
            echo "Workspace identity diagnosis is not the exact current origin/main revision." >&2
            exit 1
          fi

      - name: Validate read-only Workspace identity inputs
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          if ! [[ "$OPL_WORKSPACE_IDENTITY_ACCOUNT_ID" =~ ^acct-[A-Za-z0-9-]+$ ]] ||
             ! [[ "$OPL_WORKSPACE_IDENTITY_WORKSPACE_ID" =~ ^ws-[A-Za-z0-9-]+$ ]] ||
             [ -z "$OPL_WORKSPACE_IDENTITY_CUSTOMER_EMAIL" ] || [ -z "$OPL_WORKSPACE_IDENTITY_CUSTOMER_PASSWORD" ]; then
            echo "Workspace identity diagnosis requires the exact account, Workspace, and protected customer identity." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare redacted Workspace identity artifact
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/production-workspace-identity-diagnosis"
          raw_dir="$RUNNER_TEMP/production-workspace-identity-diagnosis-raw"
          mkdir -p "$artifact_dir" "$raw_dir"
