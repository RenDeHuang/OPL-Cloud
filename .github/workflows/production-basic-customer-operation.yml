            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$OPL_MERGED_SHA" ] || [ "$(git rev-parse refs/remotes/origin/main)" != "$OPL_MERGED_SHA" ]; then
            echo "Recovered Workspace E2E source is not the exact current origin/main revision." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install E2E dependencies
        run: npm ci

      - name: Install E2E browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Download succeeded resource closure evidence
        uses: actions/download-artifact@v4
        with:
          name: production-basic-compute-claim-evidence
          path: ${{ runner.temp }}/recovered-workspace-e2e-handoff
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resource_closure_run_id }}

      - name: Run independently approved recovered Workspace E2E
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/recovered-workspace-e2e-evidence"
          mkdir -p "$artifact_dir"
          chmod 700 "$artifact_dir"
          node tools/production-live-qa.ts --recovered-workspace-e2e \
            --allow-model-write \
            --approval-id "$OPL_RECOVERED_WORKSPACE_E2E_APPROVAL_ID" \
            --continuation-evidence "$RUNNER_TEMP/recovered-workspace-e2e-handoff/workspace-launch-continuation.json" \
            > "$artifact_dir/recovered-workspace-e2e.json"

      - name: Upload redacted recovered Workspace E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-recovered-workspace-e2e-evidence
          path: ${{ runner.temp }}/recovered-workspace-e2e-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 30
