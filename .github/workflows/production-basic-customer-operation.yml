          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { parseProductionBasicAcceptanceBApproval, validateProductionBasicAcceptanceBReadback } from "./tools/production-basic-acceptance-b.ts";
          const evidence = JSON.parse(await readFile(process.env.OPL_PRODUCTION_BASIC_ACCEPTANCE_B_ARTIFACT_PATH, "utf8"));
