            evidence?.rejection?.statusCode !== 409 || evidence?.rejection?.reasonCode !== "workspace_launch_admission_disabled" ||
            evidence?.rejection?.attempts !== 1 || evidence?.pilot?.enabled !== false || evidence?.pilot?.configured !== true ||
            evidence?.pilot?.accountAllowlistCount !== 0 || evidence?.pilot?.packageId !== "basic" || evidence?.pilot?.maxInFlight !== 1 ||
            JSON.stringify(evidence?.mutationCounts) !== JSON.stringify(zero) ||
            digestNames.some((name) => !/^[a-f0-9]{64}$/.test(String(evidence?.authorityDigests?.[name]?.before || "")) ||
              evidence.authorityDigests[name].before !== evidence.authorityDigests[name].after || evidence.authorityDigests[name].match !== true) ||
            /password|secret|token|cookie|csrf|accountId|workspaceId|operationId|balanceUsdMicros/i.test(JSON.stringify(evidence))) {
            throw new Error("controlled Pilot closed validation evidence invalid");
          }
          NODE

      - name: Upload redacted disabled Pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-controlled-pilot-closed-validation
          path: ${{ runner.temp }}/controlled-pilot-closed-validation
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Require disabled Pilot validation success
        if: ${{ steps.validate.outcome != 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          echo "Controlled Pilot closed validation stopped; inspect the redacted artifact." >&2
          exit 1

      - name: Remove isolated source checkout
        if: always() && steps.prepare_source.outcome == 'success'
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          source_dir="${OPL_SOURCE_CHECKOUT:-}"
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ -z "$source_dir" ] || [ "$source_dir" != "$expected" ]; then
            echo "Refusing to remove unexpected source checkout path." >&2
            exit 1
          fi
          if [ -d "$source_dir" ]; then
            find "$source_dir" -mindepth 1 -delete
            rmdir "$source_dir"
          fi

  recovery-plan-operation:
    name: Diagnose, validate, or execute one persisted server-owned Recovery Plan
    if: ${{ github.ref == 'refs/heads/main' && github.sha == inputs.merged_sha && inputs.resume_run_id == '' && !inputs.confirm_account_provision && !inputs.confirm_wallet_recharge && !inputs.confirm_workspace_purchase && !inputs.confirm_single_model_request && ((inputs.operation_mode == 'recovery_plan_diagnose' && inputs.workspace_identity_account_id != '' && inputs.recovery_plan_launch_operation_id != '' && inputs.recovery_plan_id == '' && inputs.recovery_plan_digest == '' && !inputs.confirm_recovery_plan_execute) || (inputs.operation_mode == 'compute_claim_validate' && inputs.recovery_plan_launch_operation_id != '' && inputs.recovery_plan_id != '' && inputs.recovery_plan_digest != '' && !inputs.confirm_recovery_plan_execute) || (inputs.operation_mode == 'recovery_plan_execute' && inputs.recovery_plan_launch_operation_id != '' && inputs.recovery_plan_id != '' && inputs.recovery_plan_digest != '' && inputs.confirm_recovery_plan_execute)) }}
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    timeout-minutes: 40
    environment: production
    env:
      OPL_MERGED_SHA: ${{ inputs.merged_sha }}
      OPL_RECOVERY_PLAN_OPERATION_MODE: ${{ inputs.operation_mode }}
      OPL_RECOVERY_PLAN_ACCOUNT_ID: ${{ inputs.workspace_identity_account_id }}
      OPL_RECOVERY_PLAN_LAUNCH_OPERATION_ID: ${{ inputs.recovery_plan_launch_operation_id }}
      OPL_RECOVERY_PLAN_ID: ${{ inputs.recovery_plan_id }}
      OPL_RECOVERY_PLAN_DIGEST: ${{ inputs.recovery_plan_digest }}
      OPL_CONSOLE_ORIGIN: ${{ vars.OPL_CONSOLE_ORIGIN || 'https://cloud.medopl.cn' }}
      OPL_SUB2API_ADMIN_EMAIL: ${{ secrets.OPL_SUB2API_ADMIN_EMAIL }}
      OPL_SUB2API_ADMIN_PASSWORD: ${{ secrets.OPL_SUB2API_ADMIN_PASSWORD }}
      OPL_VERIFY_REQUEST_TIMEOUT_MS: ${{ vars.OPL_VERIFY_REQUEST_TIMEOUT_MS || '30000' }}
      OPL_RECOVERY_PLAN_POLL_ATTEMPTS: ${{ vars.OPL_RECOVERY_PLAN_POLL_ATTEMPTS || '180' }}
      OPL_RECOVERY_PLAN_POLL_DELAY_MS: ${{ vars.OPL_RECOVERY_PLAN_POLL_DELAY_MS || '10000' }}

    steps:
      - name: Prepare isolated source checkout
        id: prepare_source
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ "$OPL_SOURCE_CHECKOUT" != "$expected" ]; then
            echo "Isolated source checkout path mismatch." >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.opl-checkouts"
          mkdir "$OPL_SOURCE_CHECKOUT"

      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merged_sha }}
          fetch-depth: 0
          path: .opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Verify remote branch authority
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          mapfile -t remote_heads < <(git ls-remote --heads origin)
          if [ "${#remote_heads[@]}" -ne 1 ]; then
            printf 'Production source authority requires exactly one remote head; observed: %s\n' "${remote_heads[*]:-none}" >&2
            exit 1
          fi
          read -r remote_main_sha remote_main_ref <<< "${remote_heads[0]}"
          head_sha="$(git rev-parse HEAD)"
          if [ "$remote_main_ref" != "refs/heads/main" ] || [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_SHA" != "$head_sha" ] || [ "$remote_main_sha" != "$head_sha" ]; then
            printf 'Production source must be current main: ref=%s github_sha=%s checkout=%s remote_main=%s\n' \
              "$GITHUB_REF" "$GITHUB_SHA" "$head_sha" "$remote_main_sha" >&2
            exit 1
          fi

      - name: Verify exact Recovery Plan source and inputs
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          if ! [[ "$OPL_MERGED_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! [[ "$OPL_RECOVERY_PLAN_LAUNCH_OPERATION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$ ]]; then
            echo "Recovery Plan operation requires the exact current main and original Launch identity." >&2
            exit 1
          fi
          case "$OPL_RECOVERY_PLAN_OPERATION_MODE" in
            recovery_plan_diagnose)
              if ! [[ "$OPL_RECOVERY_PLAN_ACCOUNT_ID" =~ ^acct-[A-Za-z0-9-]+$ ]] || [ -n "$OPL_RECOVERY_PLAN_ID" ] || [ -n "$OPL_RECOVERY_PLAN_DIGEST" ]; then
                echo "Recovery Plan diagnosis requires one account and no caller-supplied Plan identity." >&2
                exit 1
              fi
              grep -Fq 'recovery-plan/diagnose' tools/production-live-qa.ts
              ;;
            compute_claim_validate|recovery_plan_execute)
              if ! [[ "$OPL_RECOVERY_PLAN_ID" =~ ^recovery-plan-[a-f0-9]{20}$ ]] ||
                 ! [[ "$OPL_RECOVERY_PLAN_DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
                echo "Recovery Plan validation and execution require the exact persisted Plan identity." >&2
                exit 1
              fi
              grep -Fq 'recovery-plan/validate' tools/production-live-qa.ts
              if [ "$OPL_RECOVERY_PLAN_OPERATION_MODE" = "recovery_plan_execute" ]; then
                grep -Fq 'CONTINUE_RECOVERY_PLAN' tools/production-live-qa.ts
                grep -Fq 'recovery-plan/execute' tools/production-live-qa.ts
              fi
              ;;
            *) echo "Unsupported Recovery Plan operation mode." >&2; exit 1 ;;
          esac

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare redacted Recovery Plan operation artifact
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/production-recovery-plan-operation"
          mkdir -p "$artifact_dir"
          chmod 700 "$artifact_dir"
          echo "OPL_RECOVERY_PLAN_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"

      - name: Run exact server-owned Recovery Plan operation
        id: operate
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          case "$OPL_RECOVERY_PLAN_OPERATION_MODE" in
            recovery_plan_diagnose)
              node tools/production-live-qa.ts --recovery-plan-diagnose \
                --account-id "$OPL_RECOVERY_PLAN_ACCOUNT_ID" \
                --launch-operation-id "$OPL_RECOVERY_PLAN_LAUNCH_OPERATION_ID"
              ;;
            compute_claim_validate)
              node tools/production-live-qa.ts --recovery-plan-validate \
                --launch-operation-id "$OPL_RECOVERY_PLAN_LAUNCH_OPERATION_ID" \
                --plan-id "$OPL_RECOVERY_PLAN_ID" \
                --plan-digest "$OPL_RECOVERY_PLAN_DIGEST"
              ;;
            recovery_plan_execute)
              node tools/production-live-qa.ts --recovery-plan-execute \
                --launch-operation-id "$OPL_RECOVERY_PLAN_LAUNCH_OPERATION_ID" \
                --plan-id "$OPL_RECOVERY_PLAN_ID" \
                --plan-digest "$OPL_RECOVERY_PLAN_DIGEST"
              ;;
          esac > "$OPL_RECOVERY_PLAN_ARTIFACT_DIR/recovery-plan-operation.json"


      - name: Require exact redacted Recovery Plan evidence
        if: ${{ steps.operate.outcome == 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const result = JSON.parse(fs.readFileSync(`${process.env.OPL_RECOVERY_PLAN_ARTIFACT_DIR}/recovery-plan-operation.json`, "utf8"));
          const mode = process.env.OPL_RECOVERY_PLAN_OPERATION_MODE;
          const zero = result?.runnerDirectMutationCounts?.sub2api === 0 && result?.runnerDirectMutationCounts?.tencent === 0 &&
            result?.runnerDirectMutationCounts?.kubernetes === 0;
          const common = result?.schemaVersion === 1 && result?.operationMode === mode &&
            /^recovery-plan-[a-f0-9]{20}$/.test(String(result?.planId || "")) &&
            /^[a-f0-9]{64}$/.test(String(result?.planDigest || "")) && Array.isArray(result?.stages) && result.stages.length > 0 &&
            Array.isArray(result?.mismatches) && zero && !/password|secret|token|cookie|cvmInstanceId|nodeName|cloudImageDigest/i.test(JSON.stringify(result));
          const validRead = ["recovery_plan_diagnose", "compute_claim_validate"].includes(mode) && result?.status === "proven" &&
            result?.recoveryEligible === true && result?.errorCode === "none" && result.mismatches.length === 0;
          const counts = result?.controlPlaneExecutionMutationCounts;
          const validExecute = mode === "recovery_plan_execute" && result?.status === "completed" && result?.errorCode === "none" &&
            /^recovery-exec-[A-Za-z0-9-]+$/.test(String(result?.executionId || "")) &&
            /^control-plane-run-[A-Za-z0-9-]+$/.test(String(result?.runId || "")) &&
            typeof result?.url === "string" && result.url.length > 0 && typeof result?.receiptId === "string" && result.receiptId.length > 0 &&
            counts && [counts.sub2api, counts.tencent, counts.kubernetes].every((count) => Number.isSafeInteger(count) && count >= 0);
          if (!common || (!validRead && !validExecute)) {
            console.error(`Recovery Plan operation blocked: ${String(result?.errorCode || "operation_artifact_invalid")}`);
            process.exit(1);
          }
          NODE

      - name: Upload redacted Recovery Plan operation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-recovery-plan-operation
          path: ${{ runner.temp }}/production-recovery-plan-operation
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Require Recovery Plan operation success
        if: ${{ steps.operate.outcome != 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          echo "Recovery Plan operation stopped; inspect the redacted operation artifact." >&2
          exit 1

      - name: Remove isolated source checkout
        if: always() && steps.prepare_source.outcome == 'success'
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          source_dir="${OPL_SOURCE_CHECKOUT:-}"
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ -z "$source_dir" ] || [ "$source_dir" != "$expected" ]; then
            echo "Refusing to remove unexpected source checkout path." >&2
            exit 1
          fi
          if [ -d "$source_dir" ]; then
            find "$source_dir" -mindepth 1 -delete
            rmdir "$source_dir"
          fi


  recovered-workspace-e2e:
    name: Verify one recovered Workspace request on a hosted runner
    if: ${{ github.ref == 'refs/heads/main' && github.sha == inputs.merged_sha && inputs.operation_mode == 'recovered_workspace_e2e' && inputs.approval_id != '' && inputs.recovery_plan_launch_operation_id != '' && inputs.recovery_plan_id != '' && inputs.recovery_plan_digest != '' && inputs.customer_email != '' && inputs.resume_run_id == '' && !inputs.confirm_account_provision && !inputs.confirm_wallet_recharge && !inputs.confirm_workspace_purchase && inputs.confirm_single_model_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      OPL_MERGED_SHA: ${{ inputs.merged_sha }}
      OPL_RECOVERED_WORKSPACE_E2E_APPROVAL_ID: ${{ inputs.approval_id }}
      OPL_RECOVERY_PLAN_LAUNCH_OPERATION_ID: ${{ inputs.recovery_plan_launch_operation_id }}
      OPL_RECOVERY_PLAN_ID: ${{ inputs.recovery_plan_id }}
      OPL_RECOVERY_PLAN_DIGEST: ${{ inputs.recovery_plan_digest }}
      OPL_RECOVERED_WORKSPACE_CUSTOMER_EMAIL: ${{ inputs.customer_email }}
      OPL_RECOVERED_WORKSPACE_CUSTOMER_PASSWORD: ${{ secrets.OPL_BASIC_CANARY_CUSTOMER_PASSWORD }}
      OPL_RECOVERED_WORKSPACE_E2E_CONFIRMATION: CONFIRM_SINGLE_MODEL_REQUEST_FOR_RECOVERED_WORKSPACE
      OPL_RECOVERED_WORKSPACE_EXPECTED_MODEL: ${{ vars.OPL_CODEX_MODEL || 'gpt-5.5' }}
      OPL_CONSOLE_ORIGIN: ${{ vars.OPL_CONSOLE_ORIGIN || 'https://cloud.medopl.cn' }}
      OPL_VERIFY_REQUEST_TIMEOUT_MS: ${{ vars.OPL_VERIFY_REQUEST_TIMEOUT_MS || '30000' }}
      OPL_VERIFY_USAGE_ATTEMPTS: ${{ vars.OPL_VERIFY_USAGE_ATTEMPTS || '24' }}
      OPL_VERIFY_USAGE_RETRY_DELAY_MS: ${{ vars.OPL_VERIFY_USAGE_RETRY_DELAY_MS || '5000' }}
      OPL_VERIFY_BROWSER_TIMEOUT_MS: ${{ vars.OPL_VERIFY_BROWSER_TIMEOUT_MS || '45000' }}
      OPL_VERIFY_MODEL_TIMEOUT_MS: ${{ vars.OPL_VERIFY_MODEL_TIMEOUT_MS || '180000' }}

    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merged_sha }}
          fetch-depth: 0

      - name: Verify exact origin main
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$OPL_MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full merged main SHA is required." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$OPL_MERGED_SHA" ] || [ "$(git rev-parse refs/remotes/origin/main)" != "$OPL_MERGED_SHA" ]; then
            echo "Recovered Workspace E2E source is not the exact current origin/main revision." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install E2E dependencies
        run: npm ci

      - name: Install E2E browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run independently approved recovered Workspace E2E
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/recovered-workspace-e2e-evidence"
          mkdir -p "$artifact_dir"
          chmod 700 "$artifact_dir"
          node tools/production-live-qa.ts --recovered-workspace-e2e \
            --allow-model-write \
            --approval-id "$OPL_RECOVERED_WORKSPACE_E2E_APPROVAL_ID" \
            --launch-operation-id "$OPL_RECOVERY_PLAN_LAUNCH_OPERATION_ID" \
            --recovery-plan-id "$OPL_RECOVERY_PLAN_ID" \
            --recovery-plan-digest "$OPL_RECOVERY_PLAN_DIGEST" \
            > "$artifact_dir/recovered-workspace-e2e.json"

      - name: Upload redacted recovered Workspace E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-recovered-workspace-e2e-evidence
          path: ${{ runner.temp }}/recovered-workspace-e2e-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 30
