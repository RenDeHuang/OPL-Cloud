name: Production Basic Customer Operation

on:
  workflow_dispatch:
    inputs:
      merged_sha:
        description: Exact full SHA currently at origin/main.
        required: true
        type: string
      approval_id:
        description: Exact approval ID for separately authorized customer or model operations; unused by Recovery Plan validation.
        required: false
        default: ""
        type: string
      operation_mode:
        description: Select a customer operation, identity readback, fresh Acceptance, server-owned Recovery Plan validation, Recovery Acceptance canary, or the isolated recovered Workspace E2E.
        required: true
        default: customer_operation
        type: choice
        options:
          - customer_operation
          - workspace_identity_diagnose
          - acceptance_b_account_reconcile
          - acceptance_b_account_prepare
          - recovery_plan_diagnose
          - acceptance_b_fresh_order
          - acceptance_b_fresh_readback
          - compute_claim_validate
          - fabric_ledger_readback
          - compute_pool_head_terminalize
          - recovery_plan_execute
          - recovery_acceptance_canary
          - recovery_acceptance_funding_prepare
          - recovery_acceptance_extra_funding_prepare
          - recovery_acceptance_original_launch
          - controlled_pilot_closed_validate
          - compute_claim_readback
          - recovered_workspace_e2e
      funding_mode:
        description: operator_precharge performs the approved provision and recharge; operator_precharge_recovery reads one approved completed precharge before the purchase.
        required: true
        default: operator_precharge
        type: choice
        options:
          - operator_precharge
          - operator_precharge_recovery
      confirm_account_provision:
        description: "operator_precharge only: approve one real operator account provision. Must be false for operator_precharge_recovery."
        required: true
        default: false
        type: boolean
      confirm_wallet_recharge:
        description: "operator_precharge only: approve one real Sub2API wallet recharge. Must be false for operator_precharge_recovery."
        required: true
        default: false
        type: boolean
      confirm_workspace_purchase:
        description: Approve one real Basic Workspace purchase.
        required: true
        default: false
        type: boolean
      confirm_single_model_request:
        description: Approve one real model request after Runtime readiness.
        required: true
        default: false
        type: boolean
      confirm_recovery_plan_execute:
        description: Approve one exact persisted Recovery Plan continuation for the original Launch operation.
        required: true
        default: false
        type: boolean
      confirm_recovery_acceptance_canary:
        description: Approve one allowlisted Recovery Acceptance canary that only moves the original Launch to manual_review.
        required: true
        default: false
        type: boolean
      confirm_recovery_acceptance_funding:
        description: Approve one read/recover-only reconciliation of the existing Acceptance B wallet operation.
        required: true
        default: false
        type: boolean
      confirm_recovery_acceptance_extra_funding:
        description: Approve one independently authorized extra Recovery Acceptance wallet adjustment; default off.
        required: true
        default: false
        type: boolean
      confirm_recovery_acceptance_original_launch:
        description: Approve one original Launch Recovery Acceptance Basic launch; default off.
        required: true
        default: false
        type: boolean
      resume_run_id:
        description: Optional prior run ID whose redacted checkpoint should be resumed with the same approval.
        required: false
        default: ""
        type: string
      customer_email:
        description: Protected exact customer email for recovered_workspace_e2e verification.
        required: false
        default: ""
        type: string
      workspace_identity_account_id:
        description: Exact non-secret account ID for the read-only Workspace identity receipt.
        required: false
        default: ""
        type: string
      workspace_identity_workspace_id:
        description: Exact non-secret Workspace ID for the read-only Workspace identity receipt.
        required: false
        default: ""
        type: string
      recovery_plan_launch_operation_id:
        description: Exact original Launch operation ID for persisted Recovery Plan validation or recovered Workspace E2E.
        required: false
        default: ""
        type: string
      recovery_plan_id:
        description: Exact persisted Recovery Plan ID for zero-mutation validation or recovered Workspace E2E readback.
        required: false
        default: ""
        type: string
      recovery_plan_digest:
        description: Exact persisted Recovery Plan digest for zero-mutation validation or recovered Workspace E2E readback.
        required: false
        default: ""
        type: string
      recovery_acceptance_account_id:
        description: Exact allowlisted account ID for the Recovery Acceptance canary.
        required: false
        default: ""
        type: string
      recovery_acceptance_launch_operation_id:
        description: Exact original Launch operation ID for the Recovery Acceptance canary.
        required: false
        default: ""
        type: string
      recovery_evidence_run_id:
        description: Exact historical GitHub Actions run containing the redacted compute-claim evidence.
        required: false
        default: ""
        type: string
      recovery_evidence_artifact_id:
        description: Exact GitHub artifact ID owned by the historical evidence run.
        required: false
        default: ""
        type: string
      recovery_evidence_artifact_digest:
        description: Exact sha256 digest returned by GitHub for the historical evidence artifact.
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-resource-verification
  cancel-in-progress: false

jobs:
  customer-canary:
    if: ${{ contains(fromJSON('["customer_operation","workspace_identity_diagnose"]'), inputs.operation_mode) }}
    uses: ./.github/workflows/production-basic-customer-canary.yml
    with:
      merged_sha: ${{ inputs.merged_sha }}
      approval_id: ${{ inputs.approval_id }}
      operation_mode: ${{ inputs.operation_mode }}
      funding_mode: ${{ inputs.funding_mode }}
      confirm_account_provision: ${{ inputs.confirm_account_provision }}
      confirm_wallet_recharge: ${{ inputs.confirm_wallet_recharge }}
      confirm_workspace_purchase: ${{ inputs.confirm_workspace_purchase }}
      confirm_single_model_request: ${{ inputs.confirm_single_model_request }}
      resume_run_id: ${{ inputs.resume_run_id }}
      customer_email: ${{ inputs.customer_email }}
      workspace_identity_account_id: ${{ inputs.workspace_identity_account_id }}
      workspace_identity_workspace_id: ${{ inputs.workspace_identity_workspace_id }}
    secrets: inherit

  acceptance-b:
    if: ${{ contains(fromJSON('["acceptance_b_account_reconcile","acceptance_b_account_prepare","acceptance_b_fresh_order","acceptance_b_fresh_readback","controlled_pilot_closed_validate"]'), inputs.operation_mode) }}
    uses: ./.github/workflows/production-basic-acceptance.yml
    with:
      merged_sha: ${{ inputs.merged_sha }}
      approval_id: ${{ inputs.approval_id }}
      operation_mode: ${{ inputs.operation_mode }}
      confirm_account_provision: ${{ inputs.confirm_account_provision }}
      confirm_wallet_recharge: ${{ inputs.confirm_wallet_recharge }}
      confirm_workspace_purchase: ${{ inputs.confirm_workspace_purchase }}
      confirm_single_model_request: ${{ inputs.confirm_single_model_request }}
      confirm_recovery_plan_execute: ${{ inputs.confirm_recovery_plan_execute }}
      resume_run_id: ${{ inputs.resume_run_id }}
      customer_email: ${{ inputs.customer_email }}
      workspace_identity_account_id: ${{ inputs.workspace_identity_account_id }}
      workspace_identity_workspace_id: ${{ inputs.workspace_identity_workspace_id }}
      recovery_plan_launch_operation_id: ${{ inputs.recovery_plan_launch_operation_id }}
      recovery_plan_id: ${{ inputs.recovery_plan_id }}
      recovery_plan_digest: ${{ inputs.recovery_plan_digest }}
    secrets: inherit

  fabric-operations:
    if: ${{ contains(fromJSON('["compute_pool_head_terminalize","fabric_ledger_readback"]'), inputs.operation_mode) }}
    uses: ./.github/workflows/production-fabric-operations.yml
    with:
      merged_sha: ${{ inputs.merged_sha }}
      approval_id: ${{ inputs.approval_id }}
      operation_mode: ${{ inputs.operation_mode }}
      confirm_account_provision: ${{ inputs.confirm_account_provision }}
      confirm_wallet_recharge: ${{ inputs.confirm_wallet_recharge }}
      confirm_workspace_purchase: ${{ inputs.confirm_workspace_purchase }}
      confirm_single_model_request: ${{ inputs.confirm_single_model_request }}
      confirm_recovery_plan_execute: ${{ inputs.confirm_recovery_plan_execute }}
      confirm_recovery_acceptance_canary: ${{ inputs.confirm_recovery_acceptance_canary }}
      confirm_recovery_acceptance_funding: ${{ inputs.confirm_recovery_acceptance_funding }}
      confirm_recovery_acceptance_extra_funding: ${{ inputs.confirm_recovery_acceptance_extra_funding }}
      confirm_recovery_acceptance_original_launch: ${{ inputs.confirm_recovery_acceptance_original_launch }}
      resume_run_id: ${{ inputs.resume_run_id }}
      customer_email: ${{ inputs.customer_email }}
      workspace_identity_account_id: ${{ inputs.workspace_identity_account_id }}
      workspace_identity_workspace_id: ${{ inputs.workspace_identity_workspace_id }}
      recovery_plan_launch_operation_id: ${{ inputs.recovery_plan_launch_operation_id }}
      recovery_plan_id: ${{ inputs.recovery_plan_id }}
      recovery_plan_digest: ${{ inputs.recovery_plan_digest }}
      recovery_acceptance_account_id: ${{ inputs.recovery_acceptance_account_id }}
      recovery_acceptance_launch_operation_id: ${{ inputs.recovery_acceptance_launch_operation_id }}
      recovery_evidence_run_id: ${{ inputs.recovery_evidence_run_id }}
      recovery_evidence_artifact_id: ${{ inputs.recovery_evidence_artifact_id }}
      recovery_evidence_artifact_digest: ${{ inputs.recovery_evidence_artifact_digest }}
    secrets: inherit

  recovery-acceptance:
    if: ${{ contains(fromJSON('["recovery_acceptance_canary","recovery_acceptance_funding_prepare","recovery_acceptance_extra_funding_prepare","recovery_acceptance_original_launch"]'), inputs.operation_mode) }}
    uses: ./.github/workflows/production-recovery-acceptance.yml
    with:
      merged_sha: ${{ inputs.merged_sha }}
      approval_id: ${{ inputs.approval_id }}
      operation_mode: ${{ inputs.operation_mode }}
      confirm_account_provision: ${{ inputs.confirm_account_provision }}
      confirm_wallet_recharge: ${{ inputs.confirm_wallet_recharge }}
      confirm_workspace_purchase: ${{ inputs.confirm_workspace_purchase }}
      confirm_single_model_request: ${{ inputs.confirm_single_model_request }}
      confirm_recovery_plan_execute: ${{ inputs.confirm_recovery_plan_execute }}
      confirm_recovery_acceptance_canary: ${{ inputs.confirm_recovery_acceptance_canary }}
      confirm_recovery_acceptance_funding: ${{ inputs.confirm_recovery_acceptance_funding }}
      confirm_recovery_acceptance_extra_funding: ${{ inputs.confirm_recovery_acceptance_extra_funding }}
      confirm_recovery_acceptance_original_launch: ${{ inputs.confirm_recovery_acceptance_original_launch }}
      resume_run_id: ${{ inputs.resume_run_id }}
      customer_email: ${{ inputs.customer_email }}
      workspace_identity_account_id: ${{ inputs.workspace_identity_account_id }}
      workspace_identity_workspace_id: ${{ inputs.workspace_identity_workspace_id }}
      recovery_plan_launch_operation_id: ${{ inputs.recovery_plan_launch_operation_id }}
      recovery_plan_id: ${{ inputs.recovery_plan_id }}
      recovery_plan_digest: ${{ inputs.recovery_plan_digest }}
      recovery_acceptance_account_id: ${{ inputs.recovery_acceptance_account_id }}
      recovery_acceptance_launch_operation_id: ${{ inputs.recovery_acceptance_launch_operation_id }}
      recovery_evidence_run_id: ${{ inputs.recovery_evidence_run_id }}
      recovery_evidence_artifact_id: ${{ inputs.recovery_evidence_artifact_id }}
      recovery_evidence_artifact_digest: ${{ inputs.recovery_evidence_artifact_digest }}
    secrets: inherit

  recovery-operations:
    if: ${{ contains(fromJSON('["recovery_plan_diagnose","compute_claim_validate","recovery_plan_execute","compute_claim_readback","recovered_workspace_e2e"]'), inputs.operation_mode) }}
    uses: ./.github/workflows/production-recovery-operations.yml
    with:
      merged_sha: ${{ inputs.merged_sha }}
      approval_id: ${{ inputs.approval_id }}
      operation_mode: ${{ inputs.operation_mode }}
      confirm_account_provision: ${{ inputs.confirm_account_provision }}
      confirm_wallet_recharge: ${{ inputs.confirm_wallet_recharge }}
      confirm_workspace_purchase: ${{ inputs.confirm_workspace_purchase }}
      confirm_single_model_request: ${{ inputs.confirm_single_model_request }}
      confirm_recovery_plan_execute: ${{ inputs.confirm_recovery_plan_execute }}
      resume_run_id: ${{ inputs.resume_run_id }}
      customer_email: ${{ inputs.customer_email }}
      workspace_identity_account_id: ${{ inputs.workspace_identity_account_id }}
      recovery_plan_launch_operation_id: ${{ inputs.recovery_plan_launch_operation_id }}
      recovery_plan_id: ${{ inputs.recovery_plan_id }}
      recovery_plan_digest: ${{ inputs.recovery_plan_digest }}
    secrets: inherit
