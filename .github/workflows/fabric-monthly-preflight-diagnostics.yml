name: Fabric MonthlyPreflight Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-monthly-preflight-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read current Fabric MonthlyPreflight report
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    timeout-minutes: 10
    environment: production
    env:
      OPL_K8S_NAMESPACE: ${{ vars.OPL_K8S_NAMESPACE || 'opl-cloud' }}
      TENCENT_DEPLOY_KUBECONFIG_PATH: ${{ vars.TENCENT_DEPLOY_KUBECONFIG_PATH || '/home/actions/.secrets/medopl/v22/kubeconfig-package-d-deploy' }}
      TENCENT_DEPLOY_KUBECONFIG_B64: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG_B64 }}
      TENCENT_DEPLOY_KUBECONFIG: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG }}

    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Prepare diagnostics kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          artifact_dir="$RUNNER_TEMP/fabric-monthly-preflight-report"
          mkdir -p "$artifact_dir"
          chmod 700 "$secret_dir" "$artifact_dir"
          kubeconfig="$secret_dir/kubeconfig"
          echo "OPL_DIAGNOSTICS_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
          echo "OPL_DIAGNOSTICS_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          if [ -f "$TENCENT_DEPLOY_KUBECONFIG_PATH" ]; then
            cp "$TENCENT_DEPLOY_KUBECONFIG_PATH" "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG_B64:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG" > "$kubeconfig"
          else
            echo "No deploy kubeconfig was provided." >&2
            exit 1
          fi
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Locate current Ready Fabric Pod
        id: fabric
        shell: bash
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get deployment/opl-cloud-fabric -o json > "$OPL_DIAGNOSTICS_SECRET_DIR/deployment.json"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get replicasets -o json > "$OPL_DIAGNOSTICS_SECRET_DIR/replicasets.json"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get pods -o json > "$OPL_DIAGNOSTICS_SECRET_DIR/pods.json"
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.env.OPL_DIAGNOSTICS_SECRET_DIR;
          const deployment = JSON.parse(fs.readFileSync(path.join(root, "deployment.json"), "utf8"));
          const replicaSets = JSON.parse(fs.readFileSync(path.join(root, "replicasets.json"), "utf8")).items || [];
          const pods = JSON.parse(fs.readFileSync(path.join(root, "pods.json"), "utf8")).items || [];
          const revision = deployment.metadata?.annotations?.["deployment.kubernetes.io/revision"];
          const deploymentUID = deployment.metadata?.uid;
          const expectedImage = deployment.spec?.template?.spec?.containers?.find((item) => item.name === "fabric")?.image;
          const owner = (item, kind, name, uid) => (item.metadata?.ownerReferences || []).some((ref) =>
            ref.controller === true && ref.kind === kind && ref.name === name && ref.uid === uid
          );
          const currentReplicaSets = replicaSets.filter((item) =>
            owner(item, "Deployment", deployment.metadata.name, deploymentUID) &&
            item.metadata?.annotations?.["deployment.kubernetes.io/revision"] === revision &&
            item.spec?.template?.spec?.containers?.some((container) => container.name === "fabric" && container.image === expectedImage)
          );
          if (currentReplicaSets.length !== 1) throw new Error(`current_fabric_replicaset_count:${currentReplicaSets.length}`);
          const replicaSet = currentReplicaSets[0];
          const readyPods = pods.filter((item) =>
            !item.metadata?.deletionTimestamp &&
            owner(item, "ReplicaSet", replicaSet.metadata.name, replicaSet.metadata.uid) &&
            item.status?.phase === "Running" &&
            item.status?.conditions?.some((condition) => condition.type === "Ready" && condition.status === "True") &&
            item.spec?.containers?.some((container) => container.name === "fabric" && container.image === expectedImage)
          );
          if (readyPods.length !== 1) throw new Error(`current_ready_fabric_pod_count:${readyPods.length}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `pod=${readyPods[0].metadata.name}\n`);
          NODE

      - name: Read MonthlyPreflight report inside Fabric
        shell: bash
        env:
          FABRIC_POD: ${{ steps.fabric.outputs.pod }}
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" exec -i "$FABRIC_POD" -c fabric -- node - <<'NODE' > "$OPL_DIAGNOSTICS_ARTIFACT_DIR/monthly-preflight-report.json"
          const http = require("node:http");
          const token = process.env.OPL_INTERNAL_SERVICE_TOKEN;
          const zone = process.env.OPL_TENCENT_ZONE;
          if (!token || !zone) throw new Error("fabric_diagnostics_environment_unavailable");
          const endpoint = new URL("http://127.0.0.1:8082/fabric/monthly-preflight-report");
          endpoint.searchParams.set("zone", zone);
          const request = http.get(endpoint, { headers: { Authorization: `Bearer ${token}` } }, (response) => {
            let body = "";
            response.setEncoding("utf8");
            response.on("data", (chunk) => {
              body += chunk;
              if (Buffer.byteLength(body) > 1024 * 1024) request.destroy(new Error("fabric_diagnostics_response_too_large"));
            });
            response.on("end", () => {
              if (response.statusCode !== 200) throw new Error(`fabric_diagnostics_http_${response.statusCode}`);
              const report = JSON.parse(body);
              process.stdout.write(`${JSON.stringify(report, null, 2)}\n`);
            });
          });
          request.setTimeout(120000, () => request.destroy(new Error("fabric_diagnostics_timeout")));
          request.on("error", (error) => {
            process.stderr.write(`${error.message}\n`);
            process.exitCode = 1;
          });
          NODE

      - name: Validate read-only report
        shell: bash
        run: |
          set -euo pipefail
          REPORT_PATH="$OPL_DIAGNOSTICS_ARTIFACT_DIR/monthly-preflight-report.json" node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
          if (report.sub2apiMutationCount !== 0 || report.tencentMutationCount !== 0 || report.kubernetesMutationCount !== 0) {
            throw new Error("fabric_diagnostics_reported_mutation");
          }
          const encoded = JSON.stringify(report);
          for (const forbidden of ["providerRequestId", "providerRequestIds", "rawResponse", "wallet", "userData", "secret", "token"]) {
            if (encoded.toLowerCase().includes(forbidden.toLowerCase())) throw new Error(`fabric_diagnostics_leaked_${forbidden}`);
          }
          const expectedPackages = [{ packageId: "basic", sizeGb: 10 }, { packageId: "pro", sizeGb: 100 }];
          if (!Array.isArray(report.packages) || report.packages.length !== expectedPackages.length) throw new Error("fabric_diagnostics_package_count_invalid");
          for (const [index, expected] of expectedPackages.entries()) {
            const current = report.packages[index];
            if (current.packageId !== expected.packageId || current.sizeGb !== expected.sizeGb || current.status !== "passed") {
              throw new Error(`fabric_monthly_preflight_${expected.packageId}_not_ready`);
            }
          }
          if (report.status !== "passed") throw new Error("fabric_monthly_preflight_not_ready");
          NODE

      - name: Upload MonthlyPreflight report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fabric-monthly-preflight-report
          path: ${{ runner.temp }}/fabric-monthly-preflight-report
          if-no-files-found: error
          retention-days: 14

      - name: Remove diagnostics kubeconfig
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="${OPL_DIAGNOSTICS_SECRET_DIR:-}"
          if [ -n "$secret_dir" ] && [ -d "$secret_dir" ]; then
            find "$secret_dir" -mindepth 1 -delete
            rmdir "$secret_dir"
          fi
