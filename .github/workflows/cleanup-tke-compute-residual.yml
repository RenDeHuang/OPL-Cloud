name: Cleanup TKE Compute Residual

on:
  workflow_dispatch:
    inputs:
      compute_allocation_id:
        description: ComputeAllocation id to clean, for example compute-lh251t.
        required: true
        type: string
      dry_run:
        description: Show targeted resources without deleting them.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: production-resource-verification
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup one residual compute runtime
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    environment: production
    env:
      OPL_K8S_NAMESPACE: ${{ vars.OPL_K8S_NAMESPACE || 'opl-cloud' }}
      TENCENT_DEPLOY_KUBECONFIG_PATH: ${{ vars.TENCENT_DEPLOY_KUBECONFIG_PATH || '/home/actions/.secrets/medopl/v22/kubeconfig-package-d-deploy' }}
      TENCENT_DEPLOY_KUBECONFIG_B64: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG_B64 }}
      TENCENT_DEPLOY_KUBECONFIG: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG }}
      OPL_SYSTEM_COMPUTE_NODE_POOL_ID: ${{ vars.OPL_SYSTEM_COMPUTE_NODE_POOL_ID || 'np-6l4nkdto' }}
      OPL_SYSTEM_COMPUTE_MACHINE_ID: ${{ vars.OPL_SYSTEM_COMPUTE_MACHINE_ID || 'np-6l4nkdto-2cdtm' }}
      OPL_SYSTEM_COMPUTE_NODE_NAME: ${{ vars.OPL_SYSTEM_COMPUTE_NODE_NAME || '10.66.0.42' }}
      OPL_SYSTEM_COMPUTE_MACHINE_TYPE: ${{ vars.OPL_SYSTEM_COMPUTE_MACHINE_TYPE }}
      OPL_SYSTEM_COMPUTE_CVM_ID: ${{ vars.OPL_SYSTEM_COMPUTE_CVM_ID }}
      OPL_BASIC_COMPUTE_NODE_POOL_ID: ${{ vars.OPL_BASIC_COMPUTE_NODE_POOL_ID }}
      OPL_PRO_COMPUTE_NODE_POOL_ID: ${{ vars.OPL_PRO_COMPUTE_NODE_POOL_ID }}
      COMPUTE_ALLOCATION_ID: ${{ inputs.compute_allocation_id }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Prepare kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          chmod 700 "$secret_dir"
          kubeconfig="$secret_dir/kubeconfig"
          if [ -f "$TENCENT_DEPLOY_KUBECONFIG_PATH" ]; then
            cp "$TENCENT_DEPLOY_KUBECONFIG_PATH" "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG_B64:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG" > "$kubeconfig"
          else
            echo "No deploy kubeconfig was provided." >&2
            exit 1
          fi
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Validate target
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$COMPUTE_ALLOCATION_ID" | grep -Eq '^compute-[a-z0-9-]+$'; then
            echo "compute_allocation_id must match ^compute-[a-z0-9-]+$" >&2
            exit 1
          fi
          echo "K8S_RUNTIME_NAME=opl-${COMPUTE_ALLOCATION_ID}" >> "$GITHUB_ENV"

      - name: Show targeted resources
        shell: bash
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get \
            deploy,rs,pod,svc,secret \
            -l "oplcloud.cn/compute-allocation-id=${COMPUTE_ALLOCATION_ID}" \
            -o wide

      - name: Run protected resource check
        shell: bash
        run: |
          set -euo pipefail
          cd services/fabric
          go build -o "$RUNNER_TEMP/opl-tencent-provisioner" ./cmd/opl-tencent-provisioner
          cd ../..
          target_nodes="$(
            kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get pods \
              -l "oplcloud.cn/compute-allocation-id=${COMPUTE_ALLOCATION_ID}" -o json \
              | node -e '
                  const fs = require("node:fs");
                  const payload = JSON.parse(fs.readFileSync(0, "utf8"));
                  const nodes = [...new Set((payload.items || []).map((pod) => pod.spec?.nodeName).filter(Boolean))].sort();
                  process.stdout.write(nodes.join("\n"));
                '
          )"
          if [ -z "$target_nodes" ]; then
            target_nodes="__no_scheduled_node__"
          fi
          while IFS= read -r target_node; do
            protected_resource_check="$(
              TARGET_NODE="$target_node" node -e '
                process.stdout.write(JSON.stringify({
                  action: "protected_resource_check",
                  allocation: { nodeName: process.env.TARGET_NODE === "__no_scheduled_node__" ? "" : process.env.TARGET_NODE }
                }));
              ' | "$RUNNER_TEMP/opl-tencent-provisioner"
            )"
            PROTECTED_RESOURCE_CHECK="$protected_resource_check" node -e '
              const response = JSON.parse(process.env.PROTECTED_RESOURCE_CHECK || "{}");
              if (!response.ok || response.status !== "allowed") process.exit(1);
            '
          done <<< "$target_nodes"

      - name: Delete residual runtime resources
        if: ${{ inputs.dry_run == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" delete \
            "deployment/${K8S_RUNTIME_NAME}" \
            "service/${K8S_RUNTIME_NAME}" \
            "secret/${K8S_RUNTIME_NAME}-env" \
            --ignore-not-found=true
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" delete \
            rs,pod \
            -l "oplcloud.cn/compute-allocation-id=${COMPUTE_ALLOCATION_ID}" \
            --ignore-not-found=true

      - name: Show remaining targeted resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get \
            deploy,rs,pod,svc,secret \
            -l "oplcloud.cn/compute-allocation-id=${COMPUTE_ALLOCATION_ID}" \
            -o wide || true
