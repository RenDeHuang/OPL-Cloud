            echo "Fabric identity evidence returned HTTP $http_status." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const raw = JSON.parse(await readFile(`${process.env.OPL_FABRIC_LEDGER_RAW_ROOT}/identity-response.json`, "utf8"));
          const checks = Array.isArray(raw?.checks) ? raw.checks : [];
          const expectedFields = [
            "fabric.operationId", "fabric.operationIdempotencyKey", "fabric.operationRequestHash",
            "binding.present", "binding.valid", "binding.compatibility", "binding.launchOperationId",
            "binding.idempotencyKey", "binding.targetHash", "binding.requestHash"
          ];
          const digestFields = new Set(["fabric.operationRequestHash", "binding.targetHash", "binding.requestHash"]);
          const checksSchemaValid = checks.length === expectedFields.length && expectedFields.every((field, index) => {
            const check = checks[index];
            if (check?.field !== field || typeof check?.matches !== "boolean") return false;
            if (digestFields.has(field)) {
              return check.expected === undefined && check.actual === undefined &&
                /^[a-f0-9]{64}$/.test(String(check?.expectedDigest || "")) && /^[a-f0-9]{64}$/.test(String(check?.actualDigest || "")) &&
                check.matches === (check.expectedDigest === check.actualDigest);
            }
            return check.expectedDigest === undefined && check.actualDigest === undefined &&
              typeof check?.expected === "string" && check.expected.length > 0 && check.expected === check.expected.trim() &&
              typeof check?.actual === "string" && check.actual.length > 0 && check.actual === check.actual.trim() &&
              check.matches === (check.expected === check.actual);
          });
          const bindingClassifications = new Set(["current", "compute-claim", "request-hash-reconciliation", "known-legacy", "other"]);
          const bindingClassification = bindingClassifications.has(raw?.bindingClassification) ? raw.bindingClassification : "other";
          const bindingDigest = /^[a-f0-9]{64}$/.test(String(raw?.bindingDigest || "")) ? `sha256:${raw.bindingDigest}` : `sha256:${"0".repeat(64)}`;
          const operationIdentityValid = checksSchemaValid && checks.slice(0, 5).every((check) => check.matches === true);
          const bindingIdentityValid = checksSchemaValid && checks.slice(5).every((check) => check.matches === true) &&
            new Set(["current", "compute-claim"]).has(bindingClassification);
          const ledgerRelationships = {
            absent: new Set(["confirmed_zero"]),
            observed: new Set(["confirmed_zero", "nonzero", "unknown"]),
            reserved: new Set(["unknown"]),
            node_reserved: new Set(["unknown"]),
            invalid: new Set(["unknown"])
          };
          const ledgerValid = ledgerRelationships[raw?.mutationLedger]?.has(raw?.mutationLedgerOutcome) === true;
          const ledgerState = Object.hasOwn(ledgerRelationships, raw?.mutationLedger) ? raw.mutationLedger : "invalid";
          const ledgerOutcome = ["confirmed_zero", "nonzero", "unknown"].includes(raw?.mutationLedgerOutcome) ? raw.mutationLedgerOutcome : "unknown";
          const cvmMissing = new Set(["instance", "instance_name", "opl_account_id", "opl_workspace_id", "opl_resource_id", "opl_operation_id"]);
          const nodeMissing = new Set(["node_ownership"]);
          const mutationEvidence = (value, maximum, allowedMissing) => {
            const missing = Array.isArray(value?.missing) ? value.missing : [];
            if (!Number.isInteger(value?.attempted) || value.attempted < 0 || value.attempted > maximum || !Number.isInteger(value?.confirmed) || value.confirmed < 0 ||
              !Number.isInteger(value?.unknown) || value.unknown < 0 || value.confirmed > value.attempted || value.unknown > value.attempted ||
              value.confirmed + value.unknown > value.attempted || new Set(missing).size !== missing.length ||
              missing.some((field) => !allowedMissing.has(field))) return null;
            return { attempted: value.attempted, confirmed: value.confirmed, unknown: value.unknown, missing };
          };
          const cvm = mutationEvidence(raw?.mutationEvidence?.cvm, 5, cvmMissing);
          const node = mutationEvidence(raw?.mutationEvidence?.node, 1, nodeMissing);
          const failureStages = new Set(["", "cvm_pre_read", "cvm_conflict_check", "cvm_mutation_precondition", "cvm_rename_readback", "cvm_tag_readback", "cvm_final_readback", "cvm_provisioner_transport", "cvm_mutation_evidence", "node_pre_cvm_read", "node_pre_read", "node_conflict_check", "node_patch_build", "node_patch_readback", "node_final_readback", "claim_final_readback"]);
          const providerErrorClasses = new Set(["", "client_unavailable", "malformed_readback", "ownership_conflict", "readback_mismatch", "timeout", "iam_rbac", "provider_error", "transport_error", "evidence_incomplete"]);
          const failureStage = failureStages.has(raw?.failureStage) ? raw.failureStage : "invalid";
          const providerErrorClass = providerErrorClasses.has(raw?.providerErrorClass) ? raw.providerErrorClass : "invalid";
          const persistedEvidenceValid = ledgerState === "absent" || ledgerState === "invalid" ? cvm === null && node === null : cvm !== null && node !== null;
          const responseValid = checksSchemaValid && bindingDigest !== `sha256:${"0".repeat(64)}` && ledgerValid && persistedEvidenceValid &&
            failureStage !== "invalid" && providerErrorClass !== "invalid";
          const cvmConfirmed = cvm !== null && cvm.attempted > 0 && cvm.confirmed === cvm.attempted && cvm.unknown === 0 && cvm.missing.length === 0;
          const nodeNotAttempted = node !== null && node.attempted === 0 && node.confirmed === 0 && node.unknown === 0 && node.missing.length === 0;
          const recoveryEligible = responseValid && operationIdentityValid && bindingIdentityValid && ledgerState === "observed" && ledgerOutcome === "nonzero" && cvmConfirmed && nodeNotAttempted;
          const compensationReason = recoveryEligible ? "none" : !responseValid ? "evidence_schema_invalid" :
            !operationIdentityValid ? "fabric_operation_identity_invalid" : bindingClassification === "known-legacy" ? "binding_known_legacy" :
            !bindingIdentityValid ? "binding_other" :
            cvm === null || node === null ? "mutation_evidence_unavailable" : !cvmConfirmed ? "cvm_unconfirmed" :
            !nodeNotAttempted ? "node_attempted" : ledgerState !== "observed" ? "ledger_state_not_observed" : "ledger_outcome_not_nonzero";
          const errorCode = recoveryEligible ? "none" : responseValid ? "operator_compensation_required" : "fabric_identity_evidence_invalid";
          const artifact = {
            schemaVersion: 2,
            operationMode: "fabric_ledger_readback",
            status: responseValid ? "proven" : "blocked",
            recoveryEligible,
            recoveryDisposition: recoveryEligible ? "recoverable_cvm_only" : "operator_compensation_required",
            compensationReason,
            errorCode,
            source: {
              runId: process.env.OPL_RECOVERY_EVIDENCE_RUN_ID,
              artifactId: process.env.OPL_RECOVERY_EVIDENCE_ARTIFACT_ID,
              artifactDigest: process.env.OPL_RECOVERY_EVIDENCE_ARTIFACT_DIGEST,
              headSha: process.env.OPL_RECOVERY_EVIDENCE_HEAD_SHA
            },
            binding: { classification: bindingClassification, digest: bindingDigest },
            identityChecks: expectedFields.map((field, index) => ({ field, matches: checks[index]?.field === field && checks[index]?.matches === true })),
            mutationLedger: ledgerState,
            mutationLedgerOutcome: ledgerState === "absent" ? "unknown" : ledgerOutcome,
            cvm,
            node,
            failureStage,
            providerErrorClass,
            runnerDirectMutationCounts: { sub2api: 0, tencent: 0, kubernetes: 0 },
            verifiedAt: new Date().toISOString()
          };
          await writeFile(`${process.env.OPL_FABRIC_LEDGER_ARTIFACT_DIR}/fabric-ledger-readback.json`, `${JSON.stringify(artifact, null, 2)}\n`, { mode: 0o600 });
          if (artifact.status !== "proven") process.exitCode = 1;
          NODE

      - name: Require exact redacted Fabric ledger evidence
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const artifact = JSON.parse(await readFile(`${process.env.OPL_FABRIC_LEDGER_ARTIFACT_DIR}/fabric-ledger-readback.json`, "utf8"));
          const zero = artifact?.runnerDirectMutationCounts?.sub2api === 0 && artifact?.runnerDirectMutationCounts?.tencent === 0 && artifact?.runnerDirectMutationCounts?.kubernetes === 0;
          const expectedFields = [
            "fabric.operationId", "fabric.operationIdempotencyKey", "fabric.operationRequestHash",
            "binding.present", "binding.valid", "binding.compatibility", "binding.launchOperationId",
            "binding.idempotencyKey", "binding.targetHash", "binding.requestHash"
          ];
          const cvmMissing = new Set(["instance", "instance_name", "opl_account_id", "opl_workspace_id", "opl_resource_id", "opl_operation_id"]);
          const nodeMissing = new Set(["node_ownership"]);
          const mutationEvidenceValid = (value, maximum, allowedMissing) => {
            if (value === null || typeof value !== "object" || Array.isArray(value) ||
              Object.keys(value).sort().join(",") !== "attempted,confirmed,missing,unknown" ||
              !Number.isInteger(value.attempted) || value.attempted < 0 || value.attempted > maximum ||
              !Number.isInteger(value.confirmed) || value.confirmed < 0 || value.confirmed > value.attempted ||
              !Number.isInteger(value.unknown) || value.unknown < 0 || value.unknown > value.attempted ||
              value.confirmed + value.unknown > value.attempted || !Array.isArray(value.missing) ||
              new Set(value.missing).size !== value.missing.length || value.missing.some((field) => !allowedMissing.has(field))) return false;
            return true;
          };
          const cvmValid = mutationEvidenceValid(artifact?.cvm, 5, cvmMissing);
          const nodeValid = mutationEvidenceValid(artifact?.node, 1, nodeMissing);
          const evidencePresenceValid = ["absent", "invalid"].includes(artifact?.mutationLedger) ? artifact?.cvm === null && artifact?.node === null : cvmValid && nodeValid;
          const failureStages = new Set(["", "cvm_pre_read", "cvm_conflict_check", "cvm_mutation_precondition", "cvm_rename_readback", "cvm_tag_readback", "cvm_final_readback", "cvm_provisioner_transport", "cvm_mutation_evidence", "node_pre_cvm_read", "node_pre_read", "node_conflict_check", "node_patch_build", "node_patch_readback", "node_final_readback", "claim_final_readback"]);
          const providerErrorClasses = new Set(["", "client_unavailable", "malformed_readback", "ownership_conflict", "readback_mismatch", "timeout", "iam_rbac", "provider_error", "transport_error", "evidence_incomplete"]);
          const bindingDigestValid = /^sha256:[a-f0-9]{64}$/.test(String(artifact?.binding?.digest || "")) && artifact.binding.digest !== `sha256:${"0".repeat(64)}`;
          const proven = artifact?.status === "proven" && typeof artifact?.recoveryEligible === "boolean" &&
            ["none", "operator_compensation_required"].includes(artifact?.errorCode) &&
            ["recoverable_cvm_only", "operator_compensation_required"].includes(artifact?.recoveryDisposition) &&
            ["none", "fabric_operation_identity_invalid", "binding_known_legacy", "binding_other", "mutation_evidence_unavailable", "cvm_unconfirmed", "node_attempted", "ledger_state_not_observed", "ledger_outcome_not_nonzero"].includes(artifact?.compensationReason) &&
            /^[1-9][0-9]*$/.test(String(artifact?.source?.runId || "")) && /^[1-9][0-9]*$/.test(String(artifact?.source?.artifactId || "")) &&
            /^sha256:[a-f0-9]{64}$/.test(String(artifact?.source?.artifactDigest || "")) && /^[a-f0-9]{40}$/.test(String(artifact?.source?.headSha || "")) &&
            ["current", "compute-claim", "request-hash-reconciliation", "known-legacy", "other"].includes(artifact?.binding?.classification) && bindingDigestValid &&
            Array.isArray(artifact?.identityChecks) && artifact.identityChecks.length === expectedFields.length &&
            expectedFields.every((field, index) => artifact.identityChecks[index]?.field === field && typeof artifact.identityChecks[index]?.matches === "boolean") &&
            ["absent", "reserved", "node_reserved", "observed", "invalid"].includes(artifact?.mutationLedger) &&
            ["confirmed_zero", "nonzero", "unknown"].includes(artifact?.mutationLedgerOutcome) && evidencePresenceValid &&
            failureStages.has(artifact?.failureStage) && providerErrorClasses.has(artifact?.providerErrorClass) &&
            (artifact.recoveryEligible ? artifact.errorCode === "none" && artifact.recoveryDisposition === "recoverable_cvm_only" &&
              ["current", "compute-claim"].includes(artifact.binding.classification) && artifact.identityChecks.every((check) => check.matches === true) &&
              artifact.mutationLedger === "observed" && artifact.mutationLedgerOutcome === "nonzero" && cvmValid && nodeValid &&
              artifact.cvm.attempted > 0 && artifact.cvm.confirmed === artifact.cvm.attempted && artifact.cvm.unknown === 0 && artifact.cvm.missing.length === 0 &&
              artifact.node.attempted === 0 && artifact.node.confirmed === 0 && artifact.node.unknown === 0 && artifact.node.missing.length === 0 :
              artifact.errorCode === "operator_compensation_required" && artifact.recoveryDisposition === "operator_compensation_required" && artifact.compensationReason !== "none");
          const blocked = artifact?.status === "blocked" && artifact?.recoveryEligible === false &&
            artifact?.recoveryDisposition === "operator_compensation_required" && artifact?.compensationReason === "fabric_ledger_readback_not_completed" &&
            artifact?.errorCode === "fabric_ledger_readback_not_completed" && artifact?.binding?.classification === "other" &&
            artifact?.binding?.digest === `sha256:${"0".repeat(64)}` && Array.isArray(artifact?.identityChecks) && artifact.identityChecks.length === 0 &&
            artifact?.mutationLedger === "invalid" && artifact?.mutationLedgerOutcome === "unknown" && artifact?.cvm === null && artifact?.node === null &&
            artifact?.failureStage === "" && artifact?.providerErrorClass === "";
          if (artifact?.schemaVersion !== 2 || artifact?.operationMode !== "fabric_ledger_readback" || !zero || (!proven && !blocked) ||
            /password|secret|token|cookie|privateIp|cvmInstanceId|nodeName|machineName|workspaceId|accountId/i.test(JSON.stringify(artifact))) {
            throw new Error("Fabric ledger readback artifact is invalid");
          }
          NODE

      - name: Remove sensitive ledger readback inputs
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          raw_root="${OPL_FABRIC_LEDGER_RAW_ROOT:-}"
          expected="$RUNNER_TEMP/production-fabric-ledger-readback"
          if [ -z "$raw_root" ] || [ "$raw_root" != "$expected" ]; then
            echo "Refusing to remove unexpected ledger readback path." >&2
            exit 1
          fi
          if [ -d "$raw_root" ]; then
            rm -rf -- "$raw_root"
          fi

      - name: Upload redacted Fabric ledger readback
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-fabric-ledger-readback
          path: ${{ runner.temp }}/production-fabric-ledger-readback-artifact
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Require Fabric ledger readback success
        if: ${{ steps.readback.outcome != 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          echo "Fabric ledger readback stopped; inspect the redacted artifact." >&2
          exit 1

      - name: Remove isolated source checkout
        if: always() && steps.prepare_source.outcome == 'success'
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          source_dir="${OPL_SOURCE_CHECKOUT:-}"
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ -z "$source_dir" ] || [ "$source_dir" != "$expected" ]; then
            echo "Refusing to remove unexpected source checkout path." >&2
            exit 1
          fi
          if [ -d "$source_dir" ]; then
            rm -rf -- "$source_dir"
          fi
