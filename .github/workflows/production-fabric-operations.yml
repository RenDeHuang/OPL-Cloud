            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Prepare isolated ledger evidence paths
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          raw_root="$RUNNER_TEMP/production-fabric-ledger-readback"
          artifact_dir="$RUNNER_TEMP/production-fabric-ledger-readback-artifact"
