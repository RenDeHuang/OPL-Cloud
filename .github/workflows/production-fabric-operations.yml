          set -euo pipefail
          if ! [[ "$OPL_MERGED_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! [[ "$OPL_RECOVERY_PLAN_ACCOUNT_ID" =~ ^acct-[A-Za-z0-9-]+$ ]] ||
             ! [[ "$OPL_RECOVERY_PLAN_LAUNCH_OPERATION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$ ]] ||
             ! [[ "$OPL_RECOVERY_EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$OPL_RECOVERY_EVIDENCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$OPL_RECOVERY_EVIDENCE_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] ||
