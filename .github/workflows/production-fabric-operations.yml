          import { writeFile } from "node:fs/promises";
          await writeFile(`${process.env.OPL_FABRIC_LEDGER_ARTIFACT_DIR}/fabric-ledger-readback.json`, `${JSON.stringify({
            schemaVersion: 2,
            operationMode: "fabric_ledger_readback",
            status: "blocked",
            recoveryEligible: false,
            recoveryDisposition: "operator_compensation_required",
            compensationReason: "fabric_ledger_readback_not_completed",
            errorCode: "fabric_ledger_readback_not_completed",
            binding: { classification: "other", digest: "sha256:" + "0".repeat(64) },
            identityChecks: [],
            mutationLedger: "invalid",
            mutationLedgerOutcome: "unknown",
            cvm: null,
            node: null,
            failureStage: "",
            providerErrorClass: "",
            runnerDirectMutationCounts: { sub2api: 0, tencent: 0, kubernetes: 0 }
          }, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Download exact historical compute-claim evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.recovery_evidence_artifact_id }}
          run-id: ${{ inputs.recovery_evidence_run_id }}
          path: ${{ runner.temp }}/production-fabric-ledger-readback/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: true

      - name: Read exact Fabric mutation ledger without provider calls
        id: readback
        continue-on-error: true
        shell: bash
        env:
          GITHUB_READ_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          metadata_path="$OPL_FABRIC_LEDGER_RAW_ROOT/artifact-metadata.json"
          curl --silent --show-error --fail --location \
            -H "Authorization: Bearer $GITHUB_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$OPL_RECOVERY_EVIDENCE_ARTIFACT_ID" \
            --output "$metadata_path"
          run_metadata_path="$OPL_FABRIC_LEDGER_RAW_ROOT/run-metadata.json"
          curl --silent --show-error --fail --location \
            -H "Authorization: Bearer $GITHUB_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$OPL_RECOVERY_EVIDENCE_RUN_ID" \
            --output "$run_metadata_path"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const metadata = JSON.parse(await readFile(`${process.env.OPL_FABRIC_LEDGER_RAW_ROOT}/artifact-metadata.json`, "utf8"));
          const artifactRun = metadata?.workflow_run;
          const run = JSON.parse(await readFile(`${process.env.OPL_FABRIC_LEDGER_RAW_ROOT}/run-metadata.json`, "utf8"));
          if (String(metadata?.id || "") !== process.env.OPL_RECOVERY_EVIDENCE_ARTIFACT_ID ||
            metadata?.name !== "production-basic-compute-claim-evidence" || metadata?.expired !== false ||
            metadata?.digest !== process.env.OPL_RECOVERY_EVIDENCE_ARTIFACT_DIGEST ||
            String(artifactRun?.id || "") !== process.env.OPL_RECOVERY_EVIDENCE_RUN_ID || artifactRun?.head_branch !== "main" ||
            String(artifactRun?.repository_id || "") !== process.env.OPL_GITHUB_REPOSITORY_ID ||
            !/^[a-f0-9]{40}$/.test(String(artifactRun?.head_sha || "")) ||
            String(run?.id || "") !== process.env.OPL_RECOVERY_EVIDENCE_RUN_ID ||
            run?.name !== "Production Basic Customer Operation" || run?.event !== "workflow_dispatch" ||
            run?.head_branch !== "main" || run?.head_sha !== artifactRun.head_sha || run?.status !== "completed" || run?.conclusion !== "failure" ||
            String(run?.repository?.id || "") !== process.env.OPL_GITHUB_REPOSITORY_ID || run?.repository?.full_name !== process.env.GITHUB_REPOSITORY) {
