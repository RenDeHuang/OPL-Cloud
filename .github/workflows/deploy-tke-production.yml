name: Deploy TKE Production

on:
  workflow_dispatch:
    inputs:
      cloud_image:
        description: OPL Cloud control-plane image ref pushed to TCR.
        required: true
        type: string
      workspace_image:
        description: Workspace one-person-lab-app immutable digest. Ordinary deploys must match production; promotion replaces only the default for new Workspaces.
        required: false
        type: string
      workspace_image_current:
        description: Expected current production Workspace digest for an explicit promotion CAS.
        required: false
        type: string
      promote_workspace_image:
        description: Explicitly promote the requested Workspace digest for new Workspaces without restarting existing Workspaces.
        required: false
        default: false
        type: boolean
      workspace_promotion_confirmation:
        description: Exact confirmation required for Workspace image promotion.
        required: false
        default: ""
        type: string
      bootstrap_mode:
        description: Deploy endpoints for read-only Cloud readiness; this cannot complete a release.
        required: false
        default: false
        type: boolean
      diagnostics_only:
        description: Read production TKE state without changing workloads or provider resources.
        required: false
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: production-resource-verification
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read production TKE diagnostics
    if: ${{ inputs.diagnostics_only }}
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    environment: production
    env:
      OPL_K8S_NAMESPACE: ${{ vars.OPL_K8S_NAMESPACE || 'opl-cloud' }}
      TENCENT_DEPLOY_KUBECONFIG_PATH: ${{ vars.TENCENT_DEPLOY_KUBECONFIG_PATH || '/home/actions/.secrets/medopl/v22/kubeconfig-package-d-deploy' }}
      TENCENT_DEPLOY_KUBECONFIG_B64: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG_B64 }}
      TENCENT_DEPLOY_KUBECONFIG: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG }}

    steps:
      - name: Prepare diagnostics kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          echo "OPL_DIAGNOSTICS_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
          chmod 700 "$secret_dir"
          kubeconfig="$secret_dir/kubeconfig"
          if [ -f "$TENCENT_DEPLOY_KUBECONFIG_PATH" ]; then
            cp "$TENCENT_DEPLOY_KUBECONFIG_PATH" "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG_B64:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG" > "$kubeconfig"
          else
            echo "No deploy kubeconfig was provided for diagnostics." >&2
            exit 1
          fi
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Read cluster diagnostics
        shell: bash
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$KUBECONFIG" get nodes -o wide
          kubectl --kubeconfig "$KUBECONFIG" describe nodes
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get deploy,rs,pod -o wide
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get events --sort-by=.metadata.creationTimestamp
          for component in control-plane ledger fabric; do
            while IFS= read -r pod; do
              [ -n "$pod" ] || continue
              kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" describe "$pod"
              kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" logs "$pod" --all-containers --tail=200 || true
              kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" logs "$pod" --all-containers --previous --tail=200 || true
            done < <(kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get pod \
              -l "app.kubernetes.io/name=opl-cloud,app.kubernetes.io/component=$component" -o name)
          done

      - name: Remove diagnostics kubeconfig
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="${OPL_DIAGNOSTICS_SECRET_DIR:-}"
          if [ -z "$secret_dir" ]; then
            exit 0
          fi
          case "$secret_dir" in
            "$RUNNER_TEMP"/*|/tmp/*) ;;
            *) echo "Refusing to remove unexpected diagnostics path." >&2; exit 1 ;;
          esac
          if [ -d "$secret_dir" ]; then
            find "$secret_dir" -mindepth 1 -delete
            rmdir "$secret_dir"
          fi

  deploy:
    name: Deploy OPL Cloud to TKE
    if: ${{ !inputs.diagnostics_only && !inputs.promote_workspace_image }}
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    environment: production
    outputs:
      rollback_image_set: ${{ steps.rollback_snapshot.outputs.artifact-id }}
      workspace_image: ${{ steps.deployment_inputs.outputs.workspace_image }}
    env:
      OPL_RUNTIME_PROVIDER: tencent-tke
      OPL_K8S_NAMESPACE: ${{ vars.OPL_K8S_NAMESPACE || 'opl-cloud' }}
      OPL_PUBLIC_URL: ${{ vars.OPL_PUBLIC_URL || 'https://cloud.medopl.cn' }}
      OPL_CONSOLE_DOMAIN: ${{ vars.OPL_CONSOLE_DOMAIN || 'cloud.medopl.cn' }}
      OPL_WORKSPACE_DOMAIN: ${{ vars.OPL_WORKSPACE_DOMAIN || 'workspace.medopl.cn' }}
      OPL_RELEASE_SHA: ${{ github.sha }}
      OPL_CLOUD_IMAGE: ${{ inputs.cloud_image }}
      OPL_WORKSPACE_IMAGE: ${{ inputs.workspace_image }}
      OPL_BOOTSTRAP_MODE: ${{ inputs.bootstrap_mode }}
      OPL_IMAGE_PULL_SECRET_NAME: ${{ vars.OPL_IMAGE_PULL_SECRET_NAME || 'tcr-pull-secret' }}
      OPL_WORKSPACE_STORAGE_CLASS: ${{ vars.OPL_WORKSPACE_STORAGE_CLASS || 'cbs' }}
      OPL_TENCENT_PROVISIONER_BIN: ${{ vars.OPL_TENCENT_PROVISIONER_BIN || '/usr/local/bin/opl-tencent-provisioner' }}
      OPL_TENCENT_ZONE: ${{ vars.OPL_TENCENT_ZONE || 'na-siliconvalley-1' }}
      OPL_CONSOLE_TLS_SECRET_NAME: ${{ vars.OPL_CONSOLE_TLS_SECRET_NAME || 'opl-cloud-console-medopl-cn-tls' }}
      OPL_WORKSPACE_TLS_SECRET_NAME: ${{ vars.OPL_WORKSPACE_TLS_SECRET_NAME || 'opl-cloud-workspace-medopl-cn-tls' }}
      OPL_TLS_SOURCE_NAMESPACE: ${{ vars.OPL_TLS_SOURCE_NAMESPACE || '' }}
      OPL_TLS_SOURCE_SECRET_NAME: ${{ vars.OPL_TLS_SOURCE_SECRET_NAME || '' }}
      OPL_INGRESS_CLASS: ${{ vars.OPL_INGRESS_CLASS || 'qcloud' }}
      OPL_WORKSPACE_WEBUI_PORT: ${{ vars.OPL_WORKSPACE_WEBUI_PORT || '3000' }}
      OPL_WORKSPACE_DATA_DIR: ${{ vars.OPL_WORKSPACE_DATA_DIR || '/data' }}
      OPL_WORKSPACE_PROJECTS_DIR: ${{ vars.OPL_WORKSPACE_PROJECTS_DIR || '/projects' }}
      OPL_MONTHLY_BILLING_WORKER_ENABLED: ${{ inputs.bootstrap_mode && '0' || vars.OPL_MONTHLY_BILLING_WORKER_ENABLED || '1' }}
      OPL_MONTHLY_BILLING_INTERVAL_MS: ${{ vars.OPL_MONTHLY_BILLING_INTERVAL_MS || '3600000' }}
      OPL_WORKSPACE_LAUNCH_WORKER_ENABLED: ${{ inputs.bootstrap_mode && '0' || vars.OPL_WORKSPACE_LAUNCH_WORKER_ENABLED || '1' }}
      OPL_WORKSPACE_LAUNCH_INTERVAL_MS: ${{ vars.OPL_WORKSPACE_LAUNCH_INTERVAL_MS || '10000' }}
      OPL_CONTROLLED_BASIC_PILOT_ENABLED: ${{ vars.OPL_CONTROLLED_BASIC_PILOT_ENABLED || '0' }}
      OPL_CONTROLLED_BASIC_PILOT_ACCOUNT_IDS: ${{ vars.OPL_CONTROLLED_BASIC_PILOT_ACCOUNT_IDS || '' }}
      OPL_CONTROLLED_BASIC_PILOT_MAX_IN_FLIGHT: ${{ vars.OPL_CONTROLLED_BASIC_PILOT_MAX_IN_FLIGHT || '1' }}
      OPL_RECOVERY_ACCEPTANCE_CANARY_ENABLED: ${{ vars.OPL_RECOVERY_ACCEPTANCE_CANARY_ENABLED || '0' }}
      OPL_RECOVERY_ACCEPTANCE_CANARY_ACCOUNT_IDS: ${{ vars.OPL_RECOVERY_ACCEPTANCE_CANARY_ACCOUNT_IDS || '' }}
      OPL_BASIC_COMPUTE_INSTANCE_TYPE: ${{ vars.OPL_BASIC_COMPUTE_INSTANCE_TYPE }}
      OPL_PRO_COMPUTE_INSTANCE_TYPE: ${{ vars.OPL_PRO_COMPUTE_INSTANCE_TYPE }}
      OPL_SYSTEM_COMPUTE_NODE_POOL_ID: ${{ vars.OPL_SYSTEM_COMPUTE_NODE_POOL_ID || 'np-6l4nkdto' }}
      OPL_SYSTEM_COMPUTE_MACHINE_ID: ${{ vars.OPL_SYSTEM_COMPUTE_MACHINE_ID || 'np-6l4nkdto-2cdtm' }}
      OPL_SYSTEM_COMPUTE_NODE_NAME: ${{ vars.OPL_SYSTEM_COMPUTE_NODE_NAME || '10.66.0.42' }}
      OPL_SYSTEM_COMPUTE_MACHINE_TYPE: ${{ vars.OPL_SYSTEM_COMPUTE_MACHINE_TYPE }}
      OPL_SYSTEM_COMPUTE_CVM_ID: ${{ vars.OPL_SYSTEM_COMPUTE_CVM_ID }}
      OPL_BASIC_COMPUTE_NODE_POOL_ID: ${{ vars.OPL_BASIC_COMPUTE_NODE_POOL_ID }}
      OPL_PRO_COMPUTE_NODE_POOL_ID: ${{ vars.OPL_PRO_COMPUTE_NODE_POOL_ID }}
      OPL_BASIC_COMPUTE_NODE_POOL_MAX_REPLICAS: ${{ vars.OPL_BASIC_COMPUTE_NODE_POOL_MAX_REPLICAS }}
      OPL_PRO_COMPUTE_NODE_POOL_MAX_REPLICAS: ${{ vars.OPL_PRO_COMPUTE_NODE_POOL_MAX_REPLICAS }}
      OPL_CODEX_MODEL: ${{ vars.OPL_CODEX_MODEL || 'gpt-5.5' }}
      OPL_CODEX_REASONING_EFFORT: ${{ vars.OPL_CODEX_REASONING_EFFORT || 'xhigh' }}
      OPL_SUB2API_BASE_URL: ${{ vars.OPL_SUB2API_BASE_URL || 'https://gflabtoken.cn' }}
      OPL_SUB2API_REQUEST_TIMEOUT_MS: ${{ vars.OPL_SUB2API_REQUEST_TIMEOUT_MS || '5000' }}
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENT_MUTATION_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENT_MUTATION_SECRET_KEY }}
      TENCENT_MUTATION_IAM_POLICY_DIGEST: ${{ secrets.TENCENT_MUTATION_IAM_POLICY_DIGEST }}
      TENCENTCLOUD_REGION: ${{ vars.TENCENTCLOUD_REGION || 'na-siliconvalley' }}
      TENCENT_DEPLOY_CLUSTER_ID: ${{ vars.TENCENT_DEPLOY_CLUSTER_ID }}
      TENCENT_CVM_SUBNET_ID: ${{ vars.TENCENT_CVM_SUBNET_ID }}
      TENCENT_CVM_SECURITY_GROUP_IDS: ${{ vars.TENCENT_CVM_SECURITY_GROUP_IDS }}
      TENCENT_CVM_SYSTEM_DISK_TYPE: ${{ vars.TENCENT_CVM_SYSTEM_DISK_TYPE || 'CLOUD_BSSD' }}
      TENCENT_CVM_SYSTEM_DISK_SIZE_GB: ${{ vars.TENCENT_CVM_SYSTEM_DISK_SIZE_GB || '50' }}
      RUN_TENCENT_CREATE_RELEASE_EXECUTION: ${{ vars.RUN_TENCENT_CREATE_RELEASE_EXECUTION || '0' }}
      TENCENT_TCR_REGISTRY: ${{ vars.TENCENT_TCR_REGISTRY || 'uswccr.ccs.tencentyun.com' }}
      TENCENT_TCR_NAMESPACE: ${{ vars.TENCENT_TCR_NAMESPACE || 'oplcloud' }}
      TENCENT_TCR_REGION: ${{ vars.TENCENT_TCR_REGION || 'na-siliconvalley' }}
      TENCENT_DEPLOY_KUBECONFIG_REF: /var/run/opl-cloud/kubeconfig/kubeconfig
      TENCENT_DEPLOY_KUBECONFIG_PATH: ${{ vars.TENCENT_DEPLOY_KUBECONFIG_PATH || '/home/actions/.secrets/medopl/v22/kubeconfig-package-d-deploy' }}
      TENCENT_DEPLOY_KUBECONFIG_B64: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG_B64 }}
      TENCENT_DEPLOY_KUBECONFIG: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPL_SUB2API_ADMIN_EMAIL: ${{ secrets.OPL_SUB2API_ADMIN_EMAIL }}
      OPL_SUB2API_ADMIN_PASSWORD: ${{ secrets.OPL_SUB2API_ADMIN_PASSWORD }}
      OPL_INTERNAL_SERVICE_TOKEN: ${{ secrets.OPL_INTERNAL_SERVICE_TOKEN }}
      OPL_AIONUI_ADMIN_PASSWORD_SEED: ${{ secrets.OPL_AIONUI_ADMIN_PASSWORD_SEED }}
      OPL_RECOVERY_ACCEPTANCE_CANARY_APPROVAL_JSON: ${{ secrets.OPL_RECOVERY_ACCEPTANCE_CANARY_APPROVAL_JSON }}
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
      OPL_TLS_CERT_ID: ${{ secrets.OPL_TLS_CERT_ID || vars.OPL_TLS_CERT_ID || '' }}
      OPL_CONSOLE_TLS_CERT_ID: ${{ secrets.OPL_CONSOLE_TLS_CERT_ID || vars.OPL_CONSOLE_TLS_CERT_ID || '' }}
      OPL_WORKSPACE_TLS_CERT_ID: ${{ secrets.OPL_WORKSPACE_TLS_CERT_ID || vars.OPL_WORKSPACE_TLS_CERT_ID || '' }}

    steps:
      - name: Prepare isolated source checkout
        id: prepare_source
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ "$OPL_SOURCE_CHECKOUT" != "$expected" ]; then
            echo "Isolated source checkout path mismatch." >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.opl-checkouts"
          mkdir "$OPL_SOURCE_CHECKOUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Verify remote branch authority
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          mapfile -t remote_heads < <(git ls-remote --heads origin)
          if [ "${#remote_heads[@]}" -ne 1 ]; then
            printf 'Production source authority requires exactly one remote head; observed: %s\n' "${remote_heads[*]:-none}" >&2
            exit 1
          fi
          read -r remote_main_sha remote_main_ref <<< "${remote_heads[0]}"
          head_sha="$(git rev-parse HEAD)"
          if [ "$remote_main_ref" != "refs/heads/main" ] || [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_SHA" != "$head_sha" ] || [ "$remote_main_sha" != "$head_sha" ]; then
            printf 'Production source must be current main: ref=%s github_sha=%s checkout=%s remote_main=%s\n' \
              "$GITHUB_REF" "$GITHUB_SHA" "$head_sha" "$remote_main_sha" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare kubeconfig
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          echo "OPL_DEPLOY_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
          chmod 700 "$secret_dir"
          kubeconfig="$secret_dir/kubeconfig"
          if [ -f "$TENCENT_DEPLOY_KUBECONFIG_PATH" ]; then
            cp "$TENCENT_DEPLOY_KUBECONFIG_PATH" "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG_B64:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG" > "$kubeconfig"
          else
            echo "No deploy kubeconfig was provided." >&2
            exit 1
          fi
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Check deployment inputs
        id: deployment_inputs
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          required=(
            OPL_RELEASE_SHA
            OPL_CLOUD_IMAGE
            DATABASE_URL
            OPL_SUB2API_ADMIN_EMAIL
            OPL_SUB2API_ADMIN_PASSWORD
            OPL_AIONUI_ADMIN_PASSWORD_SEED
            TCR_USERNAME
            TCR_PASSWORD
            TENCENTCLOUD_SECRET_ID
            TENCENTCLOUD_SECRET_KEY
            TENCENT_MUTATION_IAM_POLICY_DIGEST
            TENCENTCLOUD_REGION
            OPL_TENCENT_ZONE
            OPL_SYSTEM_COMPUTE_NODE_POOL_ID
            OPL_SYSTEM_COMPUTE_MACHINE_ID
            OPL_SYSTEM_COMPUTE_NODE_NAME
            OPL_SYSTEM_COMPUTE_MACHINE_TYPE
            OPL_BASIC_COMPUTE_NODE_POOL_ID
            OPL_PRO_COMPUTE_NODE_POOL_ID
            OPL_BASIC_COMPUTE_NODE_POOL_MAX_REPLICAS
            OPL_PRO_COMPUTE_NODE_POOL_MAX_REPLICAS
            TENCENT_DEPLOY_CLUSTER_ID
            TENCENT_CVM_SUBNET_ID
            TENCENT_CVM_SECURITY_GROUP_IDS
            RUN_TENCENT_CREATE_RELEASE_EXECUTION
          )
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required deploy inputs: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if ! [[ "$OPL_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "OPL_RELEASE_SHA must be the exact canonical main commit." >&2
            exit 1
          fi
          case "$OPL_CONTROLLED_BASIC_PILOT_ENABLED" in
            0) ;;
            1)
              if ! [[ "$OPL_CONTROLLED_BASIC_PILOT_ACCOUNT_IDS" =~ ^[a-z0-9]+(-[a-z0-9]+)*(,[a-z0-9]+(-[a-z0-9]+)*)*$ ]]; then
                echo "Enabled controlled Basic Pilot requires a comma-separated lowercase account allowlist." >&2
                exit 1
              fi
              ;;
            *)
              echo "OPL_CONTROLLED_BASIC_PILOT_ENABLED must be 0 or 1." >&2
              exit 1
              ;;
          esac
          if ! [[ "$OPL_CONTROLLED_BASIC_PILOT_MAX_IN_FLIGHT" =~ ^[1-9][0-9]*$ ]]; then
            echo "OPL_CONTROLLED_BASIC_PILOT_MAX_IN_FLIGHT must be a positive integer." >&2
            exit 1
          fi
          case "$OPL_RECOVERY_ACCEPTANCE_CANARY_ENABLED" in
            0) ;;
            1)
              if ! [[ "$OPL_RECOVERY_ACCEPTANCE_CANARY_ACCOUNT_IDS" =~ ^acct-[A-Za-z0-9][A-Za-z0-9-]*(,acct-[A-Za-z0-9][A-Za-z0-9-]*)*$ ]]; then
                echo "Enabled Recovery Acceptance canary requires a comma-separated acct-* allowlist." >&2
                exit 1
              fi
              if [ -z "${OPL_RECOVERY_ACCEPTANCE_CANARY_APPROVAL_JSON:-}" ]; then
                echo "Enabled Recovery Acceptance canary requires its dedicated approval Secret." >&2
                exit 1
              fi
              ;;
            *)
              echo "OPL_RECOVERY_ACCEPTANCE_CANARY_ENABLED must be 0 or 1." >&2
              exit 1
              ;;
          esac
          case "$OPL_SYSTEM_COMPUTE_MACHINE_TYPE" in
            NativeCVM)
              if ! [[ "${OPL_SYSTEM_COMPUTE_CVM_ID:-}" =~ ^ins-[A-Za-z0-9]+$ ]]; then
                echo "NativeCVM system identity requires a verified ins-* CVM id." >&2
                exit 1
              fi
              ;;
            Native|CXM)
              if [ -n "${OPL_SYSTEM_COMPUTE_CVM_ID:-}" ]; then
                echo "$OPL_SYSTEM_COMPUTE_MACHINE_TYPE system identity must not configure a CVM id." >&2
                exit 1
              fi
              ;;
            *)
              echo "OPL_SYSTEM_COMPUTE_MACHINE_TYPE must be NativeCVM, Native, or CXM." >&2
              exit 1
              ;;
          esac
          validate_image_ref() {
            name="$1"
            image="$2"
            case "$image" in
              "$TENCENT_TCR_REGISTRY"/*) ;;
              *) echo "$name must point to $TENCENT_TCR_REGISTRY." >&2; exit 1 ;;
            esac
            repository="${image%@*}"
            digest="${image#*@}"
            if [ "$repository" = "$image" ] || [[ "${repository##*/}" == *:* ]] || ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "$name must use repository@sha256 with a 64-character digest." >&2
              exit 1
            fi
          }
          validate_image_ref OPL_CLOUD_IMAGE "$OPL_CLOUD_IMAGE"
          requested_workspace_image="${OPL_WORKSPACE_IMAGE:-}"
          current_workspace_image="$(kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get configmap opl-cloud-config \
            --ignore-not-found -o jsonpath='{.data.OPL_WORKSPACE_IMAGE}' 2>/dev/null || true)"
          if [ -z "$current_workspace_image" ]; then
            if [ "$OPL_BOOTSTRAP_MODE" != "true" ]; then
              echo "Current production Workspace image is unavailable from opl-cloud-config." >&2
              exit 1
            fi
            if [ -z "$requested_workspace_image" ]; then
              echo "Bootstrap deploy requires an explicit Workspace image when opl-cloud-config does not exist." >&2
              exit 1
            fi
            current_workspace_image="$requested_workspace_image"
          fi
          validate_image_ref OPL_WORKSPACE_IMAGE "$current_workspace_image"
          if [ -n "$requested_workspace_image" ]; then
            validate_image_ref requested_workspace_image "$requested_workspace_image"
            if [ "$requested_workspace_image" != "$current_workspace_image" ]; then
              echo "requested_workspace_image must match the current production Workspace image." >&2
              exit 1
            fi
          fi
          echo "OPL_WORKSPACE_IMAGE=$current_workspace_image" >> "$GITHUB_ENV"
          echo "workspace_image=$current_workspace_image" >> "$GITHUB_OUTPUT"
          attestation="$OPL_DEPLOY_SECRET_DIR/tencent-predebit-iam-attestation"
          node tools/tencent-predebit-iam-attestation.ts > "$OPL_DEPLOY_SECRET_DIR/tencent-predebit-iam-attestation"
          chmod 600 "$attestation"

      - name: Verify TKE access
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$KUBECONFIG" get ns
          kubectl --kubeconfig "$KUBECONFIG" get storageclass

      - name: Preflight rollout node storage
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          source tools/tke-image-rollout.sh
          preflight_rollout_storage "$OPL_DEPLOY_SECRET_DIR/node-storage-preflight.json"

      - name: Check TLS certificate inputs
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          if [ -n "${OPL_TLS_CERT_ID:-}" ]; then
            exit 0
          fi
          if [ -n "${OPL_CONSOLE_TLS_CERT_ID:-}" ] && [ -n "${OPL_WORKSPACE_TLS_CERT_ID:-}" ]; then
            exit 0
          fi
          if [ -n "${OPL_TLS_SOURCE_NAMESPACE:-}" ] && [ -n "${OPL_TLS_SOURCE_SECRET_NAME:-}" ]; then
            exit 0
          fi
          if kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get secret "$OPL_CONSOLE_TLS_SECRET_NAME" >/dev/null 2>&1 \
            && kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get secret "$OPL_WORKSPACE_TLS_SECRET_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          echo "Missing TKE TLS certificate input: set OPL_TLS_CERT_ID, or set both OPL_CONSOLE_TLS_CERT_ID and OPL_WORKSPACE_TLS_CERT_ID, or set OPL_TLS_SOURCE_NAMESPACE/OPL_TLS_SOURCE_SECRET_NAME." >&2
          exit 1

      - name: Install Kubernetes secrets
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="$OPL_DEPLOY_SECRET_DIR"
          docker_config="$secret_dir/docker-config.json"
          printf '%s' "$DATABASE_URL" > "$secret_dir/database-url"
          printf '%s:%s' "$TCR_USERNAME" "$TCR_PASSWORD" | base64 | tr -d '\n' > "$secret_dir/tcr-auth"
          cat > "$docker_config" <<JSON
          {"auths":{"$TENCENT_TCR_REGISTRY":{"username":"$TCR_USERNAME","password":"$TCR_PASSWORD","auth":"$(cat "$secret_dir/tcr-auth")"}}}
          JSON
          chmod 600 "$secret_dir"/*

          kubectl --kubeconfig "$KUBECONFIG" create namespace "$OPL_K8S_NAMESPACE" --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" create secret generic opl-cloud-database \
            --from-file=DATABASE_URL="$secret_dir/database-url" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -
          if [ -n "${OPL_INTERNAL_SERVICE_TOKEN:-}" ]; then
            printf '%s' "$OPL_INTERNAL_SERVICE_TOKEN" > "$secret_dir/internal-service-token"
          elif kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get secret opl-cloud-internal-service >/dev/null 2>&1; then
            kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get secret opl-cloud-internal-service -o jsonpath='{.data.OPL_INTERNAL_SERVICE_TOKEN}' \
              | base64 -d > "$secret_dir/internal-service-token"
          else
            openssl rand -hex 32 > "$secret_dir/internal-service-token"
          fi
          tr -d '\r\n' < "$secret_dir/internal-service-token" > "$secret_dir/internal-service-token.normalized"
          mv "$secret_dir/internal-service-token.normalized" "$secret_dir/internal-service-token"
          if [ ! -s "$secret_dir/internal-service-token" ]; then
            echo "OPL_INTERNAL_SERVICE_TOKEN must not be empty." >&2
            exit 1
          fi
          chmod 600 "$secret_dir/internal-service-token"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" create secret generic opl-cloud-internal-service \
            --from-file=OPL_INTERNAL_SERVICE_TOKEN="$secret_dir/internal-service-token" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -
          printf '%s' "$OPL_SUB2API_ADMIN_EMAIL" > "$secret_dir/sub2api-admin-email"
          printf '%s' "$OPL_SUB2API_ADMIN_PASSWORD" > "$secret_dir/sub2api-admin-password"
          chmod 600 "$secret_dir/sub2api-admin-email" "$secret_dir/sub2api-admin-password"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" create secret generic opl-cloud-sub2api \
            --from-file=OPL_SUB2API_ADMIN_EMAIL="$secret_dir/sub2api-admin-email" \
            --from-file=OPL_SUB2API_ADMIN_PASSWORD="$secret_dir/sub2api-admin-password" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" create secret generic opl-cloud-deploy-kubeconfig \
            --from-file=kubeconfig="$KUBECONFIG" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -
          printf '%s' "$OPL_AIONUI_ADMIN_PASSWORD_SEED" > "$secret_dir/aionui-admin-password-seed"
          chmod 600 "$secret_dir/aionui-admin-password-seed"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" create secret generic opl-cloud-aionui \
            --from-file=OPL_AIONUI_ADMIN_PASSWORD_SEED="$secret_dir/aionui-admin-password-seed" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -
          printf '%s' "${OPL_RECOVERY_ACCEPTANCE_CANARY_APPROVAL_JSON:-}" > "$secret_dir/recovery-acceptance-canary-approval"
          chmod 600 "$secret_dir/recovery-acceptance-canary-approval"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" create secret generic opl-cloud-recovery-acceptance-canary \
            --from-file=OPL_RECOVERY_ACCEPTANCE_CANARY_APPROVAL_JSON="$secret_dir/recovery-acceptance-canary-approval" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -
          printf '%s' "$TENCENTCLOUD_SECRET_ID" > "$secret_dir/tencentcloud-secret-id"
          printf '%s' "$TENCENTCLOUD_SECRET_KEY" > "$secret_dir/tencentcloud-secret-key"
          chmod 600 "$secret_dir/tencentcloud-secret-id" "$secret_dir/tencentcloud-secret-key"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" create secret generic opl-cloud-tencent-mutation \
            --from-file=TENCENTCLOUD_SECRET_ID="$secret_dir/tencentcloud-secret-id" \
            --from-file=TENCENTCLOUD_SECRET_KEY="$secret_dir/tencentcloud-secret-key" \
            --from-file=OPL_TENCENT_PREDEBIT_IAM_ATTESTATION="$secret_dir/tencent-predebit-iam-attestation" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" create secret generic "$OPL_IMAGE_PULL_SECRET_NAME" \
            --type=kubernetes.io/dockerconfigjson \
            --from-file=.dockerconfigjson="$docker_config" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Install and verify TLS secret
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="$OPL_DEPLOY_SECRET_DIR"

          install_qcloud_cert_secret() {
            secret_name="$1"
            cert_id="$2"
            cert_file="$secret_dir/$secret_name-qcloud-cert-id"
            printf '%s' "$cert_id" > "$cert_file"
            chmod 600 "$cert_file"
            kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" create secret generic "$secret_name" \
              --type=Opaque \
              --from-file=qcloud_cert_id="$cert_file" \
              --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -
          }

          copy_qcloud_cert_secret() {
            source_namespace="$1"
            source_secret="$2"
            target_secret="$3"
            kubectl --kubeconfig "$KUBECONFIG" -n "$source_namespace" get secret "$source_secret" -o json \
              | TARGET_SECRET_NAME="$target_secret" node -e '
                  const fs = require("node:fs");
                  const secret = JSON.parse(fs.readFileSync(0, "utf8"));
                  delete secret.metadata.uid;
                  delete secret.metadata.resourceVersion;
                  delete secret.metadata.creationTimestamp;
                  delete secret.metadata.managedFields;
                  delete secret.metadata.annotations?.["kubectl.kubernetes.io/last-applied-configuration"];
                  secret.metadata.namespace = process.env.OPL_K8S_NAMESPACE;
                  secret.metadata.name = process.env.TARGET_SECRET_NAME;
                  process.stdout.write(JSON.stringify(secret));
                ' \
              | kubectl --kubeconfig "$KUBECONFIG" apply -f -
          }

          verify_qcloud_cert_secret() {
            secret_name="$1"
            secret_type="$(kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get secret "$secret_name" -o jsonpath='{.type}')"
            if [ "$secret_type" != "Opaque" ]; then
              echo "TKE qcloud Ingress TLS secret $secret_name must be type Opaque." >&2
              exit 1
            fi
            kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get secret "$secret_name" -o jsonpath='{.data.qcloud_cert_id}' \
              | base64 -d > "$secret_dir/$secret_name-qcloud-cert-id"
            if [ ! -s "$secret_dir/$secret_name-qcloud-cert-id" ]; then
              echo "TKE qcloud Ingress TLS secret $secret_name must contain qcloud_cert_id." >&2
              exit 1
            fi
          }

          if [ -n "${OPL_TLS_CERT_ID:-}" ]; then
            install_qcloud_cert_secret "$OPL_CONSOLE_TLS_SECRET_NAME" "$OPL_TLS_CERT_ID"
            install_qcloud_cert_secret "$OPL_WORKSPACE_TLS_SECRET_NAME" "$OPL_TLS_CERT_ID"
          elif [ -n "${OPL_CONSOLE_TLS_CERT_ID:-}" ] && [ -n "${OPL_WORKSPACE_TLS_CERT_ID:-}" ]; then
            install_qcloud_cert_secret "$OPL_CONSOLE_TLS_SECRET_NAME" "$OPL_CONSOLE_TLS_CERT_ID"
            install_qcloud_cert_secret "$OPL_WORKSPACE_TLS_SECRET_NAME" "$OPL_WORKSPACE_TLS_CERT_ID"
          elif [ -n "${OPL_TLS_SOURCE_NAMESPACE:-}" ] && [ -n "${OPL_TLS_SOURCE_SECRET_NAME:-}" ]; then
            copy_qcloud_cert_secret "$OPL_TLS_SOURCE_NAMESPACE" "$OPL_TLS_SOURCE_SECRET_NAME" "$OPL_CONSOLE_TLS_SECRET_NAME"
            copy_qcloud_cert_secret "$OPL_TLS_SOURCE_NAMESPACE" "$OPL_TLS_SOURCE_SECRET_NAME" "$OPL_WORKSPACE_TLS_SECRET_NAME"
          elif kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get secret "$OPL_CONSOLE_TLS_SECRET_NAME" >/dev/null 2>&1 \
            && kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get secret "$OPL_WORKSPACE_TLS_SECRET_NAME" >/dev/null 2>&1; then
            echo "Using existing TKE TLS certificate secrets."
          else
            echo "Missing TKE TLS certificate input: set OPL_TLS_CERT_ID, or set both OPL_CONSOLE_TLS_CERT_ID and OPL_WORKSPACE_TLS_CERT_ID, or set OPL_TLS_SOURCE_NAMESPACE/OPL_TLS_SOURCE_SECRET_NAME." >&2
            exit 1
          fi

          verify_qcloud_cert_secret "$OPL_CONSOLE_TLS_SECRET_NAME"
          verify_qcloud_cert_secret "$OPL_WORKSPACE_TLS_SECRET_NAME"

      - name: Capture rollback image set
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          rollback_dir="$OPL_DEPLOY_SECRET_DIR/previous-images"
          mkdir -p "$rollback_dir"
          for item in \
            "opl-cloud-control-plane:control-plane" \
            "opl-cloud-ledger:ledger" \
            "opl-cloud-fabric:fabric"; do
            deployment="${item%%:*}"
            container="${item##*:}"
            kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get "deployment/$deployment" \
              -o "jsonpath={.spec.template.spec.containers[?(@.name=='$container')].image}" > "$rollback_dir/$deployment"
            test -s "$rollback_dir/$deployment"
            kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get "deployment/$deployment" \
              -o json > "$rollback_dir/$deployment.deployment.json"
            test -s "$rollback_dir/$deployment.deployment.json"
          done
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get configmap opl-cloud-config \
            -o json > "$rollback_dir/opl-cloud-config.json"
          test -s "$rollback_dir/opl-cloud-config.json"
          cp "$OPL_DEPLOY_SECRET_DIR/node-storage-preflight.json" "$rollback_dir/node-storage-preflight.json"

      - name: Upload rollback image set
        id: rollback_snapshot
        uses: actions/upload-artifact@v4
        with:
          name: production-rollback-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OPL_DEPLOY_SECRET_DIR }}/previous-images
          if-no-files-found: error
          retention-days: 1

      - name: Render and apply manifest
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          rollback_dir="$OPL_DEPLOY_SECRET_DIR/previous-images"
          for file in opl-cloud-control-plane opl-cloud-ledger opl-cloud-fabric \
            opl-cloud-control-plane.deployment.json opl-cloud-ledger.deployment.json opl-cloud-fabric.deployment.json \
            opl-cloud-config.json node-storage-preflight.json; do
            test -s "$rollback_dir/$file"
          done
          source tools/tke-image-rollout.sh

          node tools/render-tke-manifest.ts --manifest deploy/tke/opl-cloud.k8s.json --out "$OPL_DEPLOY_SECRET_DIR/opl-cloud.ingress-bootstrap.json"
          node tools/render-tke-manifest.ts --manifest deploy/tke/opl-cloud.k8s.json --skip-shared-ingress --out "$OPL_DEPLOY_SECRET_DIR/opl-cloud.rendered.json"
          if ! kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get ingress opl-cloud >/dev/null 2>&1; then
            kubectl --kubeconfig "$KUBECONFIG" apply -f "$OPL_DEPLOY_SECRET_DIR/opl-cloud.ingress-bootstrap.json"
          fi
          kubectl --kubeconfig "$KUBECONFIG" apply -f "$OPL_DEPLOY_SECRET_DIR/opl-cloud.rendered.json"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" annotate ingress opl-cloud ingress.cloud.tencent.com/tke-service-config=opl-cloud-ingress-config --overwrite
          if [ "${OPL_BOOTSTRAP_MODE:-false}" = "true" ]; then
            apply_bootstrap_images
          else
            apply_candidate_images
          fi

      - name: Show ingress target
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get ingress opl-cloud -o wide
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get ingress opl-cloud -o jsonpath='{.status.loadBalancer.ingress[*].ip}{"\n"}'

      - name: Remove deployment secrets
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="${OPL_DEPLOY_SECRET_DIR:-}"
          if [ -z "$secret_dir" ]; then
            exit 0
          fi
          case "$secret_dir" in
            "$RUNNER_TEMP"/*|/tmp/*) ;;
            *) echo "Refusing to remove unexpected deployment secret path." >&2; exit 1 ;;
          esac
          if [ -d "$secret_dir" ]; then
            find "$secret_dir" -mindepth 1 -delete
            rmdir "$secret_dir"
          fi

      - name: Remove isolated source checkout
        if: always() && steps.prepare_source.outcome == 'success'
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          source_dir="${OPL_SOURCE_CHECKOUT:-}"
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ -z "$source_dir" ] || [ "$source_dir" != "$expected" ]; then
            echo "Refusing to remove unexpected source checkout path." >&2
            exit 1
          fi
          if [ -d "$source_dir" ]; then
            find "$source_dir" -mindepth 1 -delete
            rmdir "$source_dir"
          fi

  promote-workspace-image:
    name: Promote Workspace image default
    if: ${{ inputs.promote_workspace_image && !inputs.diagnostics_only && !inputs.bootstrap_mode }}
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    timeout-minutes: 10
    environment: production
    outputs:
      rollback_snapshot: ${{ steps.rollback_snapshot.outputs.artifact-id }}
      workspace_image: ${{ steps.promote.outputs.workspace_image }}
    env:
      OPL_K8S_NAMESPACE: ${{ vars.OPL_K8S_NAMESPACE || 'opl-cloud' }}
      OPL_WORKSPACE_IMAGE: ${{ inputs.workspace_image }}
      OPL_WORKSPACE_IMAGE_CURRENT: ${{ inputs.workspace_image_current }}
      OPL_PROMOTION_CONFIRMATION: ${{ inputs.workspace_promotion_confirmation }}
      TENCENT_TCR_REGISTRY: ${{ vars.TENCENT_TCR_REGISTRY || 'uswccr.ccs.tencentyun.com' }}
      TENCENT_DEPLOY_KUBECONFIG_PATH: ${{ vars.TENCENT_DEPLOY_KUBECONFIG_PATH || '/home/actions/.secrets/medopl/v22/kubeconfig-package-d-deploy' }}
      TENCENT_DEPLOY_KUBECONFIG_B64: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG_B64 }}
      TENCENT_DEPLOY_KUBECONFIG: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG }}

    steps:
      - name: Prepare isolated source checkout
        id: prepare_source
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ "$OPL_SOURCE_CHECKOUT" != "$expected" ]; then
            echo "Isolated source checkout path mismatch." >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.opl-checkouts"
          mkdir "$OPL_SOURCE_CHECKOUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: .opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Verify remote branch authority
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          mapfile -t remote_heads < <(git ls-remote --heads origin)
          if [ "${#remote_heads[@]}" -ne 1 ]; then
            printf 'Production source authority requires exactly one remote head; observed: %s\n' "${remote_heads[*]:-none}" >&2
            exit 1
          fi
          read -r remote_main_sha remote_main_ref <<< "${remote_heads[0]}"
          head_sha="$(git rev-parse HEAD)"
          if [ "$remote_main_ref" != "refs/heads/main" ] || [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_SHA" != "$head_sha" ] || [ "$remote_main_sha" != "$head_sha" ]; then
            printf 'Production source must be current main: ref=%s github_sha=%s checkout=%s remote_main=%s\n' \
              "$GITHUB_REF" "$GITHUB_SHA" "$head_sha" "$remote_main_sha" >&2
            exit 1
          fi

      - name: Prepare promotion kubeconfig
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          echo "OPL_PROMOTION_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
          chmod 700 "$secret_dir"
          kubeconfig="$secret_dir/kubeconfig"
          if [ -f "$TENCENT_DEPLOY_KUBECONFIG_PATH" ]; then
            cp "$TENCENT_DEPLOY_KUBECONFIG_PATH" "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG_B64:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG" > "$kubeconfig"
          else
            echo "No deploy kubeconfig was provided for Workspace image promotion." >&2
            exit 1
          fi
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Verify Workspace image promotion authority
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Workspace image promotion requires refs/heads/main." >&2
            exit 1
          fi
          local_main_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$remote_main_sha" ] || [ "$local_main_sha" != "$remote_main_sha" ]; then
            echo "Workspace image promotion requires an exact merged origin/main checkout." >&2
            exit 1
          fi
          if [ "$OPL_PROMOTION_CONFIRMATION" != "PROMOTE_WORKSPACE_IMAGE" ]; then
            echo "Workspace image promotion requires the exact PROMOTE_WORKSPACE_IMAGE confirmation." >&2
            exit 1
          fi
          validate_image_ref() {
            local name="$1" image="$2"
            case "$image" in "$TENCENT_TCR_REGISTRY"/*) ;; *) echo "$name must point to $TENCENT_TCR_REGISTRY." >&2; exit 1 ;; esac
            local repository="${image%@*}" digest="${image#*@}"
            if [ "$repository" = "$image" ] || [[ "${repository##*/}" == *:* ]] || ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "$name must use repository@sha256 with a 64-character digest." >&2
              exit 1
            fi
          }
          validate_image_ref OPL_WORKSPACE_IMAGE "$OPL_WORKSPACE_IMAGE"
          validate_image_ref OPL_WORKSPACE_IMAGE_CURRENT "$OPL_WORKSPACE_IMAGE_CURRENT"
          if [ "$OPL_WORKSPACE_IMAGE" = "$OPL_WORKSPACE_IMAGE_CURRENT" ]; then
            echo "Workspace image promotion requires a changed immutable digest." >&2
            exit 1
          fi

      - name: Snapshot current Workspace image ConfigMap
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          promotion_dir="$RUNNER_TEMP/workspace-image-promotion"
          mkdir -p "$promotion_dir"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get configmap opl-cloud-config -o json > "$promotion_dir/opl-cloud-config.json"
          CURRENT_EXPECTED="$OPL_WORKSPACE_IMAGE_CURRENT" node - "$promotion_dir/opl-cloud-config.json" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const value = JSON.parse(fs.readFileSync(file, "utf8"));
          if (!value.metadata?.resourceVersion || value.data?.OPL_WORKSPACE_IMAGE !== process.env.CURRENT_EXPECTED) {
            throw new Error("workspace_image_current_CAS_mismatch");
          }
          NODE

      - name: Upload Workspace image promotion rollback snapshot
        id: rollback_snapshot
        uses: actions/upload-artifact@v4
        with:
          name: workspace-image-promotion-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workspace-image-promotion/opl-cloud-config.json
          if-no-files-found: error
          retention-days: 1

      - name: Promote Workspace image default
        id: promote
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          promotion_dir="$RUNNER_TEMP/workspace-image-promotion"
          current_file="$promotion_dir/opl-cloud-config.json"
          candidate_file="$promotion_dir/opl-cloud-config.candidate.json"
          CANDIDATE_IMAGE="$OPL_WORKSPACE_IMAGE" node - "$current_file" "$candidate_file" <<'NODE'
          const fs = require("node:fs");
          const [input, output] = process.argv.slice(2);
          const value = JSON.parse(fs.readFileSync(input, "utf8"));
          value.data = { ...value.data, OPL_WORKSPACE_IMAGE: process.env.CANDIDATE_IMAGE };
          fs.writeFileSync(output, `${JSON.stringify(value)}\n`);
          NODE
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" replace -f "$candidate_file"
          current_workspace_image="$(kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get configmap opl-cloud-config -o jsonpath='{.data.OPL_WORKSPACE_IMAGE}')"
          if [ "$current_workspace_image" != "$OPL_WORKSPACE_IMAGE" ]; then
            echo "Workspace image promotion readback mismatch." >&2
            exit 1
          fi
          echo "workspace_image=$current_workspace_image" >> "$GITHUB_OUTPUT"
          echo "Workspace image promotion complete; rollback snapshot retained; existing Workspace deployments were preserved without restart."

      - name: Remove promotion kubeconfig
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="${OPL_PROMOTION_SECRET_DIR:-}"
          [ -n "$secret_dir" ] || exit 0
          case "$secret_dir" in "$RUNNER_TEMP"/*|/tmp/*) ;; *) echo "Refusing to remove unexpected promotion path." >&2; exit 1 ;; esac
          if [ -d "$secret_dir" ]; then find "$secret_dir" -mindepth 1 -delete; rmdir "$secret_dir"; fi

      - name: Remove isolated source checkout
        if: always() && steps.prepare_source.outcome == 'success'
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          source_dir="${OPL_SOURCE_CHECKOUT:-}"
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ -z "$source_dir" ] || [ "$source_dir" != "$expected" ]; then
            echo "Refusing to remove unexpected source checkout path." >&2
            exit 1
          fi
          if [ -d "$source_dir" ]; then
            find "$source_dir" -mindepth 1 -delete
            rmdir "$source_dir"
          fi

  rollback-workspace-image-promotion:
    name: Roll back failed Workspace image promotion
    needs: [promote-workspace-image]
    if: ${{ always() && needs.promote-workspace-image.outputs.rollback_snapshot != '' && needs.promote-workspace-image.result != 'success' }}
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    timeout-minutes: 10
    environment: production
    env:
      OPL_K8S_NAMESPACE: ${{ vars.OPL_K8S_NAMESPACE || 'opl-cloud' }}
      OPL_WORKSPACE_IMAGE: ${{ inputs.workspace_image }}
      TENCENT_DEPLOY_KUBECONFIG_PATH: ${{ vars.TENCENT_DEPLOY_KUBECONFIG_PATH || '/home/actions/.secrets/medopl/v22/kubeconfig-package-d-deploy' }}
      TENCENT_DEPLOY_KUBECONFIG_B64: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG_B64 }}
      TENCENT_DEPLOY_KUBECONFIG: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG }}
    steps:
      - name: Prepare promotion rollback kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          echo "OPL_PROMOTION_ROLLBACK_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
          chmod 700 "$secret_dir"
          kubeconfig="$secret_dir/kubeconfig"
          if [ -f "$TENCENT_DEPLOY_KUBECONFIG_PATH" ]; then cp "$TENCENT_DEPLOY_KUBECONFIG_PATH" "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG_B64:-}" ]; then printf '%s' "$TENCENT_DEPLOY_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG:-}" ]; then printf '%s' "$TENCENT_DEPLOY_KUBECONFIG" > "$kubeconfig"
          else echo "No deploy kubeconfig was provided for Workspace image promotion rollback." >&2; exit 1; fi
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
      - name: Download Workspace image promotion rollback snapshot
        uses: actions/download-artifact@v4
        with:
          name: workspace-image-promotion-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workspace-image-promotion-rollback
      - name: Restore previous Workspace image ConfigMap
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/workspace-image-promotion-rollback/opl-cloud-config.json"
          current="$RUNNER_TEMP/workspace-image-promotion-rollback/opl-cloud-config.current.json"
          restore="$RUNNER_TEMP/workspace-image-promotion-rollback/opl-cloud-config.restore.json"
          test -s "$snapshot"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get configmap opl-cloud-config -o json > "$current"
          CANDIDATE_IMAGE="$OPL_WORKSPACE_IMAGE" node - "$snapshot" "$current" "$restore" <<'NODE'
          const fs = require("node:fs");
          const [snapshotPath, currentPath, restorePath] = process.argv.slice(2);
          const snapshot = JSON.parse(fs.readFileSync(snapshotPath, "utf8"));
          const current = JSON.parse(fs.readFileSync(currentPath, "utf8"));
          if (!current.metadata?.resourceVersion || current.data?.OPL_WORKSPACE_IMAGE !== process.env.CANDIDATE_IMAGE) {
            throw new Error("workspace_image_promotion_rollback_CAS_mismatch");
          }
          current.data = snapshot.data;
          fs.writeFileSync(restorePath, `${JSON.stringify(current)}\n`);
          NODE
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" replace -f "$restore"
      - name: Remove promotion rollback kubeconfig
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="${OPL_PROMOTION_ROLLBACK_SECRET_DIR:-}"
          [ -n "$secret_dir" ] || exit 0
          case "$secret_dir" in "$RUNNER_TEMP"/*|/tmp/*) ;; *) echo "Refusing to remove unexpected rollback path." >&2; exit 1 ;; esac
          if [ -d "$secret_dir" ]; then find "$secret_dir" -mindepth 1 -delete; rmdir "$secret_dir"; fi

  bootstrap-readiness:
    name: Verify bootstrap Cloud readiness
    needs: deploy
    if: ${{ inputs.bootstrap_mode && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      OPL_CONSOLE_ORIGIN: ${{ vars.OPL_PUBLIC_URL || 'https://cloud.medopl.cn' }}

    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify bootstrap Cloud readiness remains release incomplete
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const origin = process.env.OPL_CONSOLE_ORIGIN.replace(/\/+$/, "");
          const response = await fetch(`${origin}/api/production/readiness`, {
            method: "GET",
            signal: AbortSignal.timeout(30_000)
          });
          const readiness = await response.json();
          if (!response.ok || readiness.cloudImagesReady !== true || readiness.workspaceImagesReady !== false ||
              readiness.immutableImagesReady !== false || readiness.ready !== false) {
            throw new Error("bootstrap_cloud_readiness_invalid");
          }
          console.log(JSON.stringify({ releaseComplete: false, readiness: {
            ready: false,
            cloudImagesReady: true,
            workspaceImagesReady: false,
            immutableImagesReady: false
          }}));
          console.error("Bootstrap Cloud readiness passed; release incomplete.");
          NODE

  verify-rollout-cluster:
    name: Verify ordinary rollout cluster state
    needs: deploy
    if: ${{ !inputs.bootstrap_mode && needs.deploy.result == 'success' }}
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    timeout-minutes: 15
    environment: production
    env:
      OPL_K8S_NAMESPACE: ${{ vars.OPL_K8S_NAMESPACE || 'opl-cloud' }}
      OPL_CLOUD_IMAGE: ${{ inputs.cloud_image }}
      OPL_WORKSPACE_IMAGE: ${{ needs.deploy.outputs.workspace_image }}
      TENCENT_DEPLOY_KUBECONFIG_PATH: ${{ vars.TENCENT_DEPLOY_KUBECONFIG_PATH || '/home/actions/.secrets/medopl/v22/kubeconfig-package-d-deploy' }}
      TENCENT_DEPLOY_KUBECONFIG_B64: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG_B64 }}
      TENCENT_DEPLOY_KUBECONFIG: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG }}

    steps:
      - name: Prepare isolated source checkout
        id: prepare_source
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ "$OPL_SOURCE_CHECKOUT" != "$expected" ]; then
            echo "Isolated source checkout path mismatch." >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.opl-checkouts"
          mkdir "$OPL_SOURCE_CHECKOUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Verify remote branch authority
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          mapfile -t remote_heads < <(git ls-remote --heads origin)
          if [ "${#remote_heads[@]}" -ne 1 ]; then
            printf 'Production source authority requires exactly one remote head; observed: %s\n' "${remote_heads[*]:-none}" >&2
            exit 1
          fi
          read -r remote_main_sha remote_main_ref <<< "${remote_heads[0]}"
          head_sha="$(git rev-parse HEAD)"
          if [ "$remote_main_ref" != "refs/heads/main" ] || [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_SHA" != "$head_sha" ] || [ "$remote_main_sha" != "$head_sha" ]; then
            printf 'Production source must be current main: ref=%s github_sha=%s checkout=%s remote_main=%s\n' \
              "$GITHUB_REF" "$GITHUB_SHA" "$head_sha" "$remote_main_sha" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare cluster verifier kubeconfig
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          echo "OPL_CLUSTER_VERIFY_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
          chmod 700 "$secret_dir"
          kubeconfig="$secret_dir/kubeconfig"
          if [ -f "$TENCENT_DEPLOY_KUBECONFIG_PATH" ]; then
            cp "$TENCENT_DEPLOY_KUBECONFIG_PATH" "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG_B64:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG" > "$kubeconfig"
          else
            echo "No deploy kubeconfig was provided for cluster rollout verification." >&2
            exit 1
          fi
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Verify Cloud image IDs and Workspace digest
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          expected_digest="${OPL_CLOUD_IMAGE#*@}"
          if ! printf '%s' "$expected_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "OPL_CLOUD_IMAGE must use an immutable digest." >&2
            exit 1
          fi
          state_dir="$OPL_CLUSTER_VERIFY_SECRET_DIR/current-revision"
          mkdir -p "$state_dir"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get deployments \
            opl-cloud-control-plane opl-cloud-ledger opl-cloud-fabric -o json > "$state_dir/deployments.json"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get replicasets \
            -l app.kubernetes.io/name=opl-cloud -o json > "$state_dir/replicasets.json"
          kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get pods \
            -l app.kubernetes.io/name=opl-cloud -o json > "$state_dir/pods.json"
          EXPECTED_CLOUD_IMAGE="$OPL_CLOUD_IMAGE" EXPECTED_DIGEST="$expected_digest" \
            node - "$state_dir/deployments.json" "$state_dir/replicasets.json" "$state_dir/pods.json" <<'NODE'
          const fs = require("node:fs");
          const deployments = JSON.parse(fs.readFileSync(process.argv[2], "utf8")).items || [];
          const replicaSets = JSON.parse(fs.readFileSync(process.argv[3], "utf8")).items || [];
          const pods = JSON.parse(fs.readFileSync(process.argv[4], "utf8")).items || [];
          const expected = new Map([
            ["opl-cloud-control-plane", "control-plane"],
            ["opl-cloud-ledger", "ledger"],
            ["opl-cloud-fabric", "fabric"]
          ]);
          const revisionKey = "deployment.kubernetes.io/revision";
          const containerImage = (item, name) =>
            (item.spec?.template?.spec?.containers || []).find((container) => container.name === name)?.image;
          const ownedBy = (item, kind, name, uid) =>
            Boolean(name && uid) && (item.metadata?.ownerReferences || []).some((owner) =>
              owner.controller === true && owner.kind === kind && owner.name === name && owner.uid === uid
            );
          for (const [deploymentName, component] of expected) {
            const deployment = deployments.find((item) => item.metadata?.name === deploymentName);
            if (!deployment) throw new Error(`cluster_verifier_deployment_missing:${deploymentName}`);
            const deploymentUid = String(deployment.metadata?.uid || "");
            const revision = String(deployment.metadata?.annotations?.[revisionKey] || "");
            const desired = Number(deployment.spec?.replicas ?? 1);
            const status = deployment.status || {};
            if (!deploymentUid || !revision || containerImage(deployment, component) !== process.env.EXPECTED_CLOUD_IMAGE) {
              throw new Error(`cluster_verifier_deployment_identity_invalid:${deploymentName}`);
            }
            if (Number(status.observedGeneration || 0) < Number(deployment.metadata?.generation || 0) ||
                Number(status.updatedReplicas || 0) !== desired || Number(status.readyReplicas || 0) !== desired ||
                Number(status.availableReplicas || 0) !== desired || Number(status.unavailableReplicas || 0) !== 0) {
              throw new Error(`cluster_verifier_deployment_not_ready:${deploymentName}`);
            }
            const currentReplicaSets = replicaSets.filter((replicaSet) =>
              ownedBy(replicaSet, "Deployment", deploymentName, deploymentUid) &&
              String(replicaSet.metadata?.annotations?.[revisionKey] || "") === revision &&
              containerImage(replicaSet, component) === process.env.EXPECTED_CLOUD_IMAGE
            );
            if (currentReplicaSets.length !== 1) {
              throw new Error(`cluster_verifier_current_replicaset_invalid:${deploymentName}:${currentReplicaSets.length}`);
            }
            const replicaSet = currentReplicaSets[0];
            const replicaSetName = String(replicaSet.metadata?.name || "");
            const replicaSetUid = String(replicaSet.metadata?.uid || "");
            const currentPods = pods.filter((pod) =>
              !pod.metadata?.deletionTimestamp && ownedBy(pod, "ReplicaSet", replicaSetName, replicaSetUid)
            );
            if (!replicaSetName || !replicaSetUid || currentPods.length !== desired) {
              throw new Error(`cluster_verifier_current_pod_count_invalid:${deploymentName}:${currentPods.length}`);
            }
            for (const pod of currentPods) {
              const ready = (pod.status?.conditions || []).some((condition) =>
                condition.type === "Ready" && condition.status === "True"
              );
              const containerStatus = (pod.status?.containerStatuses || []).find((item) => item.name === component);
              if (!ready || !containerStatus?.ready ||
                  !String(containerStatus.imageID || containerStatus.imageId || "").endsWith(`@${process.env.EXPECTED_DIGEST}`)) {
                throw new Error(`cluster_verifier_current_pod_not_ready:${pod.metadata?.name || deploymentName}`);
              }
            }
          }
          NODE
          current_workspace_image="$(kubectl --kubeconfig "$KUBECONFIG" -n "$OPL_K8S_NAMESPACE" get configmap opl-cloud-config \
            -o jsonpath='{.data.OPL_WORKSPACE_IMAGE}')"
          if [ -z "$OPL_WORKSPACE_IMAGE" ] || [ "$current_workspace_image" != "$OPL_WORKSPACE_IMAGE" ]; then
            echo "Production Workspace digest changed during the Cloud rollout." >&2
            exit 1
          fi

      - name: Remove cluster verifier kubeconfig
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="${OPL_CLUSTER_VERIFY_SECRET_DIR:-}"
          if [ -z "$secret_dir" ]; then
            exit 0
          fi
          case "$secret_dir" in
            "$RUNNER_TEMP"/*|/tmp/*) ;;
            *) echo "Refusing to remove unexpected verifier secret path." >&2; exit 1 ;;
          esac
          if [ -d "$secret_dir" ]; then
            find "$secret_dir" -mindepth 1 -delete
            rmdir "$secret_dir"
          fi

      - name: Remove isolated source checkout
        if: always() && steps.prepare_source.outcome == 'success'
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          source_dir="${OPL_SOURCE_CHECKOUT:-}"
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ -z "$source_dir" ] || [ "$source_dir" != "$expected" ]; then
            echo "Refusing to remove unexpected source checkout path." >&2
            exit 1
          fi
          if [ -d "$source_dir" ]; then
            find "$source_dir" -mindepth 1 -delete
            rmdir "$source_dir"
          fi

  verify-rollout-public-read-only:
    name: Verify ordinary rollout public read-only surfaces
    needs: [deploy, verify-rollout-cluster]
    if: ${{ !inputs.bootstrap_mode && needs.deploy.result == 'success' && needs.verify-rollout-cluster.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      OPL_CONSOLE_ORIGIN: ${{ vars.OPL_PUBLIC_URL || 'https://cloud.medopl.cn' }}
      OPL_SUB2API_ADMIN_EMAIL: ${{ secrets.OPL_SUB2API_ADMIN_EMAIL }}
      OPL_SUB2API_ADMIN_PASSWORD: ${{ secrets.OPL_SUB2API_ADMIN_PASSWORD }}
      OPL_VERIFY_REQUEST_TIMEOUT_MS: "30000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install public verifier dependencies
        run: npm ci

      - name: Install public verifier browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify production public read-only surfaces
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying /api/healthz, /api/production/readiness, source envelopes, retired routes 404, and desktop/mobile Console."
          node tools/production-live-qa.ts --read-only

  release-gate:
    name: Require a completed ordinary release
    needs: [deploy, bootstrap-readiness, verify-rollout-cluster, verify-rollout-public-read-only, rollback-live-qa]
    if: ${{ always() && !inputs.diagnostics_only && !inputs.promote_workspace_image }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Require completed ordinary release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.bootstrap_mode }}" = "true" ]; then
            echo '{"releaseComplete":false,"reason":"bootstrap release incomplete"}' >&2
            exit 1
          fi
          if [ "${{ needs.deploy.result }}" != "success" ]; then
            echo '{"releaseComplete":false,"reason":"ordinary release incomplete"}' >&2
            exit 1
          fi
          if [ "${{ needs.verify-rollout-cluster.result }}" != "success" ] || [ "${{ needs.verify-rollout-public-read-only.result }}" != "success" ] || [ "${{ needs.rollback-live-qa.result }}" != "skipped" ]; then
            echo '{"releaseComplete":false,"reason":"read-only rollout verification incomplete"}' >&2
            exit 1
          fi
          echo '{"releaseComplete":true}'

  capture-rollout-failure:
    name: Capture failed rollout diagnostics
    needs: [deploy, bootstrap-readiness, verify-rollout-cluster, verify-rollout-public-read-only]
    if: ${{ always() && needs.deploy.outputs.rollback_image_set != '' && ((inputs.bootstrap_mode && (needs.deploy.result != 'success' || needs.bootstrap-readiness.result != 'success')) || (!inputs.bootstrap_mode && (needs.deploy.result != 'success' || needs.verify-rollout-cluster.result != 'success' || needs.verify-rollout-public-read-only.result != 'success'))) }}
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    timeout-minutes: 10
    environment: production
    env:
      OPL_K8S_NAMESPACE: ${{ vars.OPL_K8S_NAMESPACE || 'opl-cloud' }}
      TENCENT_DEPLOY_KUBECONFIG_PATH: ${{ vars.TENCENT_DEPLOY_KUBECONFIG_PATH || '/home/actions/.secrets/medopl/v22/kubeconfig-package-d-deploy' }}
      TENCENT_DEPLOY_KUBECONFIG_B64: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG_B64 }}
      TENCENT_DEPLOY_KUBECONFIG: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG }}

    steps:
      - name: Prepare isolated source checkout
        id: prepare_source
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ "$OPL_SOURCE_CHECKOUT" != "$expected" ]; then
            echo "Isolated source checkout path mismatch." >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.opl-checkouts"
          mkdir "$OPL_SOURCE_CHECKOUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Verify remote branch authority
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          mapfile -t remote_heads < <(git ls-remote --heads origin)
          if [ "${#remote_heads[@]}" -ne 1 ]; then
            printf 'Production source authority requires exactly one remote head; observed: %s\n' "${remote_heads[*]:-none}" >&2
            exit 1
          fi
          read -r remote_main_sha remote_main_ref <<< "${remote_heads[0]}"
          head_sha="$(git rev-parse HEAD)"
          if [ "$remote_main_ref" != "refs/heads/main" ] || [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_SHA" != "$head_sha" ] || [ "$remote_main_sha" != "$head_sha" ]; then
            printf 'Production source must be current main: ref=%s github_sha=%s checkout=%s remote_main=%s\n' \
              "$GITHUB_REF" "$GITHUB_SHA" "$head_sha" "$remote_main_sha" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare failure diagnostics kubeconfig
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          echo "OPL_FAILURE_DIAGNOSTICS_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
          chmod 700 "$secret_dir"
          kubeconfig="$secret_dir/kubeconfig"
          if [ -f "$TENCENT_DEPLOY_KUBECONFIG_PATH" ]; then
            cp "$TENCENT_DEPLOY_KUBECONFIG_PATH" "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG_B64:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG" > "$kubeconfig"
          else
            echo "No deploy kubeconfig was provided for failure diagnostics." >&2
            exit 1
          fi
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Capture failed rollout diagnostics
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          diagnostics_dir="$RUNNER_TEMP/production-rollout-diagnostics"
          source tools/tke-image-rollout.sh
          capture_rollout_diagnostics "$diagnostics_dir"

      - name: Upload failed rollout diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: production-rollout-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-rollout-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Remove failure diagnostics kubeconfig
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="${OPL_FAILURE_DIAGNOSTICS_SECRET_DIR:-}"
          if [ -z "$secret_dir" ]; then
            exit 0
          fi
          case "$secret_dir" in
            "$RUNNER_TEMP"/*|/tmp/*) ;;
            *) echo "Refusing to remove unexpected failure diagnostics path." >&2; exit 1 ;;
          esac
          if [ -d "$secret_dir" ]; then
            find "$secret_dir" -mindepth 1 -delete
            rmdir "$secret_dir"
          fi

      - name: Remove isolated source checkout
        if: always() && steps.prepare_source.outcome == 'success'
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          source_dir="${OPL_SOURCE_CHECKOUT:-}"
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ -z "$source_dir" ] || [ "$source_dir" != "$expected" ]; then
            echo "Refusing to remove unexpected source checkout path." >&2
            exit 1
          fi
          if [ -d "$source_dir" ]; then
            find "$source_dir" -mindepth 1 -delete
            rmdir "$source_dir"
          fi

  rollback-live-qa:
    name: Roll back images after deploy failure
    needs: [deploy, bootstrap-readiness, verify-rollout-cluster, verify-rollout-public-read-only, capture-rollout-failure]
    if: ${{ always() && needs.deploy.outputs.rollback_image_set != '' && needs.capture-rollout-failure.result == 'success' }}
    runs-on: [self-hosted, tencent-cloud, opl-cloud, tke-vpc]
    timeout-minutes: 20
    environment: production
    env:
      OPL_K8S_NAMESPACE: ${{ vars.OPL_K8S_NAMESPACE || 'opl-cloud' }}
      TENCENT_DEPLOY_KUBECONFIG_PATH: ${{ vars.TENCENT_DEPLOY_KUBECONFIG_PATH || '/home/actions/.secrets/medopl/v22/kubeconfig-package-d-deploy' }}
      TENCENT_DEPLOY_KUBECONFIG_B64: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG_B64 }}
      TENCENT_DEPLOY_KUBECONFIG: ${{ secrets.TENCENT_DEPLOY_KUBECONFIG }}

    steps:
      - name: Prepare isolated source checkout
        id: prepare_source
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ "$OPL_SOURCE_CHECKOUT" != "$expected" ]; then
            echo "Isolated source checkout path mismatch." >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.opl-checkouts"
          mkdir "$OPL_SOURCE_CHECKOUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Verify remote branch authority
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          mapfile -t remote_heads < <(git ls-remote --heads origin)
          if [ "${#remote_heads[@]}" -ne 1 ]; then
            printf 'Production source authority requires exactly one remote head; observed: %s\n' "${remote_heads[*]:-none}" >&2
            exit 1
          fi
          read -r remote_main_sha remote_main_ref <<< "${remote_heads[0]}"
          head_sha="$(git rev-parse HEAD)"
          if [ "$remote_main_ref" != "refs/heads/main" ] || [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_SHA" != "$head_sha" ] || [ "$remote_main_sha" != "$head_sha" ]; then
            printf 'Production source must be current main: ref=%s github_sha=%s checkout=%s remote_main=%s\n' \
              "$GITHUB_REF" "$GITHUB_SHA" "$head_sha" "$remote_main_sha" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare rollback kubeconfig
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          echo "OPL_ROLLBACK_SECRET_DIR=$secret_dir" >> "$GITHUB_ENV"
          chmod 700 "$secret_dir"
          kubeconfig="$secret_dir/kubeconfig"
          if [ -f "$TENCENT_DEPLOY_KUBECONFIG_PATH" ]; then
            cp "$TENCENT_DEPLOY_KUBECONFIG_PATH" "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG_B64:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          elif [ -n "${TENCENT_DEPLOY_KUBECONFIG:-}" ]; then
            printf '%s' "$TENCENT_DEPLOY_KUBECONFIG" > "$kubeconfig"
          else
            echo "No deploy kubeconfig was provided for rollback." >&2
            exit 1
          fi
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Download rollback image set
        uses: actions/download-artifact@v4
        with:
          name: production-rollback-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-rollback-images

      - name: Restore previous Cloud images and ConfigMap
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          rollback_dir="$RUNNER_TEMP/production-rollback-images"
          for file in opl-cloud-control-plane opl-cloud-ledger opl-cloud-fabric opl-cloud-config.json; do
            test -s "$rollback_dir/$file"
          done
          source tools/tke-image-rollout.sh
          if [ "${{ inputs.bootstrap_mode }}" = "true" ]; then
            restore_command=restore_previous_bootstrap_images
          else
            restore_command=restore_previous_images
          fi
          if ! "$restore_command"; then
            echo "Rollback did not restore the previous Cloud images and ConfigMap." >&2
            exit 1
          fi

      - name: Remove rollback kubeconfig
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          secret_dir="${OPL_ROLLBACK_SECRET_DIR:-}"
          if [ -z "$secret_dir" ]; then
            exit 0
          fi
          case "$secret_dir" in
            "$RUNNER_TEMP"/*|/tmp/*) ;;
            *) echo "Refusing to remove unexpected rollback secret path." >&2; exit 1 ;;
          esac
          if [ -d "$secret_dir" ]; then
            find "$secret_dir" -mindepth 1 -delete
            rmdir "$secret_dir"
          fi

      - name: Remove isolated source checkout
        if: always() && steps.prepare_source.outcome == 'success'
        shell: bash
        env:
          OPL_SOURCE_CHECKOUT: ${{ github.workspace }}/.opl-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          source_dir="${OPL_SOURCE_CHECKOUT:-}"
          expected="$GITHUB_WORKSPACE/.opl-checkouts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          if [ -z "$source_dir" ] || [ "$source_dir" != "$expected" ]; then
            echo "Refusing to remove unexpected source checkout path." >&2
            exit 1
          fi
          if [ -d "$source_dir" ]; then
            find "$source_dir" -mindepth 1 -delete
            rmdir "$source_dir"
          fi
