name: Clean Host Qualification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character product commit already merged into main.
        required: true
        type: string
      cloud_image_ref:
        description: Exact OPL Cloud repository@sha256 image reference.
        required: true
        type: string
      workspace_image_ref:
        description: Exact Workspace repository@sha256 image reference.
        required: true
        type: string
      confirmation:
        description: Type RUN_ONE_REAL_BASIC_CLEAN_HOST_QUALIFICATION to acknowledge one real non-production Basic Workspace mutation.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: clean-host-qualification-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  clean_host_qualification:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: preproduction
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PRODUCT_REPOSITORY: ${{ github.repository }}
      PRODUCT_SHA: ${{ inputs.ref }}
      CLOUD_IMAGE_REF: ${{ inputs.cloud_image_ref }}
      WORKSPACE_IMAGE_REF: ${{ inputs.workspace_image_ref }}
      OPL_SUB2API_BASE_URL: ${{ vars.OPL_SUB2API_BASE_URL }}
      OPL_SUB2API_ADMIN_EMAIL: ${{ secrets.OPL_SUB2API_ADMIN_EMAIL }}
      OPL_SUB2API_ADMIN_PASSWORD: ${{ secrets.OPL_SUB2API_ADMIN_PASSWORD }}
      QUALIFICATION_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate clean-host inputs
        shell: bash
        run: |
          set -euo pipefail

          handoff='UPSTREAM_HANDOFF: provide workflow_dispatch ref, cloud_image_ref, workspace_image_ref, and confirmation=RUN_ONE_REAL_BASIC_CLEAN_HOST_QUALIFICATION; configure preproduction variable OPL_SUB2API_BASE_URL and preproduction Secrets OPL_SUB2API_ADMIN_EMAIL and OPL_SUB2API_ADMIN_PASSWORD; rerun clean-host qualification from refs/heads/main with exact merged main artifacts only.'
          blocked_env() {
            echo "BLOCKED_ENV: $1" >&2
            echo "$handoff" >&2
            exit 1
          }
          blocked_permission() {
            echo "BLOCKED_PERMISSION: $1" >&2
            echo "$handoff" >&2
            exit 1
          }

          # Guard exact workflow_dispatch identity from inputs.ref.
          if ! [[ "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            blocked_env "ref must be the exact checked-out 40-character product SHA."
          fi
          if [ "$QUALIFICATION_CONFIRMATION" != "RUN_ONE_REAL_BASIC_CLEAN_HOST_QUALIFICATION" ]; then
            blocked_permission "confirmation must acknowledge exactly one real non-production Basic clean-host qualification."
          fi
          if ! [[ "$CLOUD_IMAGE_REF" =~ ^ghcr\.io/[^[:space:]]+@sha256:[0-9a-f]{64}$ ]]; then
            blocked_env "cloud_image_ref must be an immutable ghcr.io repository@sha256 reference."
          fi
          expected_cloud_prefix="ghcr.io/$PRODUCT_REPOSITORY@sha256:"
          if [[ "$CLOUD_IMAGE_REF" != "$expected_cloud_prefix"* ]]; then
            blocked_env "cloud_image_ref must target ghcr.io/$PRODUCT_REPOSITORY at an immutable digest."
          fi
          if ! [[ "$WORKSPACE_IMAGE_REF" =~ ^.+@sha256:[0-9a-f]{64}$ ]]; then
            blocked_env "workspace_image_ref must be an immutable repository@sha256 reference."
          fi
          if ! [[ "$OPL_SUB2API_BASE_URL" =~ ^https://[^[:space:]]+$ ]]; then
            blocked_env "sub2api_base_url must be a public HTTPS origin."
          fi
          if ! [[ "$OPL_SUB2API_ADMIN_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            blocked_env "sub2api_admin_email must be a syntactically valid operator email."
          fi
          if [ -z "${OPL_SUB2API_ADMIN_PASSWORD:-}" ]; then
            blocked_permission "secret OPL_SUB2API_ADMIN_PASSWORD is not configured."
          fi

          if [ "$(git rev-parse HEAD)" != "$PRODUCT_SHA" ]; then
            blocked_env "ref must match the checked-out product SHA."
          fi
          git fetch --no-tags "https://github.com/$PRODUCT_REPOSITORY.git" main:refs/remotes/clean-host-source/main
          if ! git merge-base --is-ancestor "$PRODUCT_SHA" refs/remotes/clean-host-source/main; then
            blocked_env "ref must already be merged into main."
          fi

          if ! docker buildx imagetools inspect "$CLOUD_IMAGE_REF" >/dev/null 2>&1; then
            blocked_permission "cloud_image_ref is unreadable from ubuntu-latest with current registry access."
          fi
          if ! docker pull "$CLOUD_IMAGE_REF" >/dev/null 2>&1; then
            blocked_permission "cloud_image_ref could not be pulled on ubuntu-latest with current registry access."
          fi
          cloud_revision="$(docker image inspect "$CLOUD_IMAGE_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$cloud_revision" != "$PRODUCT_SHA" ]; then
            blocked_env "cloud_image_ref revision label must equal ref."
          fi
          if ! docker buildx imagetools inspect "$WORKSPACE_IMAGE_REF" >/dev/null 2>&1; then
            blocked_permission "workspace_image_ref is unreadable from ubuntu-latest with current registry access."
          fi

          compose_project="opl-clean-host-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          env_file="$RUNNER_TEMP/${compose_project}.env"
          override_file="$RUNNER_TEMP/${compose_project}.override.yml"
          workspace_id_file="$RUNNER_TEMP/${compose_project}.workspace-id"
          umask 077
          launch_key="clean-host-launch:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          workspace_id="$(
            QUALIFICATION_LAUNCH_KEY="$launch_key" node --input-type=module <<'EOF'
          import { createHash } from "node:crypto";

          const stableID = (...parts) => {
            const hash = createHash("sha1");
            for (const part of parts) {
              hash.update(String(part));
              hash.update("\0");
            }
            return hash.digest("hex");
          };
          const operationId = `workspace-launch-${stableID("acct-admin", process.env.QUALIFICATION_LAUNCH_KEY).slice(0, 18)}`;
          process.stdout.write(`ws-${stableID("workspace-launch-v2", "acct-admin", operationId).slice(0, 18)}`);
          EOF
          )"
          if ! [[ "$workspace_id" =~ ^ws-[0-9a-f]{18}$ ]]; then
            blocked_env "deterministic clean-host Workspace identity could not be derived."
          fi
          printf '%s\n' "$workspace_id" > "$workspace_id_file"
          chmod 600 "$workspace_id_file"
          host_port="$(python3 - <<'PY'
          import socket
          sock = socket.socket()
          sock.bind(("127.0.0.1", 0))
          print(sock.getsockname()[1])
          sock.close()
          PY
          )"
          subnet_octet=$(( (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT) % 200 + 20 ))
          postgres_host="10.251.${subnet_octet}.10"
          public_url="http://127.0.0.1:${host_port}"

          postgres_admin_password="$(openssl rand -hex 32)"
          control_plane_password="$(openssl rand -hex 32)"
          fabric_password="$(openssl rand -hex 32)"
          ledger_password="$(openssl rand -hex 32)"
          control_plane_token="$(openssl rand -hex 32)"
          fabric_token="$(openssl rand -hex 32)"
          ledger_token="$(openssl rand -hex 32)"
          fabric_runner_token="$(openssl rand -hex 32)"
          fabric_capability_key="$(openssl rand -hex 32)"
          ledger_capability_key="$(openssl rand -hex 32)"
          aionui_seed="$(openssl rand -hex 32)"

          cat > "$env_file" <<EOF
          OPL_CLOUD_IMAGE=$CLOUD_IMAGE_REF
          OPL_BIND_ADDRESS=127.0.0.1
          OPL_HTTP_PORT=$host_port
          OPL_PUBLIC_URL=$public_url
          OPL_DOCKER_SUBNET=10.251.${subnet_octet}.0/24
          OPL_POSTGRES_HOST=$postgres_host
          OPL_POSTGRES_ADMIN_PASSWORD=$postgres_admin_password
          OPL_CONTROL_PLANE_DATABASE_PASSWORD=$control_plane_password
          OPL_FABRIC_DATABASE_PASSWORD=$fabric_password
          OPL_LEDGER_DATABASE_PASSWORD=$ledger_password
          OPL_CONTROL_PLANE_SERVICE_TOKEN=$control_plane_token
          OPL_FABRIC_SERVICE_TOKEN=$fabric_token
          OPL_LEDGER_SERVICE_TOKEN=$ledger_token
          OPL_FABRIC_RUNNER_SERVICE_TOKEN=$fabric_runner_token
          OPL_FABRIC_CAPABILITY_KEY=$fabric_capability_key
          OPL_LEDGER_CAPABILITY_KEY=$ledger_capability_key
          OPL_AIONUI_ADMIN_PASSWORD_SEED=$aionui_seed
          OPL_SUB2API_BASE_URL=$OPL_SUB2API_BASE_URL
          OPL_SUB2API_ADMIN_EMAIL=$OPL_SUB2API_ADMIN_EMAIL
          OPL_SUB2API_ADMIN_PASSWORD=$OPL_SUB2API_ADMIN_PASSWORD
          OPL_SUB2API_REQUEST_TIMEOUT_MS=5000
          OPL_WORKSPACE_IMAGE=$WORKSPACE_IMAGE_REF
          OPL_DOCKER_SOCKET_PATH=/var/run/docker.sock
          OPL_MONTHLY_BILLING_WORKER_ENABLED=0
          OPL_WORKSPACE_LAUNCH_WORKER_ENABLED=1
          OPL_FABRIC_LOCAL_DOCKER_TRUSTED_WORKSPACE_IMAGES=$WORKSPACE_IMAGE_REF
          OPL_FABRIC_LOCAL_DOCKER_HOST=127.0.0.1
          EOF
          chmod 600 "$env_file"
          cat > "$override_file" <<'EOF'
          services:
            control-plane:
              environment:
                OPL_CONTROLLED_BASIC_PILOT_ENABLED: "1"
                OPL_CONTROLLED_BASIC_PILOT_ACCOUNT_IDS: "acct-admin"
                OPL_CONTROLLED_BASIC_PILOT_MAX_IN_FLIGHT: "1"
          EOF
          chmod 600 "$override_file"

          echo "COMPOSE_PROJECT_NAME=$compose_project" >> "$GITHUB_ENV"
          echo "OPL_ENV_FILE=$env_file" >> "$GITHUB_ENV"
          echo "OPL_COMPOSE_OVERRIDE_FILE=$override_file" >> "$GITHUB_ENV"
          echo "OPL_WORKSPACE_ID_FILE=$workspace_id_file" >> "$GITHUB_ENV"
          echo "OPL_PUBLIC_URL=$public_url" >> "$GITHUB_ENV"

          echo "COMPOSE_PROJECT_NAME=$compose_project"
          docker compose --project-name "$compose_project" --env-file "$env_file" \
            -f compose.yaml -f deploy/portable/compose.local-workspace.yaml -f "$override_file" config --quiet

      - name: Qualify clean host workspace runtime
        shell: bash
        run: |
          set -euo pipefail

          docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$OPL_ENV_FILE" -f compose.yaml -f deploy/portable/compose.local-workspace.yaml -f "$OPL_COMPOSE_OVERRIDE_FILE" up -d --wait --wait-timeout 300

          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          const origin = process.env.OPL_PUBLIC_URL;
          const email = process.env.OPL_SUB2API_ADMIN_EMAIL;
          const password = process.env.OPL_SUB2API_ADMIN_PASSWORD;
          const runIdentity = `${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const readinessPath = "/api/runtime/readiness";
          const mePath = "/api/auth/me";
          const walletPath = "/api/gateway/wallet";
          const usageSummaryPath = "/api/gateway/usage-summary?period=month";
          const pricingPreviewPath = "/api/pricing/preview";
          const launchPath = "/api/workspace-launches";
          const listPath = "/api/workspaces?page=1&pageSize=20";
          const runtimePath = (workspaceId) => `/api/workspaces/${workspaceId}/runtime-status`;
          const workspaceRoute = (workspaceId) => `/w/${workspaceId}/`;
          const deletePath = (workspaceId) => `/api/workspaces/${workspaceId}`;

          const loginPermissionFailure = "BLOCKED_PERMISSION: Sub2API operator authentication rejected the clean-host credentials.\nUPSTREAM_HANDOFF: provide active reserved Cloud operator credentials that map to acct-admin, then rerun clean-host qualification.";
          const sourceUnavailableFailure = "BLOCKED_ENV: Sub2API source is unavailable for clean-host qualification.\nUPSTREAM_HANDOFF: restore the configured Sub2API endpoint and source health, then rerun clean-host qualification.";
          const sourcePermissionFailure = "BLOCKED_PERMISSION: Sub2API source authorization rejected the clean-host session.\nUPSTREAM_HANDOFF: provide active reserved Cloud operator credentials authorized for acct-admin Sub2API readback, then rerun clean-host qualification.";
          const balancePermissionFailure = "BLOCKED_PERMISSION: reserved Cloud operator balance is insufficient for the Basic 10 GB qualification launch.\nUPSTREAM_HANDOFF: fund the reserved acct-admin operator balance for the quoted Basic 10 GB charge, then rerun clean-host qualification.";
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const fail = (message) => { throw new Error(message); };
          const runtimeEnvironmentHandoff = "UPSTREAM_HANDOFF: inspect the exact clean-host Compose project diagnostics and authoritative Control Plane/Fabric readback for this run; restore the runtime environment, then rerun the same main-branch qualification.";
          const blockedEnvironment = (reason) => fail(`BLOCKED_ENV: ${reason}\n${runtimeEnvironmentHandoff}`);
          const blockedError = (error, fallbackReason) =>
            error instanceof Error && /^(BLOCKED_ENV|BLOCKED_PERMISSION):/.test(error.message)
              ? error
              : new Error(`BLOCKED_ENV: ${fallbackReason}\n${runtimeEnvironmentHandoff}`);

          let expectedWorkspaceId = "";
          try {
            expectedWorkspaceId = (await readFile(process.env.OPL_WORKSPACE_ID_FILE, "utf8")).trim();
          } catch {
            blockedEnvironment("Workspace identity readback failed.");
          }

          function responseCookie(headers) {
            const value = headers.get("set-cookie");
            return value ? value.split(";", 1)[0] : "";
          }

          async function request(path, init = {}, auth = null, environmentFailure = "Runtime API readback failed.") {
            const headers = new Headers(init.headers || {});
            if (auth?.cookie) headers.set("cookie", auth.cookie);
            if (auth?.csrf) headers.set("x-opl-csrf", auth.csrf);
            if (init.body !== undefined && !headers.has("content-type")) headers.set("content-type", "application/json");
            let response;
            let text;
            try {
              response = await fetch(`${origin}${path}`, {
                ...init,
                headers,
                body: init.body !== undefined ? JSON.stringify(init.body) : undefined,
                redirect: "follow"
              });
              text = await response.text();
            } catch {
              blockedEnvironment(environmentFailure);
            }
            let payload = null;
            try {
              payload = text ? JSON.parse(text) : null;
            } catch {
              payload = null;
            }
            return { response, payload, bodyPresent: Boolean(text?.trim()) };
          }

          async function requestJson(path, init = {}, auth = null, environmentFailure = "Runtime API readback failed.") {
            const result = await request(path, init, auth, environmentFailure);
            if (!result.response.ok) {
              blockedEnvironment(environmentFailure);
            }
            return result.payload;
          }

          async function requestSource(path, expectedSource, auth, options = {}) {
            const environmentFailure = options.environmentFailure || "Authoritative source readback failed.";
            const result = await request(path, {}, auth, environmentFailure);
            if (!result.response.ok) {
              if (expectedSource === "sub2api") {
                fail([401, 403].includes(result.response.status) ? sourcePermissionFailure : sourceUnavailableFailure);
              }
              blockedEnvironment(environmentFailure);
            }
            const payload = result.payload;
            const statusAccepted = payload?.status === "available" || (options.allowEmpty === true && payload?.status === "empty");
            if (!payload || payload.source !== expectedSource || payload.available !== true || !statusAccepted) {
              if (expectedSource === "sub2api") fail(sourceUnavailableFailure);
              blockedEnvironment(environmentFailure);
            }
            return payload;
          }

          if (!/^ws-[0-9a-f]{18}$/.test(expectedWorkspaceId)) {
            blockedEnvironment("Workspace identity readback failed.");
          }

          let auth = null;
          let workspaceId = "";
          let launch = null;
          let qualificationFailure = null;
          try {
            const readiness = await request(readinessPath, {}, null, "Runtime readiness readback failed.");
            if (readiness.response.status !== 200) {
              blockedEnvironment("Runtime readiness readback failed.");
            }

            const login = await request("/api/auth/login", {
              method: "POST",
              body: { email, password }
            }, null, "Clean-host authentication endpoint readback failed.");
            if (!login.response.ok) {
              if ([401, 403].includes(login.response.status)) fail(loginPermissionFailure);
              fail("BLOCKED_ENV: clean-host authentication endpoint is unavailable.\nUPSTREAM_HANDOFF: restore the configured Sub2API authentication path, then rerun clean-host qualification.");
            }
            auth = {
              cookie: responseCookie(login.response.headers),
              csrf: login.response.headers.get("x-opl-csrf-token") || ""
            };
            if (!auth.cookie || !auth.csrf) {
              fail("BLOCKED_PERMISSION: clean-host login did not establish the required operator session.\nUPSTREAM_HANDOFF: provide active reserved Cloud operator credentials that map to acct-admin, then rerun clean-host qualification.");
            }

            const accountId = String(login.payload?.user?.accountId || "").trim();
            if (accountId !== "acct-admin") {
              fail("BLOCKED_PERMISSION: clean-host operator credentials did not resolve to acct-admin.\nUPSTREAM_HANDOFF: provide active reserved Cloud operator credentials that map to acct-admin, then rerun clean-host qualification.");
            }
            const me = await requestSource(mePath, "sub2api", auth);
            if (String(me.data?.accountId || "").trim() !== accountId || String(me.data?.email || "").trim().toLowerCase() !== email.toLowerCase() ||
              String(me.data?.status || "") !== "active" || !String(me.data?.sub2apiUserId || "").trim()) {
              fail("BLOCKED_PERMISSION: Sub2API operator identity is inactive or does not match acct-admin.\nUPSTREAM_HANDOFF: provide an active reserved Cloud operator identity mapped to acct-admin, then rerun clean-host qualification.");
            }
            const wallet = await requestSource(walletPath, "sub2api", auth);
            const walletBalance = String(wallet.data?.usdMicros || "");
            if (String(wallet.data?.userId || "") !== String(me.data.sub2apiUserId) || wallet.data?.currency !== "USD" ||
              !/^(0|[1-9][0-9]*)$/.test(walletBalance)) {
              fail(sourceUnavailableFailure);
            }
            if (String(wallet.data?.status || "") !== "active") {
              fail("BLOCKED_PERMISSION: reserved Cloud operator wallet is not active.\nUPSTREAM_HANDOFF: activate the acct-admin Sub2API wallet, then rerun clean-host qualification.");
            }
            const usageSummary = await requestSource(usageSummaryPath, "sub2api", auth);
            if (!usageSummary.data || Array.isArray(usageSummary.data) || typeof usageSummary.data !== "object") {
              fail(sourceUnavailableFailure);
            }

            const launchBody = {
              name: `clean-host-${runIdentity}`,
              packageId: "basic",
              sizeGb: 10,
              autoRenew: false
            };
            const pricing = await requestJson(pricingPreviewPath, {
              method: "POST",
              body: { resourceType: "workspace", packageId: launchBody.packageId, sizeGb: launchBody.sizeGb }
            }, auth, "Pricing preview readback failed.");
            const quotedCharge = String(pricing?.totalChargeUsdMicros || "");
            if (!/^[1-9][0-9]*$/.test(quotedCharge)) {
              blockedEnvironment("Pricing preview readback failed.");
            }
            if (BigInt(walletBalance) < BigInt(quotedCharge)) {
              fail(balancePermissionFailure);
            }

            workspaceId = expectedWorkspaceId;
            const launchAttempt = await request(launchPath, {
              method: "POST",
              headers: { "Idempotency-Key": `clean-host-launch:${runIdentity}` },
              body: launchBody
            }, auth, "Workspace launch request failed.");
            if (!launchAttempt.response.ok) {
              const code = String(launchAttempt.payload?.error || "");
              if (launchAttempt.response.status === 409 &&
                ["workspace_launch_account_not_allowed", "workspace_launch_admission_disabled", "workspace_launch_admission_invalid"].includes(code)) {
                fail("BLOCKED_PERMISSION: clean-host launch allowlist rejected the provided operator identity.\nUPSTREAM_HANDOFF: rerun with active reserved Cloud operator credentials that map to acct-admin.");
              }
              if (launchAttempt.response.status === 409 && code === "monthly_balance_insufficient") {
                fail(balancePermissionFailure);
              }
              if (launchAttempt.response.status === 502 && code === "upstream_unavailable") {
                fail(sourceUnavailableFailure);
              }
              blockedEnvironment("Workspace launch request failed.");
            }

            launch = launchAttempt.payload;
            if (!launch?.operationId) {
              blockedEnvironment("Workspace launch identity readback failed.");
            }

            for (let attempt = 0; attempt < 90; attempt += 1) {
              if (launch.status === "succeeded" && launch.phase === "succeeded") break;
              if (["manual_review", "failed", "refunded"].includes(String(launch.status || ""))) {
                if (String(launch.errorCode || "") === "monthly_balance_insufficient") {
                  fail(balancePermissionFailure);
                }
                blockedEnvironment("Workspace launch terminal readback failed.");
              }
              await sleep(5000);
              launch = await requestJson(
                `${launchPath}/${encodeURIComponent(launch.operationId)}`,
                {},
                auth,
                "Workspace launch polling request failed."
              );
            }

            const reportedWorkspaceId = String(launch.workspaceId || "");
            if (launch.status !== "succeeded" || launch.phase !== "succeeded" || reportedWorkspaceId !== expectedWorkspaceId || !launch.url || !launch.receiptId) {
              blockedEnvironment("Workspace launch completion readback failed.");
            }
            workspaceId = String(launch.workspaceId || workspaceId);

            const launchList = await requestJson(launchPath, {}, auth, "Workspace launch list readback failed.");
            if (!Array.isArray(launchList) || !launchList.some((candidate) => candidate?.operationId === launch.operationId)) {
              blockedEnvironment("Workspace launch list readback failed.");
            }

            const workspaces = await requestSource(listPath, "control-plane", auth, {
              environmentFailure: "Workspace readback failed."
            });
            const workspace = Array.isArray(workspaces.data?.items)
              ? workspaces.data.items.find((candidate) => candidate?.id === workspaceId)
              : null;
            if (!workspace || workspace.url !== launch.url) {
              blockedEnvironment("Workspace readback failed.");
            }

            const runtimeEnvelope = await requestSource(runtimePath(workspaceId), "fabric", auth, {
              environmentFailure: "Workspace runtime readback failed."
            });
            const runtime = runtimeEnvelope.data;
            if (!runtime || runtime.workspaceId !== workspaceId || runtime.status !== "running" || runtime.ready !== true || runtime.url !== launch.url) {
              blockedEnvironment("Workspace runtime readback failed.");
            }

            const open = await request(
              workspaceRoute(workspaceId),
              { redirect: "follow" },
              null,
              "Workspace open readback failed."
            );
            if (!open.response.ok || !open.bodyPresent) {
              blockedEnvironment("Workspace open readback failed.");
            }
          } catch (error) {
            qualificationFailure = blockedError(error, "Clean-host runtime qualification failed.");
          } finally {
            if (workspaceId && auth) {
              try {
                const deletion = await request(deletePath(workspaceId), {
                  method: "DELETE",
                  headers: { "Idempotency-Key": `clean-host-delete:${workspaceId}:${runIdentity}` }
                }, auth, "Workspace owner-authorized DELETE readback failed.");
                if (deletion.response.status === 404) {
                  if (!qualificationFailure) {
                    blockedEnvironment("Workspace owner-authorized DELETE readback failed.");
                  }
                } else if (!deletion.response.ok || deletion.payload?.workspaceId !== workspaceId || deletion.payload?.status !== "deleted") {
                  blockedEnvironment("Workspace owner-authorized DELETE readback failed.");
                }

                let absent = false;
                for (let attempt = 0; attempt < 30; attempt += 1) {
                  const page = await requestSource(listPath, "control-plane", auth, {
                    allowEmpty: true,
                    environmentFailure: "Workspace delete absence readback failed."
                  });
                  const present = Array.isArray(page.data?.items) && page.data.items.some((candidate) => candidate?.id === workspaceId);
                  if (!present) {
                    absent = true;
                    break;
                  }
                  await sleep(2000);
                }
                if (!absent) {
                  blockedEnvironment("Workspace delete absence readback failed.");
                }

                const runtimeAfterDelete = await request(
                  runtimePath(workspaceId),
                  {},
                  auth,
                  "Workspace runtime delete readback failed."
                );
                if (runtimeAfterDelete.response.status !== 404) {
                  blockedEnvironment("Workspace runtime delete readback failed.");
                }
              } catch (cleanupError) {
                const cleanupFailure = blockedError(cleanupError, "Workspace owner-authorized DELETE/readback failed.");
                if (!qualificationFailure) {
                  qualificationFailure = cleanupFailure;
                } else {
                  console.error(`BLOCKED_ENV: owner-authorized DELETE/readback also failed; exact-label residual cleanup will run.\n${runtimeEnvironmentHandoff}`);
                }
              }
            }
          }

          if (qualificationFailure) throw qualificationFailure;
          console.log(JSON.stringify({
            workspaceId,
            operationId: launch.operationId,
            receiptId: launch.receiptId,
            composeProject: process.env.COMPOSE_PROJECT_NAME
          }, null, 2));
          EOF

      - name: Dump clean-host compose diagnostics
        if: ${{ failure() && env.COMPOSE_PROJECT_NAME != '' && env.OPL_ENV_FILE != '' && env.OPL_COMPOSE_OVERRIDE_FILE != '' }}
        shell: bash
        run: |
          set +e
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$OPL_ENV_FILE" -f compose.yaml -f deploy/portable/compose.local-workspace.yaml -f "$OPL_COMPOSE_OVERRIDE_FILE" ps
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$OPL_ENV_FILE" -f compose.yaml -f deploy/portable/compose.local-workspace.yaml -f "$OPL_COMPOSE_OVERRIDE_FILE" logs --no-color --tail=200

      - name: Remove exact clean-host workspace residuals
        if: ${{ always() && env.COMPOSE_PROJECT_NAME != '' && env.OPL_ENV_FILE != '' && env.OPL_COMPOSE_OVERRIDE_FILE != '' && env.OPL_WORKSPACE_ID_FILE != '' }}
        shell: bash
        run: |
          set -euo pipefail

          handoff='UPSTREAM_HANDOFF: inspect only resources carrying provider=local-docker, account=acct-admin, and this run exact Workspace ID; inspect the exact Compose project control-plane/fabric stop status; reconcile no unlabeled or foreign Docker resource.'
          blocked_env() {
            echo "BLOCKED_ENV: $1" >&2
            echo "$handoff" >&2
            exit 1
          }
          if ! docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$OPL_ENV_FILE" -f compose.yaml -f deploy/portable/compose.local-workspace.yaml -f "$OPL_COMPOSE_OVERRIDE_FILE" stop --timeout 30 control-plane fabric; then
            echo "Exact clean-host mutating services did not stop gracefully; attempting bounded exact-project kill." >&2
            if ! docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$OPL_ENV_FILE" -f compose.yaml -f deploy/portable/compose.local-workspace.yaml -f "$OPL_COMPOSE_OVERRIDE_FILE" kill control-plane fabric; then
              echo "Exact clean-host mutating service fallback kill failed; verifying authoritative running state." >&2
            fi
          fi
          running_mutators=""
          if ! running_mutators="$(docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$OPL_ENV_FILE" -f compose.yaml -f deploy/portable/compose.local-workspace.yaml -f "$OPL_COMPOSE_OVERRIDE_FILE" ps --status running --services control-plane fabric)"; then
            blocked_env "exact clean-host mutating service status readback failed before residual cleanup."
          elif [ -n "$running_mutators" ]; then
            blocked_env "exact clean-host mutating services remain running before residual cleanup."
          fi
          if [ ! -s "$OPL_WORKSPACE_ID_FILE" ]; then
            blocked_env "exact clean-host Workspace identity file is unavailable for residual cleanup."
          fi
          workspace_id="$(tr -d '\r\n' < "$OPL_WORKSPACE_ID_FILE")"
          if ! [[ "$workspace_id" =~ ^ws-[0-9a-f]{18}$ ]]; then
            blocked_env "exact clean-host Workspace identity is invalid; refusing residual cleanup."
          fi

          provider_label="opl.fabric.provider=local-docker"
          account_label="opl.account.id=acct-admin"
          workspace_label="opl.workspace.id=$workspace_id"
          expected_labels="local-docker|acct-admin|$workspace_id"

          container_ids="$(docker ps -aq --filter "label=$provider_label" --filter "label=$account_label" --filter "label=$workspace_label")" ||
            blocked_env "exact clean-host container readback failed."
          while IFS= read -r resource_id; do
            [ -n "$resource_id" ] || continue
            actual_labels="$(docker inspect --format '{{ index .Config.Labels "opl.fabric.provider" }}|{{ index .Config.Labels "opl.account.id" }}|{{ index .Config.Labels "opl.workspace.id" }}' "$resource_id")" ||
              blocked_env "exact clean-host container ownership readback failed."
            if [ "$actual_labels" != "$expected_labels" ]; then
              blocked_env "container ownership labels changed; refusing cleanup."
            fi
            docker rm -f "$resource_id" ||
              blocked_env "exact clean-host container removal failed."
          done <<< "$container_ids"

          volume_ids="$(docker volume ls -q --filter "label=$provider_label" --filter "label=$account_label" --filter "label=$workspace_label")" ||
            blocked_env "exact clean-host volume readback failed."
          while IFS= read -r resource_id; do
            [ -n "$resource_id" ] || continue
            actual_labels="$(docker volume inspect --format '{{ index .Labels "opl.fabric.provider" }}|{{ index .Labels "opl.account.id" }}|{{ index .Labels "opl.workspace.id" }}' "$resource_id")" ||
              blocked_env "exact clean-host volume ownership readback failed."
            if [ "$actual_labels" != "$expected_labels" ]; then
              blocked_env "volume ownership labels changed; refusing cleanup."
            fi
            docker volume rm "$resource_id" ||
              blocked_env "exact clean-host volume removal failed."
          done <<< "$volume_ids"

          network_ids="$(docker network ls -q --filter "label=$provider_label" --filter "label=$account_label" --filter "label=$workspace_label")" ||
            blocked_env "exact clean-host network readback failed."
          while IFS= read -r resource_id; do
            [ -n "$resource_id" ] || continue
            actual_labels="$(docker network inspect --format '{{ index .Labels "opl.fabric.provider" }}|{{ index .Labels "opl.account.id" }}|{{ index .Labels "opl.workspace.id" }}' "$resource_id")" ||
              blocked_env "exact clean-host network ownership readback failed."
            if [ "$actual_labels" != "$expected_labels" ]; then
              blocked_env "network ownership labels changed; refusing cleanup."
            fi
            docker network rm "$resource_id" ||
              blocked_env "exact clean-host network removal failed."
          done <<< "$network_ids"

          remaining_containers="$(docker ps -aq --filter "label=$provider_label" --filter "label=$account_label" --filter "label=$workspace_label")" ||
            blocked_env "exact clean-host container absence readback failed."
          remaining_volumes="$(docker volume ls -q --filter "label=$provider_label" --filter "label=$account_label" --filter "label=$workspace_label")" ||
            blocked_env "exact clean-host volume absence readback failed."
          remaining_networks="$(docker network ls -q --filter "label=$provider_label" --filter "label=$account_label" --filter "label=$workspace_label")" ||
            blocked_env "exact clean-host network absence readback failed."
          if [ -n "$remaining_containers" ] || [ -n "$remaining_volumes" ] || [ -n "$remaining_networks" ]; then
            blocked_env "exact clean-host Workspace residuals remain after cleanup."
          fi

      - name: Tear down isolated compose project
        if: ${{ always() && env.COMPOSE_PROJECT_NAME != '' && env.OPL_ENV_FILE != '' && env.OPL_COMPOSE_OVERRIDE_FILE != '' }}
        shell: bash
        run: |
          set +e
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$OPL_ENV_FILE" -f compose.yaml -f deploy/portable/compose.local-workspace.yaml -f "$OPL_COMPOSE_OVERRIDE_FILE" down --volumes --remove-orphans
          rm -f "$OPL_ENV_FILE" "$OPL_COMPOSE_OVERRIDE_FILE" "$OPL_WORKSPACE_ID_FILE"
